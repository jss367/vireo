[package]
name = "vireo-detail-experiment"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "vireo_detail_experiment"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.11"

[profile.release]
codegen-units = 1
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
