[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vireo-keeper-evaluation"
version = "0.1.0"
description = "Read-only native-region curation and held-out evaluation of wildlife keeper evidence"
requires-python = ">=3.14"
dependencies = ["Pillow>=12.1.1", "rawpy>=0.26.1", "scipy>=1.17.1", "flask>=3.1.3", "numpy>=2.4.2", "onnxruntime>=1.22.0", "exifread>=3.0"]

[project.optional-dependencies]
test = ["pytest>=9.0", "ruff>=0.15.8", "build>=1.2", "setuptools>=75", "wheel"]

[project.scripts]
vireo-evaluate-keepers = "keeper_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keeper_eval = ["review.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
