name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      website: ${{ steps.filter.outputs.website }}
      build: ${{ steps.filter.outputs.build }}
      full: ${{ steps.filter.outputs.full }}

    steps:
      - name: Classify changed files
        id: filter
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const paths = files.flatMap((file) =>
              [file.filename, file.previous_filename].filter(Boolean)
            );
            const touchesTestWorkflow = paths.includes(".github/workflows/test.yml");

            // Escape hatch: the ``ci-full-suite`` label forces the whole unit
            // suite on this PR instead of the impact-selected subset. Read
            // live (not from the event payload) so "Re-run all jobs" after
            // labelling picks it up without a new push.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const full = pr.labels.some((label) => label.name === "ci-full-suite");

            // Keep this predicate in sync with ``select_tests.py``'s
            // ``FULL_SUITE_PATHS`` / ``FULL_SUITE_PREFIXES``: a path that
            // forces the selector's full-suite fallback must also mark this
            // PR as touching Python, otherwise the ``unit`` job takes its
            // skip path and the fallback never runs. Notably, the root
            // ``conftest.py`` registers the ``--selected-tests`` plugin and
            // can alter every test; ``test-main.yml`` publishes the map.
            const python = full || touchesTestWorkflow || paths.some((path) =>
              path.startsWith("vireo/") ||
              path.startsWith("tests/") ||
              path.startsWith(".github/actions/") ||
              path === ".github/workflows/pr-agent.yml" ||
              path === ".github/workflows/test-main.yml" ||
              path === ".github/workflows/main-health.yml" ||
              path === "docs/pr-agent-routine-prompt.md" ||
              (path.startsWith("scripts/") && path.endsWith(".py")) ||
              ["pyproject.toml", "uv.lock", "conftest.py"].includes(path)
            );

            const website = touchesTestWorkflow || paths.some((path) =>
              path.startsWith("website/") ||
              path === "vireo/static/help.json" ||
              path === ".github/workflows/deploy-website.yml"
            );

            const build = paths.some((path) =>
              path.startsWith("src-tauri/") ||
              path === "package.json" ||
              path === "package-lock.json" ||
              path === ".github/workflows/build-release.yml"
            );

            core.setOutput("python", String(python));
            core.setOutput("website", String(website));
            core.setOutput("build", String(build));
            core.setOutput("full", String(full));

            await core.summary
              .addHeading("Change classification")
              .addList([
                `Python tests: ${python ? (full ? "run (full suite, ci-full-suite label)" : "run (impact-selected subset)") : "skip"}`,
                `Website build: ${website ? "run" : "skip"}`,
                `Build-only paths changed: ${build ? "yes" : "no"}`,
              ])
              .write();

  # Impact-selected unit tests on Linux only. ``scripts/select_tests.py``
  # maps the PR's diff onto the per-test coverage recorded by the last
  # post-merge "Full tests" run (test-main.yml) and runs just the tests
  # that executed the changed functions. The complete suite on all three
  # OSes runs after merge instead; harness changes (conftest, pyproject,
  # these workflows, vireo/data) or the ``ci-full-suite`` label force the
  # full suite here. No map (cache miss) also falls back to the full suite,
  # so selection can only ever narrow a run, never skip one by accident.
  unit:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Skip Python tests
        if: needs.changes.outputs.python != 'true'
        run: |
          echo "No Python application, script, or test files changed."
          echo "Build-only paths changed: ${{ needs.changes.outputs.build }}"

      - uses: actions/checkout@v5
        if: needs.changes.outputs.python == 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-tests
        if: needs.changes.outputs.python == 'true'
        with:
          hf-token: ${{ secrets.HF_TOKEN }}

      # ``key`` hits exactly when main hasn't moved since the map was built;
      # ``restore-keys`` otherwise picks the newest map published by any
      # merge. Cache keys are immutable, so a SHA suffix is what makes each
      # merge's map distinct.
      - name: Restore test-impact map
        if: needs.changes.outputs.python == 'true' && needs.changes.outputs.full != 'true'
        uses: actions/cache/restore@v5
        with:
          path: .test-impact
          key: test-impact-map-${{ github.event.pull_request.base.sha }}
          restore-keys: test-impact-map-

      - name: Select tests for this change
        id: select
        if: needs.changes.outputs.python == 'true'
        shell: bash
        env:
          FORCE_FULL: ${{ needs.changes.outputs.full }}
        run: |
          mkdir -p .test-impact
          if [ "$FORCE_FULL" = "true" ]; then
            mode=full
            echo "mode: full (ci-full-suite label)" | tee .test-impact/select.log
          else
            set +e
            python scripts/select_tests.py --explain --output .test-impact/selected.txt \
              > .test-impact/mode.txt 2> .test-impact/select.log
            status=$?
            set -e
            cat .test-impact/select.log
            mode=$(cat .test-impact/mode.txt)
            if [ "$status" -ne 0 ] || [ -z "$mode" ]; then
              echo "select_tests.py failed (exit $status); running the full suite instead."
              mode=full
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo "## Unit test selection"
            echo
            echo '```'
            head -n 40 .test-impact/select.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test selection
        if: needs.changes.outputs.python == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: test-selection
          path: |
            .test-impact/select.log
            .test-impact/selected.txt
          if-no-files-found: ignore
          retention-days: 7

      # Cap xdist workers at 2 for the same reason as the post-merge run:
      # several heavy ML/pipeline tests loading models on parallel workers
      # can trip the Linux OOM killer and cancel the whole run.
      - name: Run selected tests
        if: needs.changes.outputs.python == 'true' && steps.select.outputs.mode == 'subset'
        run: >-
          python -m pytest tests/ vireo/tests/ --selected-tests .test-impact/selected.txt
          -n 2 -v --tb=short --timeout=120 --timeout-method=thread

      - name: Run full suite
        if: needs.changes.outputs.python == 'true' && steps.select.outputs.mode == 'full'
        run: python -m pytest tests/ vireo/tests/ -n 2 -v --tb=short --timeout=120 --timeout-method=thread

      - name: No unit tests exercise this change
        if: needs.changes.outputs.python == 'true' && steps.select.outputs.mode == 'none'
        run: echo "No unit test executed the changed code on main; nothing to run. Browser smoke tests still run."

  # Aggregate gate: a single check named ``test`` that branch protection can
  # require, independent of which jobs run above. This job collapses every
  # required validation into one stable ``test`` check.
  test:
    needs: [unit, lint, e2e-smoke, rust, performance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all required checks succeeded
        run: |
          failures=0
          for check in \
            'unit=${{ needs.unit.result }}' \
            'lint=${{ needs.lint.result }}' \
            'e2e-smoke=${{ needs.e2e-smoke.result }}' \
            'rust=${{ needs.rust.result }}' \
            'performance=${{ needs.performance.result }}'; do
            echo "$check"
            if [ "${check#*=}" != "success" ]; then failures=1; fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "One or more required validation jobs did not succeed."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 5

    steps:
      - name: Skip Python lint
        if: needs.changes.outputs.python != 'true'
        run: echo "No Python application, script, or test files changed."

      - uses: actions/checkout@v5
        if: needs.changes.outputs.python == 'true'
        with:
          persist-credentials: false

      - name: Set up Python
        if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        if: needs.changes.outputs.python == 'true'
        run: pip install ruff

      - name: Run ruff check
        if: needs.changes.outputs.python == 'true'
        run: ruff check vireo/ tests/

  e2e-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: changes
    timeout-minutes: 20

    steps:
      - name: Skip browser smoke tests
        if: needs.changes.outputs.python != 'true'
        run: echo "No application or browser-test files changed."

      - uses: actions/checkout@v5
        if: needs.changes.outputs.python == 'true'
        with:
          persist-credentials: false

      - name: Set up Python
        if: needs.changes.outputs.python == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Vireo and Chromium
        shell: bash
        if: needs.changes.outputs.python == 'true'
        run: |
          pip install -e ".[dev]"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Playwright downloads Chromium itself. The runner's unrelated
            # Chrome apt source can have inconsistent metadata during updates.
            sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
              /etc/apt/sources.list.d/google-chrome*.sources
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: Run critical browser journeys
        if: needs.changes.outputs.python == 'true'
        run: >-
          python -m pytest -o addopts='' -q
          tests/e2e/test_navigation.py::test_navbar_links_navigate_to_import
          tests/e2e/test_pipeline.py::test_pipeline_page_loads_with_stages
          tests/e2e/test_review.py::test_review_page_loads_with_predictions
          tests/e2e/test_browse_single_select.py::test_single_click_reveals_batch_bar
          tests/e2e/test_browse_lightbox.py::test_browse_lightbox_arrows_navigate
          tests/e2e/test_settings.py::test_settings_system_info_renders
          tests/e2e/test_browser_security.py::test_browser_transport_authenticates_internal_mutations

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: changes
    timeout-minutes: 20

    steps:
      - name: Skip Rust checks
        if: needs.changes.outputs.build != 'true'
        run: echo "No Tauri or build files changed."

      - uses: actions/checkout@v5
        if: needs.changes.outputs.build == 'true'
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.build == 'true'
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: needs.changes.outputs.build == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        if: needs.changes.outputs.build == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        if: needs.changes.outputs.build == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml

  performance:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15

    steps:
      - name: Skip performance budgets
        if: needs.changes.outputs.python != 'true'
        run: echo "No application files changed."

      - uses: actions/checkout@v5
        if: needs.changes.outputs.python == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: "3.14"

      - name: Install Vireo
        if: needs.changes.outputs.python == 'true'
        run: pip install -e .

      - name: Enforce 100,000-photo interactive budgets
        if: needs.changes.outputs.python == 'true'
        run: python scripts/benchmark_library.py --photos 100000 --enforce

  website:
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10

    steps:
      - name: Skip website build
        if: needs.changes.outputs.website != 'true'
        run: echo "No website files changed."

      - uses: actions/checkout@v5
        if: needs.changes.outputs.website == 'true'
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: needs.changes.outputs.website == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        if: needs.changes.outputs.website == 'true'
        working-directory: website
        run: npm ci

      - name: Build website
        if: needs.changes.outputs.website == 'true'
        working-directory: website
        run: npm run build
