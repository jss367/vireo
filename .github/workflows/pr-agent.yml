name: PR Agent

# Forwards PR events to the Vireo PR Fix Agent Claude Code routine
# (claude.ai/code/routines). The LLM work runs there, not here; this
# workflow classifies events and fires the routine with a text payload.
# See docs/pr-agent-routine.md for setup.
#
# Pure-bash merge jobs run here because they do not need an LLM.

on:
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [edited]
  push:
    branches: [main]
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Concurrency is scoped per job (see the `concurrency:` block on each job
# below) rather than workflow-wide. A workflow-wide `pr-agent-<PR>` group
# with `cancel-in-progress: true` would let an ignored generated comment
# cancel an in-flight `/merge` or approval-driven merge run for the
# same PR, and `workflow_run` events (which lack the PR-number fields)
# would fall back to `github.sha` so CI-fix runs on unrelated PRs sharing
# a base SHA would cancel each other. The per-job groups collapse only
# equivalent work: review-fix firers for the same PR collapse each other,
# CI-fix firers collapse per triggering PR, and merge jobs get their own
# group so they never race with — or get cancelled by — the review-fix
# lane.

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

env:
  HUMAN_MERGE_ACTORS: "jss367"
  CODEX_MERGE_ACTOR: "chatgpt-codex-connector[bot]"
  TRUSTED_PR_AUTHORS: "jss367"
  AGENT_LABEL: claude-agent

jobs:
  # A maintainer's /claude-fix is the manual full-state reconciliation path.
  # It uses a distinct task kind instead of a field embedded next to untrusted
  # feedback, so comment text can never forge the human override.
  activate:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/claude-fix')
      && !endsWith(github.event.comment.body, '<!-- pr-agent-generated -->')
      && !endsWith(github.event.comment.body, 'Generated by [Claude Code](https://claude.ai/code)_')
      && (github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR')
    concurrency:
      group: pr-agent-human-reconcile-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check live PR state
        id: live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Require an exact /claude-fix command as the first token on the
          # first line, not just any comment that starts with the string
          # /claude-fix. The job-level `startsWith` still matches prefixes
          # like /claude-fixation / /claude-fix-please and content after the
          # token on the same line; without a stricter parse those bodies
          # would fire the human-override reconcile-pr task and clear
          # pr-agent-needs-human, defeating the escalation safeguard.
          first_line=$(printf '%s' "$COMMENT_BODY" | head -n1 | tr -d '\r')
          first_token=${first_line%%[[:space:]]*}
          if [[ "$first_token" != "/claude-fix" ]]; then
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "Comment first token '${first_token}' is not an exact /claude-fix command; ignoring."
            exit 0
          fi

          pr_json=$(gh pr view "$PR" --repo "$REPO" \
            --json state,headRefOid,headRepositoryOwner,headRepository)
          state=$(jq -r '.state' <<< "$pr_json")
          head_sha=$(jq -r '.headRefOid' <<< "$pr_json")
          head_repo=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' <<< "$pr_json")
          if [[ "$state" == "OPEN" ]]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "PR #${PR} is ${state}; ignoring stale /claude-fix."
            exit 0
          fi
          if [[ "$head_repo" != "$REPO" ]]; then
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "PR #${PR} is from fork ${head_repo}; skipping write-capable reconciliation."
            exit 0
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Add agent label
        if: steps.live.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh label create "$AGENT_LABEL" \
            --repo "$REPO" \
            --color 5319e7 \
            --description "PRs handled by the Claude PR agent" \
            || true
          gh pr edit "$PR" --repo "$REPO" --add-label "$AGENT_LABEL"

      - uses: actions/checkout@v5
        if: steps.live.outputs.open == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fire routine
        id: routine
        if: steps.live.outputs.open == 'true'
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          repo: ${{ github.repository }}
          pr: ${{ github.event.issue.number }}
          expected-head: ${{ steps.live.outputs.head_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          payload: |
            Task: reconcile-pr
            PR: ${{ github.event.issue.number }}

      - name: Clear escalation after accepted reconciliation
        if: steps.routine.outputs.fired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh pr edit "$PR" --repo "$REPO" \
            --remove-label pr-agent-needs-human \
            || true

  # Route regular trusted comments on agent PRs back to the routine.
  # `/merge <sha>` is a merge command handled by the `merge-on-command`
  # job and must not also spawn the review-fix routine — otherwise the
  # routine could push a new head and invalidate the human's SHA-bound
  # merge authorization before the synchronous merge check.
  fix-comment-feedback:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'claude-agent')
      && !endsWith(github.event.comment.body, '<!-- pr-agent-generated -->')
      && !endsWith(github.event.comment.body, 'Generated by [Claude Code](https://claude.ai/code)_')
      && github.event.comment.body != '+1'
      && github.event.comment.body != '👍'
      && (github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
          || github.actor == 'chatgpt-codex-connector[bot]')
    concurrency:
      group: pr-agent-review-fix-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Distinguish human reconciliation commands from feedback
        id: route
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          echo "feedback=true" >> "$GITHUB_OUTPUT"
          first_line=$(printf '%s' "$COMMENT_BODY" | head -n1 | tr -d '\r')
          first_token=${first_line%%[[:space:]]*}
          if [[ "$first_token" == "/claude-fix" \
            && ( "$COMMENT_ASSOCIATION" == "OWNER" \
              || "$COMMENT_ASSOCIATION" == "COLLABORATOR" ) ]]; then
            echo "feedback=false" >> "$GITHUB_OUTPUT"
            echo "Exact human /claude-fix command is handled by the reconciliation lane."
          elif [[ "$COMMENT_BODY" =~ ^/merge[[:space:]]+([0-9a-fA-F]{7,40})[[:space:]]*$ ]]; then
            echo "feedback=false" >> "$GITHUB_OUTPUT"
            echo "Exact /merge command is handled by the merge-authorization lane."
          fi

      - uses: actions/checkout@v5
        if: steps.route.outputs.feedback == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fire routine
        if: steps.route.outputs.feedback == 'true'
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          repo: ${{ github.repository }}
          pr: ${{ github.event.issue.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          payload: |
            Task: address-comment
            PR: ${{ github.event.issue.number }}
            Comment author: ${{ github.event.comment.user.login }}
            Comment body:
            ${{ github.event.comment.body }}

  # Route non-approval reviews on agent PRs back to the routine.
  fix-comments:
    if: >-
      github.event_name == 'pull_request_review'
      && (github.event.action == 'submitted' || github.event.action == 'edited')
      && (github.event.review.state != 'approved' || github.event.action == 'edited')
      && !endsWith(github.event.review.body || '', '<!-- pr-agent-generated -->')
      && !endsWith(github.event.review.body || '', 'Generated by [Claude Code](https://claude.ai/code)_')
      && contains(github.event.pull_request.labels.*.name, 'claude-agent')
      && (github.event.review.author_association == 'OWNER'
          || github.event.review.author_association == 'COLLABORATOR'
          || github.actor == 'chatgpt-codex-connector[bot]')
    concurrency:
      group: pr-agent-review-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check for open review threads
        id: threads
        uses: ./.github/actions/has-open-threads
        with:
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # A non-empty review body from a human reviewer carries actionable
      # feedback even when no inline threads exist, so fire on body in that
      # case. Codex's review body is always the stock template and carries
      # no signal — its findings come as inline comments handled by the
      # thread gate — so skip body-firing when the actor is the Codex bot.
      - name: Check for actionable review body
        id: body
        env:
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          if [[ -n "$REVIEW_BODY" && "$REVIEW_ACTOR" != "chatgpt-codex-connector[bot]" ]]; then
            echo "has_actionable_body=true" >> "$GITHUB_OUTPUT"
            echo "Review by ${REVIEW_ACTOR} has a non-empty body; will fire routine."
          else
            echo "has_actionable_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fire routine
        if: steps.threads.outputs.needs_response == 'true' || steps.body.outputs.has_actionable_body == 'true'
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          payload: |
            Task: address-review
            PR: ${{ github.event.pull_request.number }}
            Review author: ${{ github.event.review.user.login }}
            Review state: ${{ github.event.review.state }}
            Review body:
            ${{ github.event.review.body }}

  # Route Codex connector reviews on non-agent PRs to the routine, then
  # the routine labels the PR so follow-up comments keep routing back.
  codex-review:
    if: >-
      github.event_name == 'pull_request_review'
      && (github.event.action == 'submitted' || github.event.action == 'edited')
      && github.event.review.state != 'approved'
      && !endsWith(github.event.review.body || '', '<!-- pr-agent-generated -->')
      && !endsWith(github.event.review.body || '', 'Generated by [Claude Code](https://claude.ai/code)_')
      && github.actor == 'chatgpt-codex-connector[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'claude-agent')
    concurrency:
      group: pr-agent-review-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Skip fork PRs
        id: fork-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pr_repo=$(gh pr view "$PR" \
            --repo "$REPO" \
            --json headRepositoryOwner,headRepository \
            --jq '.headRepositoryOwner.login + "/" + .headRepository.name')

          if [[ "$pr_repo" != "$REPO" ]]; then
            echo "PR is from fork ${pr_repo}; skipping."
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.fork-check.outputs.is_fork == 'false'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check for open review threads
        id: threads
        if: steps.fork-check.outputs.is_fork == 'false'
        uses: ./.github/actions/has-open-threads
        with:
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fire routine
        if: steps.fork-check.outputs.is_fork == 'false' && steps.threads.outputs.needs_response == 'true'
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          payload: |
            Task: address-codex-review
            PR: ${{ github.event.pull_request.number }}
            Review state: ${{ github.event.review.state }}
            Review body:
            ${{ github.event.review.body }}

  # Inline comment edits are separate webhook events from review-body edits.
  # Route them directly to state reconciliation even when their old thread is
  # resolved or outdated; the live snapshot decides whether the edit matters.
  fix-inline-comment:
    if: >-
      github.event_name == 'pull_request_review_comment'
      && github.event.pull_request.state == 'open'
      && !endsWith(github.event.comment.body, '<!-- pr-agent-generated -->')
      && !endsWith(github.event.comment.body, 'Generated by [Claude Code](https://claude.ai/code)_')
      && (contains(github.event.pull_request.labels.*.name, 'claude-agent')
          || github.actor == 'chatgpt-codex-connector[bot]')
      && (github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
          || github.actor == 'chatgpt-codex-connector[bot]')
    concurrency:
      group: pr-agent-review-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fire routine
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          payload: |
            Task: address-review
            PR: ${{ github.event.pull_request.number }}
            Review author: ${{ github.event.comment.user.login }}
            Review body:
            ${{ github.event.comment.body }}

  # Auto-fix when the Tests workflow fails on a PR.
  #
  # Concurrency group derives the PR number from
  # `workflow_run.pull_requests[0]` (populated for same-repo PRs). The
  # fallback to `workflow_run.head_sha` keys on the specific commit that
  # produced the failing run rather than `github.sha`, which for
  # `workflow_run` events is the default-branch head and would let
  # unrelated PRs' CI-fix runs cancel each other.
  #
  # The failing run's head SHA is what the routine diagnoses and what the
  # stale-head guard binds to; a run whose PR has advanced past that SHA
  # is dropped before fire so the routine never edits a newer commit
  # against older failure logs.
  fix-ci:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: pr-agent-ci-fix-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number and check for loops
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_PULL_REQUESTS: ${{ toJson(github.event.workflow_run.pull_requests) }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number=$(jq -r '.[0].number // empty' <<< "$WORKFLOW_RUN_PULL_REQUESTS")

          if [[ -z "$pr_number" ]]; then
            echo "No triggering PR found in workflow_run payload."
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_repo=$(gh pr view "$pr_number" --repo "${{ github.repository }}" \
            --json headRepositoryOwner,headRepository \
            --jq '.headRepositoryOwner.login + "/" + .headRepository.name')

          if [[ "$pr_repo" != "${{ github.repository }}" ]]; then
            echo "PR #${pr_number} is from fork ${pr_repo}; skipping."
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bind the CI-repair to the exact commit whose Tests run failed.
          # If the PR head has advanced past the failing run, the failure
          # logs describe a commit that is no longer the head; diagnosing
          # them while editing the newer commit would produce a phantom fix
          # against work that has already moved on. The stale-state guard
          # inside fire-routine catches the same drift, but skipping here
          # avoids spending a routine invocation on it.
          live_head=$(gh pr view "$pr_number" --repo "${{ github.repository }}" \
            --json headRefOid \
            --jq '.headRefOid')

          if [[ "$live_head" != "$WORKFLOW_RUN_HEAD_SHA" ]]; then
            echo "PR #${pr_number} head ${live_head} has advanced past the failing run's head ${WORKFLOW_RUN_HEAD_SHA}; skipping stale CI-fix."
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit=$(gh api "repos/${{ github.repository }}/commits/${WORKFLOW_RUN_HEAD_SHA}")
          commit_msg=$(jq -r '.commit.message' <<< "$commit")

          if grep -Fq "[pr-agent-fix-ci:${pr_number}]" <<< "$commit_msg"; then
            echo "PR head commit was already a CI fix attempt; not retrying."
            echo "should_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Will attempt to fix CI for PR #${pr_number} at ${WORKFLOW_RUN_HEAD_SHA}"
          {
            echo "pr_number=$pr_number"
            echo "head_sha=$WORKFLOW_RUN_HEAD_SHA"
            echo "should_fix=true"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.pr.outputs.should_fix == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fire routine
        if: steps.pr.outputs.should_fix == 'true'
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          repo: ${{ github.repository }}
          pr: ${{ steps.pr.outputs.pr_number }}
          expected-head: ${{ steps.pr.outputs.head_sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          payload: |
            Task: fix-ci
            PR: ${{ steps.pr.outputs.pr_number }}
            Workflow run: ${{ github.event.workflow_run.id }}

  # Discover orphaned conflicts both when a PR opens/updates and whenever main
  # moves. This intentionally does not require the claude-agent label: a PR
  # that opens conflicted may never receive a pull_request_review workflow run,
  # so label-gated discovery creates a permanent bootstrap deadlock.
  discover-conflicts:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'pull_request_target'
    concurrency:
      group: pr-agent-discover-conflicts-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.conflicts.outputs.targets }}
    steps:
      - name: Find conflicting trusted same-repository PRs
        id: conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            candidates="$EVENT_PR"
          else
            candidates=$(gh pr list --repo "$REPO" --state open --limit 1000 \
              --json number --jq '.[].number')
          fi

          targets='[]'
          for pr in $candidates; do
            mergeable="UNKNOWN"
            for attempt in 1 2 3 4 5 6; do
              pr_json=$(gh pr view "$pr" --repo "$REPO" \
                --json state,author,headRefOid,headRepositoryOwner,headRepository,mergeable)
              state=$(jq -r '.state' <<< "$pr_json")
              author=$(jq -r '.author.login' <<< "$pr_json")
              head_sha=$(jq -r '.headRefOid' <<< "$pr_json")
              head_repo=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' <<< "$pr_json")
              mergeable=$(jq -r '.mergeable' <<< "$pr_json")

              if [[ "$mergeable" != "UNKNOWN" ]]; then
                break
              fi

              echo "PR #${pr}: mergeability UNKNOWN on attempt ${attempt}; waiting."
              sleep 10
            done

            if [[ "$state" != "OPEN" ]]; then
              continue
            fi
            if [[ "$head_repo" != "$REPO" ]]; then
              echo "PR #${pr} is from fork ${head_repo}; skipping."
              continue
            fi
            if [[ " $TRUSTED_PR_AUTHORS " != *" $author "* ]]; then
              echo "PR #${pr} author ${author} is not trusted for automated reconciliation."
              continue
            fi
            if [[ "$mergeable" == "CONFLICTING" ]]; then
              echo "PR #${pr} is conflicting at ${head_sha}; scheduling one reconciliation pass."
              targets=$(jq -c \
                --argjson pr "$pr" \
                --arg head "$head_sha" \
                '. + [{"pr": $pr, "head": $head}]' <<< "$targets")
            elif [[ "$mergeable" == "UNKNOWN" ]]; then
              echo "PR #${pr} mergeability stayed UNKNOWN; leaving it for /claude-fix instead of dispatching speculatively."
            fi
          done

          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  reconcile-conflicts:
    needs: discover-conflicts
    if: needs.discover-conflicts.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover-conflicts.outputs.targets) }}
    concurrency:
      group: pr-agent-review-fix-${{ matrix.target.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fire routine
        id: routine
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          repo: ${{ github.repository }}
          pr: ${{ matrix.target.pr }}
          expected-head: ${{ matrix.target.head }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          payload: |
            Task: reconcile-pr-auto
            PR: ${{ matrix.target.pr }}

      - name: Add agent label after accepted reconciliation
        if: steps.routine.outputs.fired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.target.pr }}
        run: |
          gh label create "$AGENT_LABEL" --repo "$REPO" --color 5319e7 \
            --description "PRs handled by the Claude PR agent" || true
          gh pr edit "$PR" --repo "$REPO" --add-label "$AGENT_LABEL"

  # GitHub does not emit a workflow event for issue reactions. Discover a
  # Codex approval when its optional summary comment arrives, when Tests
  # succeeds, and on a short polling fallback. A bare reaction has no reviewed
  # SHA, so trust the configured connector's PR-level approval semantics while
  # requiring it to postdate the current head's first Tests run. That makes a
  # reaction already present before a later push stale.
  discover-codex-merge-authorizations:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.actor == 'chatgpt-codex-connector[bot]')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.authorizations.outputs.targets }}
    steps:
      - name: Find reviewed heads approved by Codex
        id: authorizations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.issue.number }}
          TESTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          TESTED_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            candidates=$(jq -r '.[0].number // empty' <<< "$TESTED_PRS")
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            candidates="$EVENT_PR"
          else
            candidates=$(gh pr list --repo "$REPO" --state open --limit 1000 \
              --json number --jq '.[].number')
          fi

          targets='[]'
          for pr in $candidates; do
            pr_json=$(gh pr view "$pr" --repo "$REPO" \
              --json state,isDraft,headRefOid,headRefName,baseRefName,headRepositoryOwner,headRepository)
            state=$(jq -r '.state' <<< "$pr_json")
            draft=$(jq -r '.isDraft' <<< "$pr_json")
            head_sha=$(jq -r '.headRefOid | ascii_downcase' <<< "$pr_json")
            head_ref=$(jq -r '.headRefName' <<< "$pr_json")
            base_ref=$(jq -r '.baseRefName' <<< "$pr_json")
            head_repo=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' <<< "$pr_json")

            if [[ "$state" != "OPEN" || "$draft" == "true" \
              || "$base_ref" != "main" || "$head_repo" != "$REPO" ]]; then
              continue
            fi
            if [[ "$EVENT_NAME" == "workflow_run" && "$head_sha" != "$TESTED_HEAD" ]]; then
              echo "PR #${pr} advanced beyond tested head ${TESTED_HEAD}; skipping stale Tests event."
              continue
            fi

            test_runs=$(gh run list --repo "$REPO" --workflow Tests \
              --branch "$head_ref" --event pull_request --limit 100 \
              --json databaseId,headSha,createdAt)
            first_head_test=$(jq -c --arg head "$head_sha" '
              [ .[] | select((.headSha | ascii_downcase) == $head) ]
              | sort_by(.createdAt)
              | first // empty' <<< "$test_runs")
            if [[ -z "$first_head_test" ]]; then
              echo "PR #${pr} has no Tests run that can bind a Codex reaction to ${head_sha}."
              continue
            fi
            tests_run_id=$(jq -r '.databaseId' <<< "$first_head_test")
            tests_started_at=$(jq -r '.createdAt' <<< "$first_head_test")

            reactions=$(gh api --paginate "repos/${REPO}/issues/${pr}/reactions" \
              --slurp | jq 'add // []')
            authorization=$(jq -cn \
              --argjson reactions "$reactions" \
              --arg bot "$CODEX_MERGE_ACTOR" \
              --arg tests_started_at "$tests_started_at" '
                [ $reactions[]
                  | select(.user.login == $bot)
                  | select(.content == "+1")
                  | select(.created_at > $tests_started_at)
                  | {
                      authorized_at: .created_at,
                      reaction_id: .id
                    }
                ]
                | sort_by(.authorized_at)
                | last // empty')

            if [[ -z "$authorization" ]]; then
              continue
            fi
            echo "Codex approved PR #${pr} at ${head_sha}."
            targets=$(jq -c \
              --argjson pr "$pr" \
              --arg head "$head_sha" \
              --argjson tests_run_id "$tests_run_id" \
              --argjson authorization "$authorization" \
              '. + [{
                pr: $pr,
                head: $head,
                authorized_at: $authorization.authorized_at,
                reaction_id: $authorization.reaction_id,
                tests_run_id: $tests_run_id
              }]' <<< "$targets")
          done

          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  merge-on-codex-reaction:
    needs: discover-codex-merge-authorizations
    if: needs.discover-codex-merge-authorizations.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover-codex-merge-authorizations.outputs.targets) }}
    concurrency:
      group: pr-agent-merge-codex-${{ matrix.target.pr }}-${{ matrix.target.reaction_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check live merge readiness
        id: ready
        uses: ./.github/actions/pr-merge-ready
        with:
          repo: ${{ github.repository }}
          pr: ${{ matrix.target.pr }}
          token: ${{ secrets.GITHUB_TOKEN }}
          approved-head: ${{ matrix.target.head }}
          authorized-at: ${{ matrix.target.authorized_at }}
          codex-reaction-id: ${{ matrix.target.reaction_id }}
          codex-tests-run-id: ${{ matrix.target.tests_run_id }}

      - name: Squash-merge Codex-approved head
        id: merge
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.target.pr }}
          HEAD_SHA: ${{ steps.ready.outputs.head-sha }}
          TITLE: ${{ steps.ready.outputs.title }}
        run: |
          if ! merge_output=$(gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --subject "${TITLE} (#${PR})" 2>&1); then
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            if [[ "$state" == "MERGED" ]]; then
              echo "PR #${PR} was merged by another valid authorization."
              exit 0
            fi
            echo "$merge_output"
            exit 1
          fi
          echo "Merged PR #${PR} after Codex approved head ${HEAD_SHA}."
          {
            echo "merged=true"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"

      # Merges made with GITHUB_TOKEN start no push workflows on main,
      # so start the post-merge suite explicitly.
      - name: Start post-merge workflows on main
        if: steps.merge.outputs.merged == 'true'
        uses: ./.github/actions/post-merge-dispatch
        with:
          repo: ${{ github.repository }}
          pr: ${{ steps.merge.outputs.pr }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # A human approval authorizes only the reviewed head. Current unresolved
  # threads, stale heads, forks, stacked children, non-main bases, and a Tests
  # run that is not successful all stop the synchronous merge. Nothing is
  # armed for a later head, eliminating the auto-merge authorization race.
  authorize_approval:
    if: >-
      github.event_name == 'pull_request_review'
      && github.event.action == 'submitted'
      && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.author.outputs.authorized }}
    steps:
      - name: Authorize human reviewer
        id: author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          REVIEW_HEAD: ${{ github.event.review.commit_id }}
        run: |
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          if [[ " $HUMAN_MERGE_ACTORS " != *" $REVIEW_AUTHOR "* ]]; then
            echo "Approval from ${REVIEW_AUTHOR} is not human merge authorization."
            exit 0
          fi
          live_head=$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid \
            --jq 'select(.state == "OPEN") | .headRefOid')
          if [[ -z "$live_head" || "$live_head" != "$REVIEW_HEAD" ]]; then
            echo "Approval for ${REVIEW_HEAD} does not match the open PR head ${live_head:-none}."
            exit 0
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"

  merge-on-approval:
    needs: authorize_approval
    if: needs.authorize_approval.outputs.authorized == 'true'
    concurrency:
      group: pr-agent-merge-approval-${{ github.event.pull_request.number }}-${{ github.event.review.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check live merge readiness
        id: ready
        uses: ./.github/actions/pr-merge-ready
        with:
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          approved-head: ${{ github.event.review.commit_id }}
          authorized-at: ${{ github.event.review.submitted_at }}
          approval-id: ${{ github.event.review.id }}

      - name: Squash-merge authorized head
        id: merge
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.ready.outputs.head-sha }}
          TITLE: ${{ steps.ready.outputs.title }}
        run: |
          if ! merge_output=$(gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --subject "${TITLE} (#${PR})" 2>&1); then
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            if [[ "$state" == "MERGED" ]]; then
              echo "PR #${PR} was merged by another valid authorization."
              exit 0
            fi
            echo "$merge_output"
            exit 1
          fi
          echo "Merged PR #${PR} at authorized head ${HEAD_SHA}."
          {
            echo "merged=true"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"

      # Merges made with GITHUB_TOKEN start no push workflows on main,
      # so start the post-merge suite explicitly.
      - name: Start post-merge workflows on main
        if: steps.merge.outputs.merged == 'true'
        uses: ./.github/actions/post-merge-dispatch
        with:
          repo: ${{ github.repository }}
          pr: ${{ steps.merge.outputs.pr }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # For repositories where the PR author cannot submit an approving review,
  # require an explicit human command bound to the final head SHA. Ambiguous
  # +1 comments and reactions no longer authorize a merge.
  authorize_merge_command:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/merge ')
      && !endsWith(github.event.comment.body, '<!-- pr-agent-generated -->')
      && !endsWith(github.event.comment.body, 'Generated by [Claude Code](https://claude.ai/code)_')
      && (github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.command.outputs.authorized }}
      approved_head: ${{ steps.command.outputs.approved_head }}
    steps:
      - name: Parse human merge authorization
        id: command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          if [[ " $HUMAN_MERGE_ACTORS " != *" $COMMENT_AUTHOR "* ]]; then
            echo "Merge command from ${COMMENT_AUTHOR} is not authorized."
            exit 0
          fi
          if [[ ! "$COMMENT_BODY" =~ ^/merge[[:space:]]+([0-9a-fA-F]{7,40})[[:space:]]*$ ]]; then
            echo "Merge command must be exactly: /merge <7-40 character head SHA>"
            exit 0
          fi
          approved_head=$(tr '[:upper:]' '[:lower:]' <<< "${BASH_REMATCH[1]}")
          live_head=$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid \
            --jq 'select(.state == "OPEN") | .headRefOid')
          if [[ -z "$live_head" || "$live_head" != "$approved_head"* ]]; then
            echo "Merge command for ${approved_head} does not match the open PR head ${live_head:-none}."
            exit 0
          fi
          echo "approved_head=${live_head}" >> "$GITHUB_OUTPUT"
          echo "authorized=true" >> "$GITHUB_OUTPUT"

  merge-on-command:
    needs: authorize_merge_command
    if: needs.authorize_merge_command.outputs.authorized == 'true'
    concurrency:
      group: pr-agent-merge-command-${{ github.event.issue.number }}-${{ github.event.comment.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check live merge readiness
        id: ready
        uses: ./.github/actions/pr-merge-ready
        with:
          repo: ${{ github.repository }}
          pr: ${{ github.event.issue.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          approved-head: ${{ needs.authorize_merge_command.outputs.approved_head }}
          authorized-at: ${{ github.event.comment.updated_at }}
          merge-comment-id: ${{ github.event.comment.id }}

      - name: Squash-merge authorized head
        id: merge
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.ready.outputs.head-sha }}
          TITLE: ${{ steps.ready.outputs.title }}
        run: |
          if ! merge_output=$(gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --subject "${TITLE} (#${PR})" 2>&1); then
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            if [[ "$state" == "MERGED" ]]; then
              echo "PR #${PR} was merged by another valid authorization."
              exit 0
            fi
            echo "$merge_output"
            exit 1
          fi
          echo "Merged PR #${PR} at authorized head ${HEAD_SHA}."
          {
            echo "merged=true"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"

      # Merges made with GITHUB_TOKEN start no push workflows on main,
      # so start the post-merge suite explicitly.
      - name: Start post-merge workflows on main
        if: steps.merge.outputs.merged == 'true'
        uses: ./.github/actions/post-merge-dispatch
        with:
          repo: ${{ github.repository }}
          pr: ${{ steps.merge.outputs.pr }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # If a human authorized the current head while Tests was still running,
  # retry once that exact head's Tests workflow succeeds. Authorization is
  # recovered from a head-bound approval or exact /merge command; no
  # auto-merge request remains armed between events.
  merge-after-tests:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: pr-agent-merge-tests-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Recover head-bound human authorization
        id: authorization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
          TESTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "authorized=false" >> "$GITHUB_OUTPUT"
          pr=$(jq -r '.[0].number // empty' <<< "$PRS")
          if [[ -z "$pr" ]]; then
            echo "Tests run has no associated PR."
            exit 0
          fi

          live_head=$(gh pr view "$pr" --repo "$REPO" --json state,headRefOid \
            --jq 'select(.state == "OPEN") | .headRefOid')
          if [[ -z "$live_head" || "$live_head" != "$TESTED_HEAD" ]]; then
            echo "PR #${pr} is closed or advanced beyond tested head ${TESTED_HEAD}."
            exit 0
          fi

          authorized_at=""
          approval_id=""
          merge_comment_id=""
          reviews=$(gh api "repos/${REPO}/pulls/${pr}/reviews" --paginate --slurp | jq 'add // []')
          for actor in $HUMAN_MERGE_ACTORS; do
            latest_review=$(jq -r --arg actor "$actor" --arg head "$TESTED_HEAD" '
              [ .[] | select(
                  .user.login == $actor
                  and .commit_id == $head
                  and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                ) ]
              | sort_by(.submitted_at)
              | last
              | [(.state // ""), (.submitted_at // ""), (.id // "")]
              | @tsv' <<< "$reviews")
            IFS=$'\t' read -r latest_state latest_submitted_at latest_review_id <<< "$latest_review"
            if [[ "$latest_state" == "APPROVED" \
              && "$latest_submitted_at" > "$authorized_at" ]]; then
              authorized_at="$latest_submitted_at"
              approval_id="$latest_review_id"
              merge_comment_id=""
            fi
          done

          comments=$(gh api "repos/${REPO}/issues/${pr}/comments" --paginate --slurp | jq 'add // []')
          while IFS= read -r encoded; do
            comment=$(base64 --decode <<< "$encoded")
            author=$(jq -r '.user.login' <<< "$comment")
            association=$(jq -r '.author_association' <<< "$comment")
            body=$(jq -r '.body' <<< "$comment")
            if [[ " $HUMAN_MERGE_ACTORS " != *" $author "* ]]; then
              continue
            fi
            if [[ "$association" != "OWNER" && "$association" != "COLLABORATOR" ]]; then
              continue
            fi
            if [[ "$body" =~ ^/merge[[:space:]]+([0-9a-fA-F]{7,40})[[:space:]]*$ ]]; then
              approved_head=$(tr '[:upper:]' '[:lower:]' <<< "${BASH_REMATCH[1]}")
              if [[ "$TESTED_HEAD" == "$approved_head"* ]]; then
                updated_at=$(jq -r '.updated_at' <<< "$comment")
                if [[ "$updated_at" > "$authorized_at" ]]; then
                  authorized_at="$updated_at"
                  approval_id=""
                  merge_comment_id=$(jq -r '.id' <<< "$comment")
                fi
              fi
            fi
          done < <(jq -r '.[] | @base64' <<< "$comments")

          if [[ -z "$authorized_at" ]]; then
            echo "No human authorization is bound to PR #${pr} head ${TESTED_HEAD}."
            exit 0
          fi
          {
            echo "authorized=true"
            echo "authorized_at=${authorized_at}"
            echo "approval_id=${approval_id}"
            echo "merge_comment_id=${merge_comment_id}"
            echo "pr=${pr}"
            echo "head=${TESTED_HEAD}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.authorization.outputs.authorized == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check live merge readiness
        id: ready
        if: steps.authorization.outputs.authorized == 'true'
        uses: ./.github/actions/pr-merge-ready
        with:
          repo: ${{ github.repository }}
          pr: ${{ steps.authorization.outputs.pr }}
          token: ${{ secrets.GITHUB_TOKEN }}
          approved-head: ${{ steps.authorization.outputs.head }}
          authorized-at: ${{ steps.authorization.outputs.authorized_at }}
          approval-id: ${{ steps.authorization.outputs.approval_id }}
          merge-comment-id: ${{ steps.authorization.outputs.merge_comment_id }}

      - name: Squash-merge authorized tested head
        id: merge
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.authorization.outputs.pr }}
          HEAD_SHA: ${{ steps.ready.outputs.head-sha }}
          TITLE: ${{ steps.ready.outputs.title }}
        run: |
          if ! merge_output=$(gh pr merge "$PR" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --subject "${TITLE} (#${PR})" 2>&1); then
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
            if [[ "$state" == "MERGED" ]]; then
              echo "PR #${PR} was merged by another valid authorization."
              exit 0
            fi
            echo "$merge_output"
            exit 1
          fi
          echo "Merged PR #${PR} after Tests succeeded at authorized head ${HEAD_SHA}."
          {
            echo "merged=true"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"

      # Merges made with GITHUB_TOKEN start no push workflows on main,
      # so start the post-merge suite explicitly.
      - name: Start post-merge workflows on main
        if: steps.merge.outputs.merged == 'true'
        uses: ./.github/actions/post-merge-dispatch
        with:
          repo: ${{ github.repository }}
          pr: ${{ steps.merge.outputs.pr }}
          token: ${{ secrets.GITHUB_TOKEN }}
