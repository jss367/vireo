name: Main health

# Routes a red "Full tests" run on main to someone who will fix it.
#
# PRs run only the tests their diff can affect, so the post-merge full suite
# (test-main.yml) is where cross-cutting and platform-specific breakage shows
# up first. Nothing used to react to it: the PR agent's fix-ci only handles
# failures on PRs. This workflow keeps one open issue labelled ``main-red``
# while main is failing (each newer failing run comments on it) and closes it
# on the next green run.
#
# It also asks the PR agent routine for a fix PR (``Task: fix-main``,
# labelled ``fix-main``) once per incident: a failing run fires unless the
# issue already records an accepted request, so a first dispatch that was
# gated off or rejected is retried on the next red run, and nothing else is.
# Closing the issue while main is still red makes the next red run open a
# fresh incident and ask again.
#
# The dispatch is gated on the ``MAIN_HEALTH_ENABLE_FIX_MAIN`` repository
# variable because the routine prompt at claude.ai/code/routines is pasted in
# by hand: until it knows ``fix-main``, a fire would be accepted and do
# nothing. Flip the variable once ``docs/pr-agent-routine-prompt.md`` has been
# pasted into the routine.

on:
  workflow_run:
    workflows: ["Full tests"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

# Serialized and never cancelled: each completed run must update the issue in
# the order the runs finished.
concurrency:
  group: main-health
  cancel-in-progress: false

env:
  RED_LABEL: main-red
  FIX_LABEL: fix-main
  REQUESTED_MARKER: "<!-- main-health-fix-requested -->"

jobs:
  report:
    if: >-
      github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.event != 'pull_request'
      && (github.event.workflow_run.conclusion == 'failure'
          || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open, update, or close the main-red issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_ID: ${{ github.event.workflow.id }}
        run: |
          set -euo pipefail
          echo "fire=false" >> "$GITHUB_OUTPUT"

          # A rerun of an older run, or a completion event delivered out of
          # order, must not overwrite the tracking issue with a stale result:
          # rerunning an old failure after a newer green would reopen the
          # incident, and a stale success arriving after a newer failure would
          # close it. Skip when this run is not the newest run for main by
          # createdAt (immutable to reruns — a rerun keeps the original run's
          # id and creation time), so a rerun of an old run cannot masquerade
          # as the latest completed run; that newest run's own workflow_run
          # event drives the issue state.
          # Only conclusive runs count: GitHub cancels a pending run when a
          # newer one queues behind the active run, and that cancelled run's
          # later createdAt must not make the active run's real result look
          # superseded. The filter runs client-side, so the limit is generous
          # enough that cancelled runs can't crowd the conclusive ones out.
          latest_id=$(gh run list --repo "$REPO" --workflow "$WORKFLOW_ID" \
            --branch main --status completed --limit 100 \
            --json databaseId,createdAt,conclusion \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")]
                  | sort_by(.createdAt) | reverse | .[0].databaseId // empty')
          if [[ -n "$latest_id" && "$latest_id" != "$RUN_ID" ]]; then
            echo "Run $RUN_ID is superseded by run $latest_id; skipping."
            exit 0
          fi

          # GitHub keeps the same databaseId across reruns; only run_attempt
          # (and potentially the conclusion) changes. If this event describes
          # an earlier attempt of the same run — the original failure queued
          # behind a rerun that succeeded, or a rerun's failure delivered
          # before an even later rerun's success — skip it: the newest
          # attempt's own workflow_run event drives the issue state, and
          # runs are serialized so the newest attempt will (or already did)
          # reach this workflow.
          current=$(gh run view "$RUN_ID" --repo "$REPO" \
            --json attempt,conclusion --jq '"\(.attempt) \(.conclusion)"')
          current_attempt=${current%% *}
          current_conclusion=${current##* }
          if [[ "$current_attempt" != "$RUN_ATTEMPT" \
              || "$current_conclusion" != "$CONCLUSION" ]]; then
            echo "Run $RUN_ID attempt $RUN_ATTEMPT ($CONCLUSION) is superseded by attempt $current_attempt ($current_conclusion); skipping."
            exit 0
          fi

          gh label create "$RED_LABEL" --repo "$REPO" --color B60205 \
            --description "Full tests failing on main" 2>/dev/null || true
          gh label create "$FIX_LABEL" --repo "$REPO" --color 0E8A16 \
            --description "Fixes a red Full tests run on main" 2>/dev/null || true

          issue=$(gh issue list --repo "$REPO" --label "$RED_LABEL" --state open \
            --json number --jq '.[0].number // empty')

          if [[ "$CONCLUSION" == "success" ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$REPO" \
                --comment "Full tests passed on main at ${HEAD_SHA:0:10} (${RUN_URL})."
            fi
            exit 0
          fi

          failed_jobs=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name')
          failed_tests=$( (gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null || true) \
            | grep -oE 'FAILED [^ ]+::[^ ]+' | sed 's/^FAILED //' | sort -u | head -n 40 \
            | sed 's/^/- `/; s/$/`/' || true)
          body=$(mktemp)
          {
            echo "Full tests failed on main at ${HEAD_SHA:0:10}: ${RUN_URL}"
            echo
            echo "Failed jobs:"
            echo "${failed_jobs:-- (none reported)}"
            echo
            echo "Failed tests (first 40):"
            echo "${failed_tests:-- (none parsed from the log; see the run)}"
          } > "$body"

          if [[ -z "$issue" ]]; then
            url=$(gh issue create --repo "$REPO" --label "$RED_LABEL" \
              --title "Full tests failing on main" --body-file "$body")
            issue=${url##*/}
          else
            gh issue comment "$issue" --repo "$REPO" --body-file "$body"
          fi
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

          # One accepted fix request per incident. The record comment below is
          # written only after the routine accepts the fire, so an incident
          # whose first dispatch was gated off or rejected asks again on its
          # next red run. Runs are serialized, so the comment is always visible
          # to the next one. Only this workflow's own comments count: anyone
          # can comment on a public issue.
          requested=$(gh api "repos/$REPO/issues/$issue/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$REQUESTED_MARKER\")))] | length" \
            | awk '{s += $1} END {print s + 0}')
          if (( requested == 0 )); then
            echo "fire=true" >> "$GITHUB_OUTPUT"
          else
            echo "A fix was already requested for #${issue}; close the issue to start a new incident."
          fi

      - name: Note that fix-main dispatch is gated
        if: steps.issue.outputs.fire == 'true' && vars.MAIN_HEALTH_ENABLE_FIX_MAIN != 'true'
        run: |
          echo "The repository variable MAIN_HEALTH_ENABLE_FIX_MAIN is not 'true'; the fix-main routine dispatch is gated."
          echo "The routine prompt at claude.ai/code/routines is edited by hand and is not synced from the repo; until it knows the fix-main task, a fire would be accepted and do nothing."
          echo "Set MAIN_HEALTH_ENABLE_FIX_MAIN=true once docs/pr-agent-routine-prompt.md has been pasted into the routine."

      - uses: actions/checkout@v5
        if: steps.issue.outputs.fire == 'true' && vars.MAIN_HEALTH_ENABLE_FIX_MAIN == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Ask the PR agent for a fix
        id: fire
        if: steps.issue.outputs.fire == 'true' && vars.MAIN_HEALTH_ENABLE_FIX_MAIN == 'true'
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          payload: |
            Task: fix-main
            Issue: ${{ steps.issue.outputs.issue }}
            Workflow run: ${{ github.event.workflow_run.id }}
            Head SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Record the fix request on the issue
        if: steps.fire.outputs.fired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.issue }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Asked the PR agent for a fix PR (label \`fix-main\`). To try again later, close this issue; the next red run opens a new one. ${REQUESTED_MARKER}"
