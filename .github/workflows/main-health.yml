name: Main health

# Routes a red "Full tests" run on main to someone who will fix it.
#
# PRs run only the tests their diff can affect, so the post-merge full suite
# (test-main.yml) is where cross-cutting and platform-specific breakage shows
# up first. Nothing used to react to it: the PR agent's fix-ci only handles
# failures on PRs. This workflow keeps one open issue labelled ``main-red``
# while main is failing (a new failing run comments on it), closes it on the
# next green run, and — when the ``MAIN_HEALTH_ENABLE_FIX_MAIN`` repository
# variable is ``true`` — asks the PR agent routine for a fix PR (``Task:
# fix-main``). The routine labels that PR ``fix-main``; while one is open,
# after three attempts on the same issue, or while an earlier attempt is
# still in flight (marker posted but no matching PR yet), later failures
# only update the issue so a stuck fix can't loop.
#
# The routine dispatch is gated on ``MAIN_HEALTH_ENABLE_FIX_MAIN`` because
# the stored routine prompt at claude.ai/code/routines is pasted in by
# hand: an unrecognised ``fix-main`` task returns 2xx from the routine
# provider (burning one of the three attempts) but never opens a PR.
# The maintainer flips the variable once ``docs/pr-agent-routine-prompt.md``
# has been pasted into the routine.
#
# The in-flight (``pending``) guard expires after a couple of hours: an
# accepted routine session may still terminate without a PR — step 8 of
# the ``fix-main`` task comments on the issue and opens no PR when it
# cannot fix the failure, and a crash after acceptance has the same
# result. Without expiry, a stale marker would keep every subsequent
# failing run stuck at the pending check and prevent the advertised
# second and third attempts. Total ``attempts`` is not expired, so the
# hard MAX_FIX_ATTEMPTS cap survives.

on:
  workflow_run:
    workflows: ["Full tests"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

# Serialized and never cancelled: each completed run must update the issue in
# the order the runs finished.
concurrency:
  group: main-health
  cancel-in-progress: false

env:
  RED_LABEL: main-red
  FIX_LABEL: fix-main
  MAX_FIX_ATTEMPTS: "3"
  FIRED_MARKER: "<!-- main-health-fired -->"

jobs:
  report:
    if: >-
      github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.event != 'pull_request'
      && (github.event.workflow_run.conclusion == 'failure'
          || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open, update, or close the main-red issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_ID: ${{ github.event.workflow.id }}
        run: |
          set -euo pipefail
          echo "fire=false" >> "$GITHUB_OUTPUT"

          # A rerun of an older run, or a completion event delivered out of
          # order, must not overwrite the tracking issue with a stale result:
          # rerunning an old failure after a newer green would reopen the
          # incident, and a stale success arriving after a newer failure would
          # close it. Skip when this run is not the newest run for main by
          # createdAt (immutable to reruns — a rerun keeps the original run's
          # id and creation time), so a rerun of an old run cannot masquerade
          # as the latest completed run; that newest run's own workflow_run
          # event drives the issue state.
          latest_id=$(gh run list --repo "$REPO" --workflow "$WORKFLOW_ID" \
            --branch main --status completed --limit 20 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // empty')
          if [[ -n "$latest_id" && "$latest_id" != "$RUN_ID" ]]; then
            echo "Run $RUN_ID is superseded by run $latest_id; skipping."
            exit 0
          fi

          gh label create "$RED_LABEL" --repo "$REPO" --color B60205 \
            --description "Full tests failing on main" 2>/dev/null || true
          gh label create "$FIX_LABEL" --repo "$REPO" --color 0E8A16 \
            --description "Fixes a red Full tests run on main" 2>/dev/null || true

          issue=$(gh issue list --repo "$REPO" --label "$RED_LABEL" --state open \
            --json number --jq '.[0].number // empty')

          if [[ "$CONCLUSION" == "success" ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$REPO" \
                --comment "Full tests passed on main at ${HEAD_SHA:0:10} (${RUN_URL})."
            fi
            exit 0
          fi

          failed_jobs=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name')
          failed_tests=$( (gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null || true) \
            | grep -oE 'FAILED [^ ]+::[^ ]+' | sed 's/^FAILED //' | sort -u | head -n 40 \
            | sed 's/^/- `/; s/$/`/' || true)
          body=$(mktemp)
          {
            echo "Full tests failed on main at ${HEAD_SHA:0:10}: ${RUN_URL}"
            echo
            echo "Failed jobs:"
            echo "${failed_jobs:-- (none reported)}"
            echo
            echo "Failed tests (first 40):"
            echo "${failed_tests:-- (none parsed from the log; see the run)}"
          } > "$body"

          if [[ -z "$issue" ]]; then
            url=$(gh issue create --repo "$REPO" --label "$RED_LABEL" \
              --title "Full tests failing on main" --body-file "$body")
            issue=${url##*/}
          else
            gh issue comment "$issue" --repo "$REPO" --body-file "$body"
          fi
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

          # Scope the guard to this incident: an unrelated fix-main PR left
          # open after its own incident closed would otherwise permanently
          # block firing for a later, unrelated failure. The routine writes
          # ``Refs #$ISSUE`` into every fix-main PR body, so a body match
          # identifies a PR that belongs to this incident.
          open_fixes=$(gh pr list --repo "$REPO" --label "$FIX_LABEL" --state open \
            --json body \
            --jq "[.[] | select((.body // \"\") | contains(\"Refs #$issue\"))] | length")
          # Only count marker comments authored by this workflow's bot
          # identity. Otherwise, since this is a public repo, any commenter
          # could post $FIRED_MARKER three times to force ``attempts`` past
          # MAX_FIX_ATTEMPTS and permanently block automated repair.
          attempts=$(gh api "repos/$REPO/issues/$issue/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$FIRED_MARKER\")))] | length" \
            | awk '{s += $1} END {print s + 0}')
          # A prior attempt whose fix-main PR has not yet been opened is
          # still in flight in the routine. Skip until that attempt either
          # produces a PR or the reservation is released, so a second
          # concurrent red run cannot fire a duplicate routine session for
          # the same incident. The reserve-before-fire step below posts the
          # marker atomically before the routine POST, so recent_attempts
          # includes any reservation held by an earlier serialized run.
          #
          # ``recent_attempts`` filters to markers posted within the last
          # $RESERVATION_TTL_SECS seconds. The routine can accept the POST
          # (fired=true, marker kept) and still terminate without a PR:
          # step 8 of the fix-main task explicitly comments on the issue
          # and opens no PR when it cannot fix the failure, and a crash
          # after acceptance has the same result. A stale marker would
          # then keep ``pending > 0`` forever and block the advertised
          # second and third attempts. Expiring the reservation gate
          # after the TTL releases those hung reservations without giving
          # up the concurrency guard for genuinely in-flight sessions
          # (the routine's own diagnose-and-publish takes minutes, not
          # hours). Stale reservations still count in ``attempts`` above
          # so they still charge against MAX_FIX_ATTEMPTS.
          #
          # ``fix_prs`` is scoped to the same TTL window so ``pending``
          # compares like with like: an old fix-main PR whose reservation
          # has already expired would otherwise mask a fresh reservation
          # whose routine has not yet published its PR (``recent_attempts
          # = 1`` for the new marker, ``fix_prs = 1`` for the stale PR,
          # ``pending = 0``), letting a second concurrent red run fire a
          # duplicate session. ``open_fixes`` above stays untimed because
          # an open PR blocks firing regardless of when it was created.
          RESERVATION_TTL_SECS=7200
          now_epoch=$(date -u +%s)
          recent_attempts=$(gh api "repos/$REPO/issues/$issue/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$FIRED_MARKER\"))) | .created_at]" \
            | jq -s --argjson now "$now_epoch" --argjson ttl "$RESERVATION_TTL_SECS" \
              '[.[][] | select(($now - (. | fromdate)) < $ttl)] | length')
          fix_prs=$(gh pr list --repo "$REPO" --label "$FIX_LABEL" --state all \
            --json body,createdAt \
            --jq "[.[] | select((.body // \"\") | contains(\"Refs #$issue\")) | .createdAt]" \
            | jq -s --argjson now "$now_epoch" --argjson ttl "$RESERVATION_TTL_SECS" \
              '[.[][] | select(($now - (. | fromdate)) < $ttl)] | length')
          pending=$(( recent_attempts - fix_prs ))
          if (( pending < 0 )); then pending=0; fi
          if (( pending > 0 )); then
            echo "A fix-main routine for #${issue} is already in flight (attempts=${attempts}, recent PRs=${fix_prs}); not asking for another."
          elif [[ "$open_fixes" != "0" ]]; then
            echo "A fix-main PR for #${issue} is already open; not asking for another."
          elif (( attempts >= MAX_FIX_ATTEMPTS )); then
            echo "Already asked for ${attempts} fixes on #${issue}; leaving it to a human."
          else
            echo "attempt=$((attempts + 1))" >> "$GITHUB_OUTPUT"
            echo "fire=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Note that fix-main dispatch is gated
        if: steps.issue.outputs.fire == 'true' && vars.MAIN_HEALTH_ENABLE_FIX_MAIN != 'true'
        run: |
          echo "The repository variable MAIN_HEALTH_ENABLE_FIX_MAIN is not 'true'; the fix-main routine dispatch is gated."
          echo "The routine prompt at claude.ai/code/routines is edited by hand and is not synced from the repo. A fix-main POST that returns 2xx while the stored prompt does not yet recognise the task would still burn one of the ${MAX_FIX_ATTEMPTS} attempts without producing a PR, and the workflow cannot verify the stored prompt from here."
          echo "Set MAIN_HEALTH_ENABLE_FIX_MAIN=true once docs/pr-agent-routine-prompt.md has been pasted into the routine."

      - uses: actions/checkout@v5
        if: steps.issue.outputs.fire == 'true' && vars.MAIN_HEALTH_ENABLE_FIX_MAIN == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reserve the fix attempt
        id: reserve
        if: steps.issue.outputs.fire == 'true' && vars.MAIN_HEALTH_ENABLE_FIX_MAIN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.issue }}
          ATTEMPT: ${{ steps.issue.outputs.attempt }}
        run: |
          set -euo pipefail
          # Reserve BEFORE the fire so the FIRED_MARKER is already visible to
          # any concurrently queued run before the routine POST is sent. With
          # the ``main-health`` concurrency group serialising runs and the
          # pre-check's ``pending > 0`` gate above, this posts an atomic
          # reservation the next queued run must observe. The release step
          # below deletes the reservation if the routine rejects the POST.
          comment_id=$(gh api "repos/$REPO/issues/$ISSUE/comments" \
            --method POST \
            --field "body=Asked the PR agent for a fix PR (attempt ${ATTEMPT} of ${MAX_FIX_ATTEMPTS}). ${FIRED_MARKER}" \
            --jq '.id')
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"

      - name: Ask the PR agent for a fix
        id: fire
        if: steps.issue.outputs.fire == 'true' && vars.MAIN_HEALTH_ENABLE_FIX_MAIN == 'true'
        uses: ./.github/actions/fire-routine
        with:
          url: ${{ secrets.CLAUDE_ROUTINE_URL }}
          token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          allow-missing: "true"
          payload: |
            Task: fix-main
            Issue: ${{ steps.issue.outputs.issue }}
            Workflow run: ${{ github.event.workflow_run.id }}
            Head SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Release the reservation if the routine rejected the request
        if: always() && steps.reserve.outputs.comment_id != '' && steps.fire.outputs.fired != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ steps.reserve.outputs.comment_id }}
        run: |
          # An accepted POST records the reservation as this attempt. When the
          # routine provider rejects the POST (or the credentials are missing),
          # delete the reservation so the next run can retry without burning an
          # attempt for a routine session that never began.
          gh api --method DELETE "repos/$REPO/issues/comments/$COMMENT_ID"
