name: Encounter Evaluation Tool

on:
  pull_request:
    paths:
      - 'tools/encounter-evaluation/**'
      - 'vireo/encounters.py'
      - 'vireo/pipeline.py'
      - 'vireo/weak_detections.py'
      - 'vireo/db.py'
      - 'vireo/config.py'
      - 'vireo/species_identity.py'
      - 'vireo/taxonomy.py'
      - 'vireo/keyword_normalization.py'
      - 'scripts/build_sidecar.py'
      - 'pyproject.toml'
      - '.github/workflows/encounter-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install the evaluation tool and packaging test dependencies
        # The application wheel isolation test builds with --no-isolation.
        run: pip install -e 'tools/encounter-evaluation[test]' 'setuptools-rust>=1.12'
      - name: Check tool code
        run: ruff check tools/encounter-evaluation
      - name: Test evaluation and packaging isolation
        run: python -m pytest -c tools/encounter-evaluation/pyproject.toml tools/encounter-evaluation/tests -q
