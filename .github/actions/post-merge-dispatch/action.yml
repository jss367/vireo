name: Start post-merge workflows on main
description: >-
  Dispatch the push-triggered main workflows and close the PR's linked
  issues after a merge made with GITHUB_TOKEN. GitHub neither starts
  workflows for pushes made with that token nor acts on the PR's closing
  keywords, so without this a bot merge never runs the full suite and
  leaves every "Closes #N" issue open.

inputs:
  repo:
    description: Repository in owner/name form.
    required: true
  pr:
    description: The PR that was just merged.
    required: true
  token:
    description: Token with actions:write, issues:write and pull-requests:read.
    required: true

runs:
  using: composite
  steps:
    - name: Dispatch main workflows
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr }}
      run: |
        set -euo pipefail
        # test-main.yml ("Full tests") runs the three-OS suite, enforces the
        # coverage gate, publishes the test-impact map, and feeds
        # main-health.yml. workflow_dispatch is exempt from the GITHUB_TOKEN
        # rule, and its concurrency group collapses back-to-back merges.
        gh workflow run test-main.yml --repo "$REPO" --ref main
        echo "Dispatched Full tests on main after merging #${PR}."
        # deploy-website.yml deploys on pushes that touch website/**. The
        # list-pull-request-files REST endpoint caps at 3,000 files even
        # with --paginate, so a mega-PR could hide a website/ change past
        # that boundary. Read the squash-merge commit from git instead,
        # which has no such cap; the workflow's checkout is shallow, so
        # deepen it to make the merge commit and its parent available
        # (GitHub's uploadpack.allowReachableSHA1InWant is on by default).
        # --no-renames expands a rename to delete+add so a file renamed
        # OUT of website/ still surfaces its old path.
        merge_sha=$(gh api "repos/$REPO/pulls/$PR" --jq '.merge_commit_sha')
        if [[ -z "$merge_sha" || "$merge_sha" == "null" ]]; then
          echo "PR #${PR} has no merge_commit_sha; skipping the website-deploy check."
          exit 0
        fi
        if ! git cat-file -e "${merge_sha}^{commit}" 2>/dev/null; then
          git fetch --depth=2 origin "$merge_sha"
        fi
        files=$(git show --no-renames --name-only --format='' "$merge_sha")
        if grep -q '^website/' <<< "$files"; then
          gh workflow run deploy-website.yml --repo "$REPO" --ref main
          echo "Dispatched the website deploy: #${PR} changed website/."
        fi

    # Runs after the dispatch step so a failure here can never keep the
    # full suite from starting on main.
    - name: Close linked issues
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr }}
      run: |
        set -euo pipefail
        # closingIssuesReferences is GitHub's own parse of the PR's closing
        # keywords ("Closes #N", "Fixes #N", ...) plus issues linked in the
        # sidebar, so this closes exactly what a human merge would have.
        # GITHUB_TOKEN can only write this repository, so issues linked in
        # other repositories are left alone.
        issues=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
          --jq '.closingIssuesReferences[]
                | select((.repository.owner.login + "/" + .repository.name) == $ENV.REPO)
                | .number')
        if [[ -z "$issues" ]]; then
          echo "PR #${PR} links no issues to close."
          exit 0
        fi
        failed=0
        for issue in $issues; do
          state=$(gh issue view "$issue" --repo "$REPO" --json state --jq .state) || state=""
          if [[ "$state" == "CLOSED" ]]; then
            echo "Issue #${issue} is already closed."
            continue
          fi
          if gh issue close "$issue" --repo "$REPO" --reason completed \
            --comment "Closed by #${PR}, which was merged to main."; then
            echo "Closed issue #${issue}, linked from #${PR}."
          else
            echo "::warning::Could not close issue #${issue}, linked from #${PR}."
            failed=1
          fi
        done
        exit "$failed"
