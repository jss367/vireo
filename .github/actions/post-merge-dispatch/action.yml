name: Start post-merge workflows on main
description: >-
  Dispatch the push-triggered main workflows after a merge made with
  GITHUB_TOKEN. GitHub does not start workflows for pushes made with that
  token, so without this a bot merge never runs the full suite.

inputs:
  repo:
    description: Repository in owner/name form.
    required: true
  pr:
    description: The PR that was just merged.
    required: true
  token:
    description: Token with actions:write and pull-requests:read.
    required: true

runs:
  using: composite
  steps:
    - name: Dispatch main workflows
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr }}
      run: |
        set -euo pipefail
        # test-main.yml ("Full tests") runs the three-OS suite, enforces the
        # coverage gate, publishes the test-impact map, and feeds
        # main-health.yml. workflow_dispatch is exempt from the GITHUB_TOKEN
        # rule, and its concurrency group collapses back-to-back merges.
        gh workflow run test-main.yml --repo "$REPO" --ref main
        echo "Dispatched Full tests on main after merging #${PR}."
        # deploy-website.yml deploys on pushes that touch website/**. The
        # list-pull-request-files REST endpoint caps at 3,000 files even
        # with --paginate, so a mega-PR could hide a website/ change past
        # that boundary. Read the squash-merge commit from git instead,
        # which has no such cap; the workflow's checkout is shallow, so
        # deepen it to make the merge commit and its parent available
        # (GitHub's uploadpack.allowReachableSHA1InWant is on by default).
        # --no-renames expands a rename to delete+add so a file renamed
        # OUT of website/ still surfaces its old path.
        merge_sha=$(gh api "repos/$REPO/pulls/$PR" --jq '.merge_commit_sha')
        if [[ -z "$merge_sha" || "$merge_sha" == "null" ]]; then
          echo "PR #${PR} has no merge_commit_sha; skipping the website-deploy check."
          exit 0
        fi
        if ! git cat-file -e "${merge_sha}^{commit}" 2>/dev/null; then
          git fetch --depth=2 origin "$merge_sha"
        fi
        files=$(git show --no-renames --name-only --format='' "$merge_sha")
        if grep -q '^website/' <<< "$files"; then
          gh workflow run deploy-website.yml --repo "$REPO" --ref main
          echo "Dispatched the website deploy: #${PR} changed website/."
        fi
