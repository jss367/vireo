<section id="reviewQueue" class="review-queue" aria-label="Resumable photo inspection">
  <label><input type="checkbox" id="rqEnabled"> Inspect photos side by side</label>
  <p id="rqStorageStatus">Position, subject choices and inspection notes resume in this browser, within this workspace and filter scope. Flags stay in the catalog.</p>
  <div id="rqContent" hidden>
    <p id="rqProgress" aria-live="polite"></p>
    <div class="rq-toolbar">
      <button type="button" id="rqPrevious">Previous photo</button>
      <button type="button" id="rqNext">Next photo</button>
      <button type="button" id="rqInspected">Mark inspected</button>
      <label><input type="checkbox" id="rqUnresolved">Needs follow-up</label>
      <label><input type="checkbox" id="rqUnresolvedOnly">Only follow-up</label>
      <button type="button" id="rqRefresh">Refresh catalog decisions</button>
    </div>
    <h2 id="rqFilename"></h2>
    <p id="rqFlag" aria-live="polite"></p>
    <p id="rqPendingFlag" aria-live="polite"></p>
    <div class="rq-toolbar">
      <button type="button" data-rq-flag="flagged">Keep photo</button>
      <button type="button" data-rq-flag="rejected">Reject photo</button>
      <button type="button" data-rq-flag="none">Clear photo flag</button>
      <button type="button" id="rqDiscardPendingFlag" hidden>Discard unsaved review choice</button>
      <a id="rqPredictionLink" href="#grid">Review species predictions below</a>
    </div>
    <div class="rq-toolbar">
      <label>Subject <select id="rqSubject" aria-label="Subject for inspection"></select></label>
      <label>Crop pixels from <select id="rqSource"><option value="working">Working image</option><option value="auto">Best available source</option><option value="original">Original</option></select></label>
      <button type="button" id="rqManual" aria-pressed="false">Place center in full frame</button>
      <button type="button" id="rqResetCenter">Use subject center</button>
    </div>
    <p id="rqAnalysis"></p>
    <div class="rq-images">
      <figure><figcaption>Full frame · upright source before saved crop or rotation</figcaption>
        <div class="rq-full-wrap"><img id="rqFull" alt="Full frame for inspection"><span id="rqCenter" hidden aria-hidden="true"></span></div>
        <p id="rqFullStatus"></p>
      </figure>
      <figure><figcaption>Native focus crop · chosen subject or manual center</figcaption>
        <div class="rq-crop-wrap"><img id="rqCrop" alt="Native focus crop" hidden></div>
        <p id="rqCropStatus" aria-live="polite"></p>
      </figure>
    </div>
  </div>
</section>
