<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vireo-base.css">
<title>Vireo - Logs</title>
<style>
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 0;
  min-height: 0;
}
.log-toolbar {
  background: var(--bg-secondary);
  padding: 8px 20px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid var(--border-primary);
  flex-shrink: 0;
}
.log-toolbar select, .log-toolbar input {
  background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-secondary);
  border-radius: 4px; padding: 5px 10px; font-size: 12px; outline: none;
}
.log-toolbar input { flex: 1; max-width: 300px; }
.log-toolbar .log-search-control { flex: 1; max-width: 360px; }
.log-toolbar .log-search-control input { max-width: none; }
.log-toolbar input:focus, .log-toolbar select:focus { border-color: var(--accent); }
.log-toolbar button {
  background: var(--bg-tertiary); color: var(--text-secondary); border: none; border-radius: 4px;
  padding: 5px 12px; font-size: 12px; cursor: pointer;
}
.log-toolbar .search-option-btn {
  border: 1px solid var(--border-secondary);
  border-left: 0;
  border-radius: 0;
  padding: 0;
}
.log-toolbar .search-option-btn:last-child { border-radius: 0 4px 4px 0; }
.log-toolbar button:hover { background: var(--border-secondary); }
.log-toolbar label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.log-toolbar input[type=checkbox] { accent-color: var(--accent); }
.log-count { font-size: 12px; color: var(--text-faint); margin-left: auto; }

.log-container {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 8px 16px;
  font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: 12px;
  line-height: 1.6;
}
.log-line { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
.log-line .log-time { color: var(--text-faint); margin-right: 8px; }
.log-line .log-level { margin-right: 8px; font-weight: 600; min-width: 60px; display: inline-block; }
.log-line .log-logger { color: var(--text-faint); margin-right: 8px; }
.level-DEBUG .log-level { color: var(--text-ghost); }
.level-INFO .log-level { color: var(--text-secondary); }
.level-WARNING .log-level { color: var(--warning); }
.level-ERROR .log-level { color: var(--danger); }
.level-CRITICAL .log-level { color: var(--danger); font-weight: 900; }
.log-line.filtered { display: none; }
</style>
</head>
<body>

{% include '_navbar.html' %}

<div class="content">
  <div class="log-toolbar">
    <select id="levelFilter">
      <option value="DEBUG">DEBUG+</option>
      <option value="INFO" selected>INFO+</option>
      <option value="WARNING">WARNING+</option>
      <option value="ERROR">ERROR+</option>
    </select>
    <div class="search-control log-search-control">
      <input type="text" id="searchFilter" placeholder="Filter...">
      <button id="logSearchMatchCaseBtn" class="search-option-btn" type="button" aria-pressed="false" title="Match case">Aa</button>
      <button id="logSearchWholeWordBtn" class="search-option-btn" type="button" aria-pressed="false" title="Match whole word">ab</button>
    </div>
    <label><input type="checkbox" id="autoScroll" checked> Auto-scroll</label>
    <button id="logClearBtn" type="button">Clear</button>
    <span class="log-count" id="logCount">0 lines</span>
  </div>
  <div class="log-container" id="logContainer"></div>
</div>

<script type="module" src="/static/logs/boot.js"></script>
</body>
</html>
