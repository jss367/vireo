<section id="pendingArchives" class="pending-archives" hidden aria-label="Photos kept locally">
  <button id="pendingArchivesToggle" class="pending-archives-toggle" type="button" aria-expanded="false" aria-controls="pendingArchivesContent">
    <span class="pending-archives-chevron" aria-hidden="true">▸</span>
    <strong class="pending-archives-label">Photos kept locally in this workspace</strong>
    <span id="pendingArchivesSummary"></span>
    <span id="pendingArchivesToggleLabel" class="pending-archives-toggle-label">Show details</span>
  </button>
  <div id="pendingArchivesContent" hidden>
    <p class="pending-archive-safety">These local originals may be your only copies. Send them to the NAS to complete archiving.</p>
    <div id="pendingArchiveItems"></div>
    <p class="pending-archive-estimate">Sizes are catalog estimates for main photo files. Paired files, sidecars and unindexed files may use more space.</p>
  </div>
  <div id="pendingArchiveError" role="status"></div>
</section>
<style>
.pending-archives { margin: 8px 20px 0; padding: 6px 10px; border: 1px solid var(--border-primary); border-radius: 8px; flex-shrink: 0; font-size: 12px; }
.pending-archives[hidden] { display: none; }
.pending-archives[data-expanded="true"] { margin: 12px 0 20px; border-color: var(--warning, #d69e2e); }
.pending-archives[data-expanded="true"] .pending-archives-label { font-size: 14px; color: var(--text-primary); }
.pending-archives[data-expanded="true"] .pending-archive-meta { font-size: 13px; color: var(--text-primary); }
.pending-archives[data-expanded="true"] button { font-size: 12px; }
.pending-archives-toggle { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; width: 100%; padding: 2px 0; border: 0; background: none; color: var(--text-secondary); font: inherit; text-align: left; cursor: pointer; }
.pending-archives-toggle:hover .pending-archives-toggle-label { text-decoration: underline; }
.pending-archives-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.pending-archives-toggle-label { margin-left: auto; color: var(--accent); white-space: nowrap; }
.pending-archives-chevron { display: inline-block; }
.pending-archives-toggle[aria-expanded="true"] .pending-archives-chevron { transform: rotate(90deg); }
#pendingArchivesContent { max-height: 180px; overflow: auto; padding-top: 8px; }
#pendingArchivesContent[hidden] { display: none; }
.pending-archives[data-expanded="true"] #pendingArchivesContent { max-height: none; }
#pendingArchivesContent > * + * { margin-top: 8px; }
.pending-archives-label { color: var(--text-secondary); }
.pending-archive-safety, .pending-archive-estimate { flex-basis: 100%; margin: 0; line-height: 1.5; }
.pending-archive-safety { color: var(--text-primary); }
.pending-archive-estimate, .pending-archive-meta { color: var(--text-secondary); font-size: 11px; }
.pending-archive-meta { flex-basis: 100%; margin-top: 6px; }
#pendingArchiveItems { flex: 1; min-width: 0; }
.pending-archive-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
.pending-archive-row + .pending-archive-row { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-primary); }
.pending-archive-details { flex: 1; min-width: 140px; }
.pending-archive-details summary { cursor: pointer; color: var(--text-secondary); overflow-wrap: anywhere; }
.pending-archive-details summary:hover { color: var(--accent); }
.pending-archive-destination { margin-top: 6px; color: var(--text-muted); overflow-wrap: anywhere; }
.pending-archive-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.pending-archive-actions a { color: var(--accent); }
.pending-archive-actions .btn { padding: 4px 10px; font-size: 12px; }
.pending-archive-note { flex-basis: 100%; color: var(--text-secondary); overflow-wrap: anywhere; }
#pendingArchiveError { flex-basis: 100%; color: var(--danger); }
#pendingArchiveError:empty { display: none; }
</style>
<script defer src="/static/vireo-pending-archives.js"></script>
