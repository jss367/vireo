<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vireo-base.css">
<title>Vireo - Jobs</title>
<style>
.jobs-layout {
  display: flex; height: calc(100vh - 48px - 28px); overflow: hidden;
}
.jobs-list-pane {
  width: 320px; min-width: 240px; max-width: 400px;
  border-right: 1px solid var(--border-primary);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-secondary);
}
.jobs-list-header {
  padding: 12px 16px; font-size: 14px; font-weight: 600;
  border-bottom: 1px solid var(--border-primary);
  display: flex; align-items: center; gap: 8px;
  color: var(--text-primary);
}
.jobs-list-header .badge {
  font-size: 11px; background: var(--accent); color: var(--accent-text);
  padding: 2px 8px; border-radius: 10px; font-variant-numeric: tabular-nums;
}
.jobs-awake-note {
  padding: 8px 16px; font-size: 12px; line-height: 1.4;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-primary);
}
.jobs-awake-note summary { cursor: pointer; }
.jobs-awake-note p { margin: 4px 0 0; }
.move-cleanup { margin: 12px 0; padding: 12px; border: 1px solid var(--border-primary); border-radius: 6px; font-size: 13px; }
.move-cleanup p { margin: 0 0 10px; }
.move-cleanup ul { max-height: 220px; overflow: auto; padding-left: 22px; overflow-wrap: anywhere; }
.move-cleanup label { display: block; margin: 12px 0; }
.jobs-filter-bar {
  padding: 8px 16px; display: flex; gap: 8px;
  border-bottom: 1px solid var(--border-subtle);
}
.jobs-filter-bar select {
  font-size: 12px; padding: 4px 8px; border-radius: 4px;
  background: var(--bg-input); color: var(--text-primary);
  border: 1px solid var(--border-secondary);
}
.jobs-list-content {
  flex: 1; overflow-y: auto; padding: 0;
}
.jobs-list-divider {
  padding: 6px 16px; font-size: 11px; color: var(--text-ghost);
  text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  background: var(--bg-tertiary);
}
.jobs-list-divider.clickable {
  cursor: pointer; transition: background 0.1s; user-select: none;
}
.jobs-list-divider.clickable:hover { background: var(--bg-tertiary); }
.jobs-list-divider.clickable.selected {
  background: var(--bg-tertiary); border-left: 3px solid var(--accent); padding-left: 13px;
}
.job-list-item {
  padding: 10px 16px; cursor: pointer;
  border-bottom: 1px solid var(--border-subtle);
  transition: background 0.1s;
}
.job-list-item:hover { background: var(--bg-tertiary); }
.job-list-item.selected { background: var(--bg-tertiary); border-left: 3px solid var(--accent); padding-left: 13px; }
.job-list-item-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
}
.job-list-item-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.job-list-item-dot.running { background: var(--accent); animation: pulse-dot 1.5s ease-in-out infinite; }
.job-list-item-dot.pausing { background: var(--warning, #d99a24); animation: pulse-dot 1.5s ease-in-out infinite; }
.job-list-item-dot.paused { background: var(--warning, #d99a24); }
.job-list-item-dot.queued { background: var(--text-muted, #888); border: 1px solid var(--accent); }
.job-list-item-dot.completed { background: var(--success, #4caf50); }
.job-list-item-dot.failed { background: var(--danger); }
.job-list-item-dot.cancelled { background: var(--text-ghost); }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.job-list-item-type {
  font-size: 13px; font-weight: 600; color: var(--text-primary);
  text-transform: capitalize; flex: 1;
}
.job-list-item-time {
  font-size: 11px; color: var(--text-ghost); font-variant-numeric: tabular-nums;
}
.job-list-item-detail {
  font-size: 12px; color: var(--text-muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.job-list-item-progress {
  margin-top: 5px; height: 6px; background: var(--bg-tertiary); border-radius: 3px;
}
.job-list-item-progress-fill {
  height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s;
}
.jobs-detail-pane {
  flex: 1; overflow-y: auto; padding: 0;
  background: var(--bg-primary);
}
.jobs-detail-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text-ghost); font-size: 14px;
}
.job-detail-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border-primary);
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-secondary);
}
.job-detail-title {
  font-size: 16px; font-weight: 600; color: var(--text-primary);
  text-transform: capitalize; flex: 1;
}
.job-detail-status {
  font-size: 12px; padding: 3px 10px; border-radius: 4px; font-weight: 500;
}
.job-detail-status.running { background: var(--accent); color: var(--accent-text); }
.job-detail-status.pausing,
.job-detail-status.paused { background: color-mix(in srgb, var(--warning, #d99a24) 20%, transparent); color: var(--warning, #d99a24); }
.job-detail-status.queued { background: var(--bg-tertiary); color: var(--text-muted, #888); border: 1px solid var(--border-secondary); }
.job-detail-status.completed { background: color-mix(in srgb, var(--success, #4caf50) 20%, transparent); color: var(--success, #4caf50); }
.job-detail-status.failed { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
.job-detail-meta {
  font-size: 12px; color: var(--text-muted); display: flex; gap: 16px;
  flex-wrap: wrap; padding: 8px 24px; border-bottom: 1px solid var(--border-subtle);
}
.job-move-route {
  display: grid; grid-template-columns: max-content minmax(0, 1fr);
  gap: 6px 12px; padding: 12px 24px;
  border-bottom: 1px solid var(--border-subtle);
  background: color-mix(in srgb, var(--bg-secondary) 55%, transparent);
}
.job-move-route-label {
  color: var(--text-muted); font-size: 12px; font-weight: 600;
}
.job-move-route-path {
  color: var(--text-primary); font-size: 12px;
  font-family: var(--font-mono, monospace);
  overflow-wrap: anywhere;
}
.job-move-route-note {
  grid-column: 2; color: var(--text-muted); font-size: 11px;
}
.job-move-route-dates {
  grid-column: 2; margin: 0; padding: 0; list-style: none;
  color: var(--text-secondary, var(--text-muted)); font-size: 11px;
  font-family: var(--font-mono, monospace);
  display: flex; flex-direction: column; gap: 2px;
  overflow-wrap: anywhere;
}
.job-move-route-dates-more {
  color: var(--text-muted); font-family: var(--font-sans, inherit);
}
.job-pause-banner {
  font-size: 13px; padding: 8px 12px; margin: 8px 0;
  background: color-mix(in srgb, var(--warning, #d99a24) 12%, transparent);
  border-left: 3px solid var(--warning, #d99a24);
  color: var(--text-primary);
  border-radius: 3px;
}
.btn-cancel {
  font-size: 12px; padding: 4px 12px; border-radius: 4px; cursor: pointer;
  background: var(--danger); color: #fff; border: none;
}
.btn-cancel:hover { opacity: 0.85; }
.btn-cancel.cancelling,
.btn-cancel:disabled {
  background: var(--text-muted); cursor: progress; opacity: 0.7;
}
.btn-pause {
  font-size: 12px; padding: 4px 12px; border-radius: 4px; cursor: pointer;
  background: var(--warning, #d99a24); color: #1f1b12;
  border: 1px solid color-mix(in srgb, var(--warning, #d99a24) 75%, #000);
  font-weight: 600;
}
.btn-pause:hover { filter: brightness(1.06); }
.btn-pause:disabled { cursor: progress; opacity: 0.65; }
.btn-retry {
  font-size: 11px; padding: 2px 8px; border-radius: 3px; cursor: pointer;
  background: var(--accent); color: var(--accent-text); border: none;
  margin-left: 8px;
}
.btn-retry:hover { opacity: 0.85; }
.job-tree { padding: 16px 24px; }
.tree-step { margin-bottom: 2px; }
.tree-step-header {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  border-radius: 4px; cursor: pointer; transition: background 0.1s;
  font-size: 13px;
}
.tree-step-header:hover { background: var(--bg-tertiary); }
.tree-toggle {
  width: 14px; text-align: center; flex-shrink: 0; font-size: 10px;
  color: var(--text-muted); transition: transform 0.15s;
}
.tree-status-icon {
  width: 18px; text-align: center; flex-shrink: 0; font-size: 12px;
}
.tree-status-icon.pending { color: var(--text-ghost); }
.tree-status-icon.running { color: var(--accent); animation: pulse-step 1.5s ease-in-out infinite; }
.tree-status-icon.completed { color: var(--success, #4caf50); }
.tree-status-icon.warning { color: var(--warning, #f0a030); }
.tree-status-icon.failed { color: var(--danger); }
.tree-status-icon.cancelled { color: var(--text-muted); }
@keyframes pulse-step {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.tree-step-label { flex: 1; color: var(--text-primary); }
.tree-step-label.pending { color: var(--text-ghost); }
.tree-repair-list {
  margin: 6px 8px 8px 40px;
  color: var(--text-muted);
  font-size: 12px;
}
.tree-repair-item { padding: 2px 0; }
.tree-step-summary { font-size: 12px; color: var(--text-muted); }
.job-result-summary { color: var(--text-primary, inherit); font-weight: 500; }
.job-result-details { margin-top: 6px; font-size: 12px; }
.job-result-detail-line { padding: 2px 0; overflow-wrap: anywhere; }
.tree-step-progress-text {
  font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.tree-step-bar {
  width: 100px; height: 4px; background: var(--bg-tertiary); border-radius: 2px;
  overflow: hidden; flex-shrink: 0;
}
.tree-step-bar-fill {
  height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s;
}
.tree-step-bar-fill.indeterminate {
  width: 30%; animation: shimmer 1.5s ease-in-out infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}
.tree-step-duration {
  font-size: 11px; color: var(--text-ghost); font-variant-numeric: tabular-nums;
}
.tree-step-error {
  margin: 4px 0 4px 26px; padding: 6px 10px; font-size: 12px;
  color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent);
  border-radius: 4px; font-family: var(--font-mono, monospace);
}
.tree-step-error.warning {
  color: var(--warning, #f0a030);
  background: color-mix(in srgb, var(--warning, #f0a030) 10%, transparent);
}
.tree-leaves {
  margin-left: 26px; padding: 4px 0; max-height: 300px; overflow: hidden;
}
.tree-leaf {
  font-size: 12px; color: var(--text-muted); padding: 1px 8px;
  font-family: var(--font-mono, monospace); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.tree-leaf.current { color: var(--accent); }
.tree-leaf.failed { color: var(--danger); font-weight: 500; }
.tree-leaf::before { content: '\251C\2500 '; color: var(--text-ghost); }
.tree-leaf:last-child::before { content: '\2514\2500 '; color: var(--text-ghost); }
.job-card {
  border-bottom: 2px solid var(--border-primary); padding-bottom: 16px; margin-bottom: 16px;
}
.job-card:last-child { border-bottom: none; margin-bottom: 0; }
.job-card-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border-primary);
  display: flex; align-items: center; gap: 12px; background: var(--bg-secondary);
  position: sticky; top: 0; z-index: 5;
  box-shadow: 0 2px 6px color-mix(in srgb, #000 12%, transparent);
}
.job-card-workspace {
  font-size: 12px; padding: 2px 8px; border-radius: 4px;
  background: var(--bg-tertiary); color: var(--text-muted);
}
.tree-step-errors {
  font-size: 11px; color: var(--danger); font-weight: 500;
}
.tree-step-errors.warning { color: var(--warning, #f0a030); }
.tree-step-throughput {
  margin-left: 26px; padding: 2px 8px; font-size: 12px;
  color: var(--text-muted); font-style: italic;
}
.tree-step-label-source {
  margin-left: 26px; padding: 2px 8px; font-size: 12px;
  color: var(--text-muted);
}
.tree-step-current-file {
  margin-left: 26px; padding: 2px 8px; font-size: 12px;
  color: var(--accent); font-family: var(--font-mono, monospace);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.jobs-overview-divider {
  padding: 12px 24px; font-size: 12px; color: var(--text-ghost);
  text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  border-top: 1px solid var(--border-primary); margin-top: 8px;
}
.jobs-overview-empty {
  padding: 48px 24px; text-align: center; color: var(--text-ghost); font-size: 14px;
}
</style>
</head>
<body>
{% include '_navbar.html' %}

<div class="jobs-layout">
  <div class="jobs-list-pane">
    {% include '_pending_archives.html' %}
    <div class="jobs-list-header">
      Jobs <span class="badge" id="runningBadge" style="display:none;">0</span>
    </div>
    <div class="jobs-filter-bar">
      <select id="filterType" onchange="applyFilters()">
        <option value="">All types</option>
      </select>
      <select id="filterStatus" onchange="applyFilters()">
        <option value="">All status</option>
        <option value="completed">Completed</option>
        <option value="failed">Failed</option>
      </select>
    </div>
    <!-- Show when Vireo prevents idle sleep while jobs run (issue #1397). -->
    <details class="jobs-awake-note" id="keepingAwakeNote" style="display:none;">
      <summary title="Keep your laptop open while jobs run">Keeping awake</summary>
      <p>Keep your laptop open while jobs run</p>
    </details>
    <div class="jobs-list-content" id="jobListContent">
      <div style="padding:24px;text-align:center;color:var(--text-ghost);font-size:13px;">Loading...</div>
    </div>
  </div>

  <div class="jobs-detail-pane" id="jobDetailPane">
    <div class="jobs-detail-empty">Loading...</div>
  </div>
</div>

<script src="/static/jobs/state.js"></script>
<script src="/static/jobs/format.js"></script>
<script src="/static/jobs/move-route.js"></script>
<script src="/static/jobs/source-cleanup.js"></script>
<script src="/static/jobs/import-retry.js"></script>
<script src="/static/jobs/job-card.js"></script>
<script src="/static/jobs/steps.js"></script>
<script src="/static/jobs/polling.js"></script>
<script src="/static/jobs/list.js"></script>
<script src="/static/jobs/selection.js"></script>
<script src="/static/jobs/detail.js"></script>
<script src="/static/jobs/actions.js"></script>
<script src="/static/jobs/boot.js"></script>
</body>
</html>
