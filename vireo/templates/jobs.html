<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vireo-base.css">
<title>Vireo - Jobs</title>
<style>
.jobs-layout {
  display: flex; height: calc(100vh - 48px - 28px); overflow: hidden;
}
.jobs-list-pane {
  width: 320px; min-width: 240px; max-width: 400px;
  border-right: 1px solid var(--border-primary);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg-secondary);
}
.jobs-list-header {
  padding: 12px 16px; font-size: 14px; font-weight: 600;
  border-bottom: 1px solid var(--border-primary);
  display: flex; align-items: center; gap: 8px;
  color: var(--text-primary);
}
.jobs-list-header .badge {
  font-size: 11px; background: var(--accent); color: var(--accent-text);
  padding: 2px 8px; border-radius: 10px; font-variant-numeric: tabular-nums;
}
.jobs-awake-note {
  padding: 8px 16px; font-size: 12px; line-height: 1.4;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-primary);
}
.jobs-awake-note summary { cursor: pointer; }
.jobs-awake-note p { margin: 4px 0 0; }
.jobs-filter-bar {
  padding: 8px 16px; display: flex; gap: 8px;
  border-bottom: 1px solid var(--border-subtle);
}
.jobs-filter-bar select {
  font-size: 12px; padding: 4px 8px; border-radius: 4px;
  background: var(--bg-input); color: var(--text-primary);
  border: 1px solid var(--border-secondary);
}
.jobs-list-content {
  flex: 1; overflow-y: auto; padding: 0;
}
.jobs-list-divider {
  padding: 6px 16px; font-size: 11px; color: var(--text-ghost);
  text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  background: var(--bg-tertiary);
}
.jobs-list-divider.clickable {
  cursor: pointer; transition: background 0.1s; user-select: none;
}
.jobs-list-divider.clickable:hover { background: var(--bg-tertiary); }
.jobs-list-divider.clickable.selected {
  background: var(--bg-tertiary); border-left: 3px solid var(--accent); padding-left: 13px;
}
.job-list-item {
  padding: 10px 16px; cursor: pointer;
  border-bottom: 1px solid var(--border-subtle);
  transition: background 0.1s;
}
.job-list-item:hover { background: var(--bg-tertiary); }
.job-list-item.selected { background: var(--bg-tertiary); border-left: 3px solid var(--accent); padding-left: 13px; }
.job-list-item-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
}
.job-list-item-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.job-list-item-dot.running { background: var(--accent); animation: pulse-dot 1.5s ease-in-out infinite; }
.job-list-item-dot.pausing { background: var(--warning, #d99a24); animation: pulse-dot 1.5s ease-in-out infinite; }
.job-list-item-dot.paused { background: var(--warning, #d99a24); }
.job-list-item-dot.queued { background: var(--text-muted, #888); border: 1px solid var(--accent); }
.job-list-item-dot.completed { background: var(--success, #4caf50); }
.job-list-item-dot.failed { background: var(--danger); }
.job-list-item-dot.cancelled { background: var(--text-ghost); }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.job-list-item-type {
  font-size: 13px; font-weight: 600; color: var(--text-primary);
  text-transform: capitalize; flex: 1;
}
.job-list-item-time {
  font-size: 11px; color: var(--text-ghost); font-variant-numeric: tabular-nums;
}
.job-list-item-detail {
  font-size: 12px; color: var(--text-muted); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.job-list-item-progress {
  margin-top: 5px; height: 6px; background: var(--bg-tertiary); border-radius: 3px;
}
.job-list-item-progress-fill {
  height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s;
}
.jobs-detail-pane {
  flex: 1; overflow-y: auto; padding: 0;
  background: var(--bg-primary);
}
.jobs-detail-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text-ghost); font-size: 14px;
}
.job-detail-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border-primary);
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-secondary);
}
.job-detail-title {
  font-size: 16px; font-weight: 600; color: var(--text-primary);
  text-transform: capitalize; flex: 1;
}
.job-detail-status {
  font-size: 12px; padding: 3px 10px; border-radius: 4px; font-weight: 500;
}
.job-detail-status.running { background: var(--accent); color: var(--accent-text); }
.job-detail-status.pausing,
.job-detail-status.paused { background: color-mix(in srgb, var(--warning, #d99a24) 20%, transparent); color: var(--warning, #d99a24); }
.job-detail-status.queued { background: var(--bg-tertiary); color: var(--text-muted, #888); border: 1px solid var(--border-secondary); }
.job-detail-status.completed { background: color-mix(in srgb, var(--success, #4caf50) 20%, transparent); color: var(--success, #4caf50); }
.job-detail-status.failed { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
.job-detail-meta {
  font-size: 12px; color: var(--text-muted); display: flex; gap: 16px;
  flex-wrap: wrap; padding: 8px 24px; border-bottom: 1px solid var(--border-subtle);
}
.job-move-route {
  display: grid; grid-template-columns: max-content minmax(0, 1fr);
  gap: 6px 12px; padding: 12px 24px;
  border-bottom: 1px solid var(--border-subtle);
  background: color-mix(in srgb, var(--bg-secondary) 55%, transparent);
}
.job-move-route-label {
  color: var(--text-muted); font-size: 12px; font-weight: 600;
}
.job-move-route-path {
  color: var(--text-primary); font-size: 12px;
  font-family: var(--font-mono, monospace);
  overflow-wrap: anywhere;
}
.job-move-route-note {
  grid-column: 2; color: var(--text-muted); font-size: 11px;
}
.job-pause-banner {
  font-size: 13px; padding: 8px 12px; margin: 8px 0;
  background: color-mix(in srgb, var(--warning, #d99a24) 12%, transparent);
  border-left: 3px solid var(--warning, #d99a24);
  color: var(--text-primary);
  border-radius: 3px;
}
.btn-cancel {
  font-size: 12px; padding: 4px 12px; border-radius: 4px; cursor: pointer;
  background: var(--danger); color: #fff; border: none;
}
.btn-cancel:hover { opacity: 0.85; }
.btn-cancel.cancelling,
.btn-cancel:disabled {
  background: var(--text-muted); cursor: progress; opacity: 0.7;
}
.btn-pause {
  font-size: 12px; padding: 4px 12px; border-radius: 4px; cursor: pointer;
  background: var(--warning, #d99a24); color: #1f1b12;
  border: 1px solid color-mix(in srgb, var(--warning, #d99a24) 75%, #000);
  font-weight: 600;
}
.btn-pause:hover { filter: brightness(1.06); }
.btn-pause:disabled { cursor: progress; opacity: 0.65; }
.btn-retry {
  font-size: 11px; padding: 2px 8px; border-radius: 3px; cursor: pointer;
  background: var(--accent); color: var(--accent-text); border: none;
  margin-left: 8px;
}
.btn-retry:hover { opacity: 0.85; }
.job-tree { padding: 16px 24px; }
.tree-step { margin-bottom: 2px; }
.tree-step-header {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  border-radius: 4px; cursor: pointer; transition: background 0.1s;
  font-size: 13px;
}
.tree-step-header:hover { background: var(--bg-tertiary); }
.tree-toggle {
  width: 14px; text-align: center; flex-shrink: 0; font-size: 10px;
  color: var(--text-muted); transition: transform 0.15s;
}
.tree-status-icon {
  width: 18px; text-align: center; flex-shrink: 0; font-size: 12px;
}
.tree-status-icon.pending { color: var(--text-ghost); }
.tree-status-icon.running { color: var(--accent); animation: pulse-step 1.5s ease-in-out infinite; }
.tree-status-icon.completed { color: var(--success, #4caf50); }
.tree-status-icon.warning { color: var(--warning, #f0a030); }
.tree-status-icon.failed { color: var(--danger); }
.tree-status-icon.cancelled { color: var(--text-muted); }
@keyframes pulse-step {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.tree-step-label { flex: 1; color: var(--text-primary); }
.tree-step-label.pending { color: var(--text-ghost); }
.tree-repair-list {
  margin: 6px 8px 8px 40px;
  color: var(--text-muted);
  font-size: 12px;
}
.tree-repair-item { padding: 2px 0; }
.tree-step-summary { font-size: 12px; color: var(--text-muted); }
.job-result-summary { color: var(--text-primary, inherit); font-weight: 500; }
.job-result-details { margin-top: 6px; font-size: 12px; }
.job-result-detail-line { padding: 2px 0; overflow-wrap: anywhere; }
.tree-step-progress-text {
  font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.tree-step-bar {
  width: 100px; height: 4px; background: var(--bg-tertiary); border-radius: 2px;
  overflow: hidden; flex-shrink: 0;
}
.tree-step-bar-fill {
  height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s;
}
.tree-step-bar-fill.indeterminate {
  width: 30%; animation: shimmer 1.5s ease-in-out infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}
.tree-step-duration {
  font-size: 11px; color: var(--text-ghost); font-variant-numeric: tabular-nums;
}
.tree-step-error {
  margin: 4px 0 4px 26px; padding: 6px 10px; font-size: 12px;
  color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent);
  border-radius: 4px; font-family: var(--font-mono, monospace);
}
.tree-step-error.warning {
  color: var(--warning, #f0a030);
  background: color-mix(in srgb, var(--warning, #f0a030) 10%, transparent);
}
.tree-leaves {
  margin-left: 26px; padding: 4px 0; max-height: 300px; overflow: hidden;
}
.tree-leaf {
  font-size: 12px; color: var(--text-muted); padding: 1px 8px;
  font-family: var(--font-mono, monospace); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.tree-leaf.current { color: var(--accent); }
.tree-leaf.failed { color: var(--danger); font-weight: 500; }
.tree-leaf::before { content: '\251C\2500 '; color: var(--text-ghost); }
.tree-leaf:last-child::before { content: '\2514\2500 '; color: var(--text-ghost); }
.job-card {
  border-bottom: 2px solid var(--border-primary); padding-bottom: 16px; margin-bottom: 16px;
}
.job-card:last-child { border-bottom: none; margin-bottom: 0; }
.job-card-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border-primary);
  display: flex; align-items: center; gap: 12px; background: var(--bg-secondary);
  position: sticky; top: 0; z-index: 5;
  box-shadow: 0 2px 6px color-mix(in srgb, #000 12%, transparent);
}
.job-card-workspace {
  font-size: 12px; padding: 2px 8px; border-radius: 4px;
  background: var(--bg-tertiary); color: var(--text-muted);
}
.tree-step-errors {
  font-size: 11px; color: var(--danger); font-weight: 500;
}
.tree-step-errors.warning { color: var(--warning, #f0a030); }
.tree-step-throughput {
  margin-left: 26px; padding: 2px 8px; font-size: 12px;
  color: var(--text-muted); font-style: italic;
}
.tree-step-label-source {
  margin-left: 26px; padding: 2px 8px; font-size: 12px;
  color: var(--text-muted);
}
.tree-step-current-file {
  margin-left: 26px; padding: 2px 8px; font-size: 12px;
  color: var(--accent); font-family: var(--font-mono, monospace);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.jobs-overview-divider {
  padding: 12px 24px; font-size: 12px; color: var(--text-ghost);
  text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  border-top: 1px solid var(--border-primary); margin-top: 8px;
}
.jobs-overview-empty {
  padding: 48px 24px; text-align: center; color: var(--text-ghost); font-size: 14px;
}
</style>
</head>
<body>
{% include '_navbar.html' %}

<div class="jobs-layout">
  <div class="jobs-list-pane">
    {% include '_pending_archives.html' %}
    <div class="jobs-list-header">
      Jobs <span class="badge" id="runningBadge" style="display:none;">0</span>
    </div>
    <div class="jobs-filter-bar">
      <select id="filterType" onchange="applyFilters()">
        <option value="">All types</option>
      </select>
      <select id="filterStatus" onchange="applyFilters()">
        <option value="">All status</option>
        <option value="completed">Completed</option>
        <option value="failed">Failed</option>
      </select>
    </div>
    <!-- Show when Vireo prevents idle sleep while jobs run (issue #1397). -->
    <details class="jobs-awake-note" id="keepingAwakeNote" style="display:none;">
      <summary title="Keep your laptop open while jobs run">Keeping awake</summary>
      <p>Keep your laptop open while jobs run</p>
    </details>
    <div class="jobs-list-content" id="jobListContent">
      <div style="padding:24px;text-align:center;color:var(--text-ghost);font-size:13px;">Loading...</div>
    </div>
  </div>

  <div class="jobs-detail-pane" id="jobDetailPane">
    <div class="jobs-detail-empty">Loading...</div>
  </div>
</div>

<script>
(function() {
  var activeJobs = [];
  var historyJobs = [];
  var selectedJobId = null;
  var selectedSource = null;
  var pollTimer = null;
  var sseSource = null;
  var leafBuffers = {};
  var leafBufferSources = {};
  var LEAF_MAX = 20;
  // Job ids the user has clicked Cancel on but the server hasn't yet
  // moved out of the active list. Tracked here so subsequent renders
  // (every 2s poll) keep showing the optimistic "Cancelling…" state
  // instead of reverting to a fresh "Cancel" button.
  var cancellingJobIds = {};
  var collapsedSteps = {};
  var activeWsId = null;
  var workspaceNames = {};
  var currentView = 'active'; // 'active', 'history', or a job id

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatElapsed(secs) {
    if (secs < 60) return Math.round(secs) + 's';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ' + Math.round(secs % 60) + 's';
    return Math.floor(secs / 3600) + 'h ' + Math.floor((secs % 3600) / 60) + 'm';
  }

  function timeAgo(iso) {
    var secs = (Date.now() - new Date(iso).getTime()) / 1000;
    if (secs < 60) return 'just now';
    if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
    if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
    return Math.floor(secs / 86400) + 'd ago';
  }

  function toggleIcon(isExpanded) {
    return '<span class="tree-toggle">' + (isExpanded ? '\u25BC' : '\u25B6') + '</span>';
  }

  function statusIcon(status, warningCount) {
    switch (status) {
      case 'pending': return '<span class="tree-status-icon pending">\u25CB</span>';
      case 'running': return '<span class="tree-status-icon running">\u25CB</span>';
      case 'completed':
        if (warningCount > 0) return '<span class="tree-status-icon warning" title="Completed with warnings">!</span>';
        return '<span class="tree-status-icon completed">\u2713</span>';
      case 'failed': return '<span class="tree-status-icon failed">\u2717</span>';
      case 'cancelled': return '<span class="tree-status-icon cancelled">\u2298</span>';
      default: return '<span class="tree-status-icon pending">\u25CB</span>';
    }
  }

  function isLiveStatus(status) {
    return status === 'running' || status === 'queued' ||
      status === 'pausing' || status === 'paused';
  }

  function activeProgress(progress) {
    if (!progress) return null;
    if (typeof progress.phase_current === 'number' && progress.phase_total > 0) {
      return {
        current: progress.phase_current,
        total: progress.phase_total,
        label: progress.phase_label || progress.phase || 'Current phase',
        phase: true,
      };
    }
    if (progress.total > 0) {
      return {
        current: progress.current || 0,
        total: progress.total,
        label: 'Overall',
        phase: false,
      };
    }
    return null;
  }

  function progressPct(info) {
    if (!info || !info.total) return 0;
    return Math.max(0, Math.min(100, Math.round((info.current / info.total) * 100)));
  }

  function jobConfig(job) {
    return job && job.config && typeof job.config === 'object' ? job.config : {};
  }

  function renderMoveRoute(job) {
    if (!job || job.type !== 'move-folder') return '';
    var cfg = jobConfig(job);
    var source = cfg.source_path;
    var destination = cfg.resolved_destination;
    // Older history entries predate the route snapshot. Avoid presenting
    // their destination parent as though it were the exact landing folder.
    if (!source || !destination) return '';

    var html = '<div class="job-move-route" aria-label="Move locations">';
    html += '<span class="job-move-route-label">From</span>';
    html += '<span class="job-move-route-path" title="' +
      escapeAttr(source) + '">' + esc(source) + '</span>';
    html += '<span class="job-move-route-label">To</span>';
    html += '<span class="job-move-route-path" title="' +
      escapeAttr(destination) + '">' + esc(destination) + '</span>';
    if (cfg.folder_template) {
      html += '<span class="job-move-route-note">Organizing photos into capture-date folders using <code>' +
        esc(cfg.folder_template) + '</code></span>';
    } else if (cfg.merge) {
      html += '<span class="job-move-route-note">Merging with the existing destination folder</span>';
    }
    html += '</div>';
    return html;
  }

  // A retry job carries its parent's id in ``config.parent_import_job_id``
  // and the original failed import's id in ``config.root_import_job_id``
  // (see api_job_import_photos). Suppresses the Retry button on the
  // original failed import while any active-or-recently-launched retry
  // in that chain is still in flight — a second click would otherwise
  // enqueue a parallel import of the same source and destination,
  // letting the after-import chains and any ``after_process_move`` race
  // with the first retry's move (which may already have relocated the
  // folders). Matches either field so a retry-of-retry — whose direct
  // ``parent_import_job_id`` points at the first retry, not the
  // original failed import — still blocks the original's Retry button.
  function hasActiveRetryFor(parentId) {
    if (!parentId) return false;
    return activeJobs.some(function(candidate) {
      if (!candidate || candidate.type !== 'import') return false;
      var status = candidate.status;
      if (status === 'completed' || status === 'failed' ||
          status === 'cancelled') return false;
      var cfg = jobConfig(candidate);
      if (!cfg) return false;
      return cfg.parent_import_job_id === parentId ||
             cfg.root_import_job_id === parentId;
    });
  }

  function importRetryBody(job) {
    var cfg = jobConfig(job);
    if (!job || job.type !== 'import' || cfg.mode === 'in_place' ||
        !Array.isArray(cfg.sources) || !cfg.sources.length) return null;
    // parent_import_job_id lets the server bind carry_photo_ids to this
    // parent's imported scope and, when the parent used a remote
    // target, verify the target still resolves to the enqueue-time
    // host/root/mount. Without a parent id the server rejects the
    // carry list, so the retry couldn't chain properly.
    if (!job.id) return null;
    // See import.html retryBodyFromFinishedJob for the full rationale:
    // an empty custom folder_template means "copy into the archive
    // root" and must not be overwritten by the default; the parent's
    // skip_duplicates setting must not be forced on, or a failed file
    // that matches some other catalog entry gets skipped again instead
    // of copied.
    var folderTemplate = cfg.folder_template != null
      ? cfg.folder_template : '%Y/%Y-%m-%d';
    var parentSkipDuplicates = cfg.skip_duplicates != null
      ? !!cfg.skip_duplicates : true;
    var body = {
      sources: cfg.sources.slice(),
      destination: cfg.destination,
      recursive: cfg.recursive !== false,
      folder_template: folderTemplate,
      file_types: cfg.file_types || 'both',
      skip_duplicates: parentSkipDuplicates,
      verify_by_hash: !!cfg.verify_by_hash,
      trust_likely_duplicates: !!cfg.trust_likely_duplicates,
      after_import: cfg.after_import == null ? null : cfg.after_import,
      tags: Array.isArray(cfg.tags) ? cfg.tags.slice() : [],
      location_from_gps: !!cfg.location_from_gps,
      allow_missing_exiftool: !!cfg.allow_missing_exiftool,
      parent_import_job_id: job.id,
    };
    // Recover the complete original scope. See import.html for the full
    // rationale; the summary: the parent's failed run skipped chaining
    // entirely, so previously-landed files still need processing, and
    // on repeated retries the accumulated carry list has to keep
    // growing rather than reset to only the last retry's landed files.
    var parentCarry = Array.isArray(cfg.carry_photo_ids)
      ? cfg.carry_photo_ids : [];
    var parentImported = Array.isArray(job.result && job.result.photo_ids)
      ? job.result.photo_ids : [];
    var carry = [];
    var carrySeen = {};
    parentCarry.concat(parentImported).forEach(function(pid) {
      if (typeof pid !== 'number' || !Number.isInteger(pid) || pid <= 0) return;
      if (carrySeen[pid]) return;
      carrySeen[pid] = true;
      carry.push(pid);
    });
    if (carry.length) body.carry_photo_ids = carry;
    // Recover the parent's per-file selection so the retry stays scoped
    // to the same files. See import.html retryBodyFromFinishedJob for the
    // full rationale: without this the retry either fails the drift check
    // or, once past it, silently re-imports the files the user
    // deselected on the parent run. The three selection fields must
    // travel together — the server 400s on a partial set.
    if (Array.isArray(cfg.include_paths) && cfg.include_paths.length
        && typeof cfg.previewed_count === 'number'
        && typeof cfg.checked_count === 'number') {
      body.include_paths = cfg.include_paths.slice();
      body.previewed_count = cfg.previewed_count;
      body.checked_count = cfg.checked_count;
    }
    if (cfg.remote_target_id) {
      delete body.destination;
      body.remote_target_id = cfg.remote_target_id;
      body.remote_subpath = cfg.remote_subpath;
    }
    if (cfg.after_process_move && cfg.after_process_move.remote_target_id) {
      body.after_process_move = {
        remote_target_id: cfg.after_process_move.remote_target_id,
      };
    }
    body.local_processing = !!cfg.local_processing;
    body.defer_nas_transfer = !!cfg.defer_nas_transfer;
    return body;
  }

  function jobCollectionText(job) {
    var cfg = jobConfig(job);
    if (cfg.collection_name) return 'Collection: ' + cfg.collection_name;
    if (cfg.collection_id !== undefined && cfg.collection_id !== null && cfg.collection_id !== '') {
      return 'Collection #' + cfg.collection_id;
    }
    return '';
  }

  function renderJobCard(job, options) {
    options = options || {};
    // Queued pipelines are "live" for UI purposes: they have a real
    // backend identity, they're cancellable (runner.cancel_job handles
    // the queued case), and dropping them out of the active section
    // strands them — the user has no way to find or cancel a queued
    // pipeline until the slot opens.
    var isLive = isLiveStatus(job.status);
    var elapsed = '';
    if (isLive && job.started_at) {
      elapsed = formatElapsed((Date.now() - new Date(job.started_at).getTime()) / 1000);
    } else if (job.duration != null) {
      elapsed = formatElapsed(job.duration);
    } else if (job.result && job.result.interrupted && !job.result.last_progress_at) {
      elapsed = 'unknown (no progress recorded before the restart)';
    } else if (job.started_at && job.finished_at) {
      elapsed = formatElapsed((new Date(job.finished_at).getTime() - new Date(job.started_at).getTime()) / 1000);
    }

    var html = '<div class="job-card">';

    // Header: type, workspace label, status, cancel
    html += '<div class="job-card-header">';
    html += '<span class="job-detail-title">' + esc(window.formatJobType(job.type)) + '</span>';
    if (options.workspaceName) {
      html += '<span class="job-card-workspace">' + esc(options.workspaceName) + '</span>';
    }
    html += '<span class="job-detail-status ' + job.status + '">' + job.status + '</span>';
    if (isLive) {
      if (job.pausable && job.status === 'running') {
        html += '<button class="btn-pause" data-pause-job="' + escapeAttr(job.id) + '">Pause</button>';
      } else if (job.pausable && job.status === 'pausing') {
        // The pause has been requested but not yet honored: the worker
        // stops at its next safe checkpoint, which can be minutes away
        // (e.g. label embeddings inside the model lock). The status pill
        // still reads "pausing" so the user can see it is underway; this
        // button withdraws the request via the resume endpoint, which
        // accepts pausing as well as paused.
        //
        // BUT: when the pipeline itself parked the job on a dead source
        // (``_handle_source_offline`` in pipeline_job.py publishes
        // ``pause_reason`` before flipping to ``pausing``), cancelling
        // the pause would immediately retry the unreachable volume and
        // burn one of the bounded ``_MAX_SOURCE_OFFLINE_PAUSES`` attempts
        // — repeated clicks can convert a recoverable outage into a
        // failed run. Only offer cancel for user-requested pauses; for
        // safety pauses, leave the disabled ``Pausing…`` button so the
        // banner tells the user to reconnect the source instead.
        var automaticPauseReason = job.progress && job.progress.pause_reason;
        if (automaticPauseReason) {
          html += '<button class="btn-pause" disabled title="This pause was triggered automatically (see the pause banner). Fix the underlying issue, then Resume.">Pausing…</button>';
        } else {
          html += '<button class="btn-pause" data-resume-job="' + escapeAttr(job.id) + '" data-cancel-pause="1" title="Pause is still pending; the job stops at its next safe checkpoint. Click to keep it running instead.">Cancel pause</button>';
        }
      } else if (job.pausable && job.status === 'paused') {
        html += '<button class="btn-pause" data-resume-job="' + escapeAttr(job.id) + '">Resume</button>';
      }
      if (cancellingJobIds[job.id]) {
        html += '<button class="btn-cancel cancelling" disabled>Cancelling…</button>';
      } else {
        html += '<button class="btn-cancel" data-cancel-job="' + esc(job.id) + '">Cancel</button>';
      }
    }
    html += '</div>';

    // Meta: started, elapsed, overall %
    html += '<div class="job-detail-meta">';
    html += '<span>Started: ' + new Date(job.started_at).toLocaleTimeString() + '</span>';
    html += '<span>Elapsed: ' + elapsed + '</span>';
    var collectionText = jobCollectionText(job);
    if (collectionText) {
      html += '<span>' + esc(collectionText) + '</span>';
    }
    var visibleProgress = activeProgress(job.progress);
    if (visibleProgress) {
      html += '<span>' + esc(visibleProgress.label) + ': ' + progressPct(visibleProgress) + '%</span>';
    }
    html += '</div>';

    html += renderMoveRoute(job);

    var failedImportCount = job.result && Number(job.result.failed || 0);
    if (!isLive && failedImportCount > 0 && importRetryBody(job)) {
      var retryInFlight = hasActiveRetryFor(job.id);
      html += '<div style="padding:10px 0 2px;font-size:12px;color:var(--text-muted);">';
      if (retryInFlight) {
        // Same failed job, retry already running. A second Start would
        // race the first — same source, same destination, same carry
        // scope — so surface the in-flight status instead of a live
        // button. Re-enables automatically when the retry finishes and
        // ``activeJobs`` no longer contains it.
        html += '<button class="btn-retry" disabled aria-disabled="true" ' +
          'title="A retry for this import is already running">' +
          'Retry in progress…</button>';
        html += '<span style="margin-left:8px;">Retry already launched for this job; wait for it to finish before starting another.</span>';
      } else {
        html += '<button class="btn-retry" data-retry-import-job="' +
          escapeAttr(job.id) + '">Retry ' + failedImportCount + ' failed file' +
          (failedImportCount === 1 ? '' : 's') + '</button>';
        html += '<span style="margin-left:8px;">Same source and destination; successful files are skipped.</span>';
      }
      html += '</div>';
    }

    // Pause reason banner: when classify (or any pipeline stage) parks the
    // job on an outage it can't recover from on its own — a dropped share,
    // missing volume — it publishes ``pause_reason`` on job.progress. Without
    // this banner the user only sees a generic "paused" pill and can't tell
    // what to fix before pressing Resume.
    var pauseReason = job.progress && job.progress.pause_reason;
    if (pauseReason && (job.status === 'pausing' || job.status === 'paused')) {
      html += '<div class="job-pause-banner">' + esc(pauseReason) + '</div>';
    }

    // Interrupted-by-restart banner. The startup sweep keeps whatever
    // the checkpoint thread last recorded (step tree, progress) and
    // stamps result.interrupted; say plainly what was recorded and when,
    // instead of leaving the user with a bare error string.
    if (!isLive && job.result && job.result.interrupted) {
      html += '<div class="job-pause-banner">' + esc(interruptedText(job)) + '</div>';
    }

    // Steps
    var steps = job.steps || job.tree || [];
    if (steps.length > 0) {
      html += '<div class="job-tree">';
      steps.forEach(function(step) {
        html += renderRichStep(step, job, isLive);
      });
      html += '</div>';
    } else if (isLive && job.progress) {
      // Fallback for running jobs without steps
      html += '<div class="job-tree"><div style="padding:8px;font-size:13px;color:var(--text-muted);">';
      if (job.progress.phase) html += '<div style="color:var(--accent);font-weight:500;margin-bottom:8px;">' + esc(job.progress.phase) + '</div>';
      var fallbackProgress = activeProgress(job.progress);
      if (fallbackProgress) {
        var pct = progressPct(fallbackProgress);
        html += '<div class="tree-step-bar" style="width:200px;margin-bottom:4px;"><div class="tree-step-bar-fill" style="width:' + pct + '%"></div></div>';
        html += '<div>' + esc(fallbackProgress.label) + ': ' + fallbackProgress.current.toLocaleString() + ' / ' + fallbackProgress.total.toLocaleString() + '</div>';
      }
      if (job.progress.current_file) html += '<div style="margin-top:4px;">' + esc(job.progress.current_file) + '</div>';
      html += '</div></div>';
    } else if (!isLive) {
      // Fallback for completed/failed jobs without steps. The server
      // turns the raw result dict into prose (``summary`` plus
      // ``result_details`` lines, see job_summaries.py) so the user never
      // sees ``{"deleted": 28, "trashed": 28, ...}``.
      html += '<div class="job-tree"><div style="padding:8px;font-size:13px;color:var(--text-muted);">';
      // History rows carry the failure in result.error (the persisted
      // payload), not job.error. When the startup sweep stamped
      // result.interrupted, the banner above already says it.
      var resultError = job.error || (job.result && typeof job.result === 'object' && job.result.error) || '';
      var wasInterrupted = !!(job.result && job.result.interrupted);
      if (wasInterrupted && resultError === job.result.error) {
        resultError = '';
      }
      if (resultError) {
        html += '<div style="color:var(--danger);font-weight:500;">Error: ' + esc(resultError) + '</div>';
      }
      var resultSummary = job.summary || '';
      // Job-authored summaries often wrap the error ("Move failed — <error>");
      // don't print the same message twice. Interrupted rows' summaries
      // restate the banner, so skip them too.
      if (resultSummary && !(resultError && resultSummary.indexOf(resultError) !== -1) && !wasInterrupted) {
        html += '<div class="job-result-summary">' + esc(resultSummary) + '</div>';
      }
      var resultDetails = Array.isArray(job.result_details) ? job.result_details : [];
      if (resultDetails.length > 0) {
        html += '<div class="job-result-details">';
        resultDetails.forEach(function(line) {
          html += '<div class="job-result-detail-line">' + esc(line) + '</div>';
        });
        html += '</div>';
      }
      if (!resultError && !resultSummary && resultDetails.length === 0 && !wasInterrupted) {
        html += '<div>No details available</div>';
      }
      html += '</div></div>';
    }

    html += '</div>';
    return html;
  }

  // Plain-language account of a job the restart cut short: how far it
  // got (steps finished, or the last recorded count) and when that was
  // last recorded. Never claims more than the checkpoint actually saw.
  function interruptedText(job) {
    var parts = ['Interrupted by Vireo restart.'];
    var steps = job.steps || job.tree || [];
    var progress = job.progress || {};
    if (steps.length > 0) {
      var done = steps.filter(function(s) { return s.status === 'completed'; }).length;
      parts.push(done + ' of ' + steps.length + (steps.length === 1 ? ' step' : ' steps') +
        ' finished before the restart.');
    } else if (typeof progress.current === 'number' &&
               (progress.current > 0 || progress.total > 0)) {
      // "0 of N" is worth saying: it tells the user nothing was done.
      var got = 'Got through ' + progress.current.toLocaleString();
      if (progress.total > 0) got += ' of ' + progress.total.toLocaleString();
      if (progress.phase) got += ' (' + progress.phase + ')';
      parts.push(got + '.');
    }
    if (progress.current_file) {
      parts.push('Last file: ' + progress.current_file + '.');
    }
    if (job.result.last_progress_at) {
      parts.push('Last progress was recorded at ' +
        new Date(job.result.last_progress_at).toLocaleString() + '.');
    } else {
      parts.push('No progress was recorded before the restart.');
    }
    return parts.join(' ');
  }

  // "key: value" lines for a finished job's result, in place of a raw
  // JSON dump. Keys the interruption bookkeeping adds (and the error,
  // which renders on its own line) are skipped; nested objects stay as
  // compact JSON so nothing is hidden.
  function renderRichStep(step, job, isLive) {
    var isRunning = step.status === 'running';
    var warningCount = step.error_count || (step.error ? 1 : 0);
    var isExpanded = isRunning || step.status === 'failed' || (step.status === 'completed' && warningCount > 0);
    if (collapsedSteps[step.id] === true) isExpanded = false;
    if (collapsedSteps[step.id] === false) isExpanded = true;
    // Import-in-place reuses one scan step across every source. Clear the
    // prior source's filenames as soon as the backend advances that source
    // index, even if the step is currently collapsed.
    if (job.type === 'import-in-place' &&
        typeof step.source_index === 'number' &&
        leafBufferSources[step.id] !== step.source_index) {
      delete leafBuffers[step.id];
      leafBufferSources[step.id] = step.source_index;
    }

    var html = '<div class="tree-step" data-step-id="' + esc(step.id) + '">';
    html += '<div class="tree-step-header" data-toggle-step="' + esc(step.id) + '">';
    html += toggleIcon(isExpanded);
    html += statusIcon(step.status, warningCount);
    html += '<span class="tree-step-label' + (step.status === 'pending' ? ' pending' : '') + '">' + esc(step.label) + '</span>';

    // 1-3: Progress counts, bar, percentage (for steps with progress)
    if (step.progress && step.progress.current > 0) {
      if (step.progress.total > 0) {
        var pct = Math.round((step.progress.current / step.progress.total) * 100);
        html += '<span class="tree-step-progress-text">' + step.progress.current.toLocaleString() + ' / ' + step.progress.total.toLocaleString() + '</span>';
        html += '<div class="tree-step-bar"><div class="tree-step-bar-fill" style="width:' + pct + '%"></div></div>';
        html += '<span class="tree-step-progress-text">' + pct + '%</span>';
      } else {
        html += '<span class="tree-step-progress-text">' + step.progress.current.toLocaleString() + ' / ?</span>';
        html += '<div class="tree-step-bar"><div class="tree-step-bar-fill indeterminate"></div></div>';
      }
    }

    // 7: Summary for terminal steps. The backend writes explanatory
    // summaries on completed, cancelled ("Cancelled (N animals detected
    // so far)"), and some failed steps (e.g. scan) — show them all.
    var isTerminal = step.status === 'completed' || step.status === 'cancelled' || step.status === 'failed';
    if (isTerminal && step.summary) {
      html += '<span class="tree-step-summary">(' + esc(step.summary) + ')</span>';
    }

    // 6: Duration — live timer for running, final for completed
    if (isRunning && step.started_at) {
      var stepElapsed = (Date.now() - new Date(step.started_at).getTime()) / 1000;
      html += '<span class="tree-step-duration">' + formatElapsed(stepElapsed) + '</span>';
    } else if (step.duration != null) {
      html += '<span class="tree-step-duration">' + formatElapsed(step.duration) + '</span>';
    }

    // 5: Error count (per-step, not global job.errors)
    var ec = step.error_count || 0;
    if (step.error) ec = Math.max(ec, 1);
    if (ec > 0) {
      var issueLabel = step.status === 'completed' ? 'warning' : 'error';
      var issueClass = step.status === 'completed' ? ' warning' : '';
      html += '<span class="tree-step-errors' + issueClass + '">' + ec + ' ' + issueLabel + (ec > 1 ? 's' : '') + '</span>';
    }

    // Retry button for failed steps on live jobs
    if (step.status === 'failed' && isLive) {
      html += '<button class="btn-retry" onclick="event.stopPropagation();">Retry</button>';
    }

    html += '</div>'; // end header

    // Expanded content
    if (isExpanded) {
      // Which label space this classify step compares photos against. The
      // header names the model; the same model against a regional species
      // list and against Tree of Life are different classifiers as far as
      // the results go, so the list has to be named too.
      if (step.label_source) {
        html += '<div class="tree-step-label-source">' + esc(step.label_source) + '</div>';
      }

      // Import-in-place publishes explicit discovery and metadata sub-phases.
      // Its overall file counter intentionally pauses during those phases, so
      // extrapolating current / whole-step elapsed produces a fake ETA that
      // grows while useful work is happening. The phase counter in the card
      // header is the truthful progress signal until file processing resumes.
      var importInPlacePhaseActive = job.type === 'import-in-place' &&
        job.progress && typeof job.progress.phase_current === 'number' &&
        job.progress.phase_total > 0;

      // 8: Throughput + ETA for running steps
      if (isRunning && step.progress && step.progress.current > 0 &&
          step.started_at && !importInPlacePhaseActive && step.progress.unit !== 'labels') {
        if (job.type === 'import') {
          // Import's visible counter advances while a batch is prepared,
          // before its transfer and restricted catalog scan finish. Use the
          // backend's completed-batch estimate instead of current / elapsed,
          // which is badly skewed by fast duplicate checks and queued files.
          var etaState = step.progress.eta_state;
          var etaSeconds = Number(step.progress.eta_seconds);
          var etaRate = Number(step.progress.eta_rate_per_min);
          var importStatusLine;
          if (etaState === 'ready' && isFinite(etaSeconds)) {
            if (etaSeconds > 0) {
              if (isFinite(etaRate) && etaRate > 0) {
                importStatusLine = '~' + Math.round(etaRate) +
                  '/min from completed batches';
              } else {
                importStatusLine = 'Based on completed batches';
              }
              importStatusLine += ' &middot; ETA ' + formatElapsed(etaSeconds);
            } else {
              importStatusLine = 'Copy batches complete &middot; finishing import…';
            }
          } else {
            importStatusLine = 'Estimating after the first transfer batch…';
          }
          html += '<div class="tree-step-throughput">' + importStatusLine + '</div>';
        } else if (step.progress.eta_kind === 'classification') {
          // Classification can walk cached photos far faster than it can
          // decode and infer uncached ones. Use the backend's model-work ETA;
          // current / elapsed would turn a cache-heavy prefix into a wildly
          // optimistic prediction for the uncached tail.
          var classifyParts = [];
          var cacheHits = Number(step.progress.cache_hits) || 0;
          var classified = Number(step.progress.classified) || 0;
          if (cacheHits > 0) {
            classifyParts.push(cacheHits.toLocaleString() + ' cached');
          }
          if (classified > 0) {
            classifyParts.push(
              classified.toLocaleString() + ' newly classified'
            );
          }
          var classifyEtaState = step.progress.eta_state;
          var classifyEtaSeconds = Number(step.progress.eta_seconds);
          var classifyRate = Number(step.progress.eta_rate_per_min);
          if (
            classifyEtaState === 'ready'
            && isFinite(classifyEtaSeconds)
            && isFinite(classifyRate)
            && classifyRate > 0
          ) {
            classifyParts.push('~' + Math.round(classifyRate) + '/min uncached');
            if (classifyEtaSeconds > 0) {
              classifyParts.push('ETA ' + formatElapsed(classifyEtaSeconds));
            } else {
              classifyParts.push('finishing…');
            }
          } else if (classifyEtaState === 'finishing') {
            classifyParts.push('finishing…');
          } else {
            classifyParts.push('Estimating after the first uncached batch…');
          }
          html += '<div class="tree-step-throughput">' +
            classifyParts.join(' &middot; ') + '</div>';
        } else {
          var stepSecs = (Date.now() - new Date(step.started_at).getTime()) / 1000;
          if (stepSecs > 0) {
            var perSec = step.progress.current / stepSecs;
            var perMin = perSec * 60;
            var throughput;
            if (perMin >= 1) {
              throughput = '~' + Math.round(perMin) + '/min';
            } else {
              throughput = '~' + (1 / perSec).toFixed(1) + 's each';
            }
            var statusLine = throughput;
            // ETA only when we know the total and have a non-zero rate
            if (step.progress.total > 0 && perSec > 0) {
              var remaining = step.progress.total - step.progress.current;
              if (remaining > 0) {
                statusLine += ' &middot; ETA ' + formatElapsed(remaining / perSec);
              }
            }
            html += '<div class="tree-step-throughput">' + statusLine + '</div>';
          }
        }
      }

      // 4: Current file (step-level preferred, fall back to job-level)
      var currentFile = step.current_file || (isRunning && job.progress && job.progress.current_file ? job.progress.current_file : '');
      if (isRunning && currentFile) {
        html += '<div class="tree-step-current-file">' + esc(currentFile) + '</div>';
      }

      // Error detail
      if (step.error) {
        var detailClass = step.status === 'completed' ? ' warning' : '';
        html += '<div class="tree-step-error' + detailClass + '">' + esc(step.error) + '</div>';
      }

      var stageResult = job.result && job.result.stages
        ? job.result.stages[step.id] : null;
      var repairPhotos = stageResult && stageResult.failed_photos;
      if (repairPhotos && repairPhotos.length > 0) {
        html += '<div class="tree-repair-list">';
        repairPhotos.forEach(function(photo) {
          var label = photo.filename || ('Photo ' + photo.id);
          html += '<div class="tree-repair-item"><b>' + esc(label) + '</b>' +
            (photo.reason ? ': ' + esc(photo.reason) : '') + '</div>';
        });
        if (stageResult.failed_photos_truncated) {
          html += '<div class="tree-repair-item">And ' +
            stageResult.failed_photos_truncated.toLocaleString() +
            ' more. Missing thumbnails remain available for later repair.</div>';
        }
        html += '</div>';
      }

      // Leaf buffer (files processed). Hide stale filenames while an in-place
      // import is in a non-file sub-phase; the current status line above then
      // stands alone instead of looking like it applies to the previous
      // source's leaves.
      if (isRunning && !importInPlacePhaseActive) {
        var leaves = leafBuffers[step.id] || [];
        if (step.current_file) {
          var found = leaves.find(function(l) { return l.name === step.current_file; });
          if (!found) {
            leaves.push({ name: step.current_file, status: 'current' });
            if (leaves.length > LEAF_MAX) {
              var nonFailed = leaves.filter(function(l) { return l.status !== 'failed'; });
              if (nonFailed.length > LEAF_MAX) leaves.splice(leaves.indexOf(nonFailed[0]), 1);
            }
            leafBuffers[step.id] = leaves;
          }
        }
        if (leaves.length > 0) {
          html += '<div class="tree-leaves">';
          leaves.forEach(function(l) {
            var cls = l.status === 'current' ? ' current' : l.status === 'failed' ? ' failed' : '';
            html += '<div class="tree-leaf' + cls + '">' + esc(l.name) + '</div>';
          });
          html += '</div>';
        }
      }
    }

    html += '</div>'; // end tree-step
    return html;
  }

  function fetchJobs() {
    fetch('/api/jobs')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        activeJobs = data.active || [];
        activeWsId = data.active_workspace_id || null;
        workspaceNames = data.workspace_names || {};
        var awakeNote = document.getElementById('keepingAwakeNote');
        if (awakeNote) {
          awakeNote.style.display = data.keeping_awake ? '' : 'none';
        }
        // Drop optimistic-cancel state for jobs that have left the active
        // list (server has finalized them; their next render comes from
        // historyJobs which never shows a cancel button).
        var stillActive = {};
        activeJobs.forEach(function(j) { stillActive[j.id] = true; });
        Object.keys(cancellingJobIds).forEach(function(id) {
          if (!stillActive[id]) delete cancellingJobIds[id];
        });
        updateList();
        updateRunningBadge();
        if (selectedSource === 'active' && selectedJobId) {
          var selected = activeJobs.find(function(j) { return j.id === selectedJobId; });
          if (selected) {
            renderDetail(selected);
          } else {
            var historical = historyJobs.find(function(j) { return j.id === selectedJobId; });
            if (historical) {
              selectedSource = 'history';
              renderHistoryDetail(historical);
            } else {
              fetchHistory(true);
            }
          }
        } else if (currentView === 'active') {
          renderActiveOverview();
        }
      })
      .catch(function() {});
  }

  function fetchHistory(refreshMissingSelection) {
    fetch('/api/jobs/history?limit=100')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        historyJobs = data || [];
        historyJobs.forEach(function(j) {
          if (typeof j.tree === 'string') {
            try { j.tree = JSON.parse(j.tree); } catch(e) { j.tree = []; }
          }
          if (typeof j.result === 'string') {
            try { j.result = JSON.parse(j.result); } catch(e) { j.result = null; }
          }
        });
        updateList();
        populateTypeFilter();
        if (refreshMissingSelection && selectedSource === 'active' && selectedJobId) {
          var historical = historyJobs.find(function(j) { return j.id === selectedJobId; });
          if (historical) {
            selectedSource = 'history';
            renderHistoryDetail(historical);
          } else {
            currentView = 'active';
            selectedJobId = null;
            selectedSource = null;
            renderActiveOverview();
            updateList();
          }
          return;
        }
        if (currentView === 'history') renderHistoryOverview();
      })
      .catch(function() {});
  }

  function populateTypeFilter() {
    var sel = document.getElementById('filterType');
    var types = {};
    historyJobs.forEach(function(j) { types[j.type] = true; });
    activeJobs.forEach(function(j) { types[j.type] = true; });
    var current = sel.value;
    sel.innerHTML = '<option value="">All types</option>';
    Object.keys(types).sort().forEach(function(t) {
      sel.innerHTML += '<option value="' + esc(t) + '">' + esc(window.formatJobType(t)) + '</option>';
    });
    sel.value = current;
  }
  window.applyFilters = function() {
    updateList();
    if (currentView === 'history') renderHistoryOverview();
  };

  function updateList() {
    var container = document.getElementById('jobListContent');
    var typeFilter = document.getElementById('filterType').value;
    var statusFilter = document.getElementById('filterStatus').value;
    var html = '';

    // Active = running OR queued. Queued pipelines waiting behind a busy
    // slot are findable + cancellable here; without this, opening /jobs
    // after queuing from another tab would show the queued run nowhere.
    var running = activeJobs.filter(function(j) {
      return isLiveStatus(j.status);
    });
    html += '<div class="jobs-list-divider clickable' + (currentView === 'active' ? ' selected' : '') + '" data-view="active">Active' +
      (running.length > 0 ? ' (' + running.length + ')' : '') + '</div>';
    running.forEach(function(j) { html += renderListItem(j, 'active'); });

    var filtered = historyJobs;
    if (typeFilter) filtered = filtered.filter(function(j) { return j.type === typeFilter; });
    if (statusFilter) filtered = filtered.filter(function(j) { return j.status === statusFilter; });

    html += '<div class="jobs-list-divider clickable' + (currentView === 'history' ? ' selected' : '') + '" data-view="history">History</div>';
    if (filtered.length === 0 && running.length === 0) {
      html += '<div style="padding:24px;text-align:center;color:var(--text-ghost);font-size:13px;">No jobs yet</div>';
    }
    filtered.forEach(function(j) { html += renderListItem(j, 'history'); });
    container.innerHTML = html;
  }

  function renderListItem(j, source) {
    var selected = j.id === selectedJobId ? ' selected' : '';
    var dot = j.status || 'completed';
    var time = '';
    if (isLiveStatus(j.status) && j.started_at) {
      time = formatElapsed((Date.now() - new Date(j.started_at).getTime()) / 1000);
    } else if (j.started_at) {
      time = timeAgo(j.started_at);
    }
    var detail = '';
    var visibleProgress = activeProgress(j.progress);
    var collectionText = jobCollectionText(j);
    if (isLiveStatus(j.status) && j.progress && j.progress.phase) {
      detail = esc(j.progress.phase);
      if (visibleProgress && visibleProgress.phase) {
        detail += ' ' + visibleProgress.current.toLocaleString() + '/' + visibleProgress.total.toLocaleString();
      }
    } else if (j.summary) {
      detail = esc(j.summary);
    } else if (j.status === 'failed' && j.errors && j.errors.length > 0) {
      detail = '<span style="color:var(--danger);">' + esc(j.errors[0]).substring(0, 60) + '</span>';
    } else if (j.duration) {
      detail = formatElapsed(j.duration);
    }
    if (collectionText) {
      detail = detail ? detail + ' &middot; ' + esc(collectionText) : esc(collectionText);
    }
    var pct = 0;
    if (visibleProgress) {
      pct = progressPct(visibleProgress);
    }
    var html = '<div class="job-list-item' + selected + '" data-job-id="' + esc(j.id) + '" data-job-source="' + source + '">';
    html += '<div class="job-list-item-header">';
    html += '<span class="job-list-item-dot ' + dot + '"></span>';
    html += '<span class="job-list-item-type">' + esc(window.formatJobType(j.type)) + '</span>';
    html += '<span class="job-list-item-time">' + time + '</span>';
    html += '</div>';
    if (detail) html += '<div class="job-list-item-detail">' + detail + '</div>';
    if (isLiveStatus(j.status) && pct > 0) {
      html += '<div class="job-list-item-progress"><div class="job-list-item-progress-fill" style="width:' + pct + '%"></div></div>';
    }
    html += '</div>';
    return html;
  }

  function updateRunningBadge() {
    var running = activeJobs.filter(function(j) {
      return isLiveStatus(j.status);
    });
    var badge = document.getElementById('runningBadge');
    if (running.length > 0) { badge.textContent = running.length; badge.style.display = ''; }
    else { badge.style.display = 'none'; }
  }

  // Event delegation for job list clicks
  document.getElementById('jobListContent').addEventListener('click', function(e) {
    var viewItem = e.target.closest('[data-view]');
    if (viewItem) {
      currentView = viewItem.getAttribute('data-view');
      selectedJobId = null;
      selectedSource = null;
      if (sseSource) { sseSource.close(); sseSource = null; }
      renderMainPane();
      updateList();
      return;
    }
    var item = e.target.closest('[data-job-id]');
    if (item) selectJob(item.getAttribute('data-job-id'), item.getAttribute('data-job-source'));
  });

  function selectJob(jobId, source) {
    currentView = jobId;
    selectedJobId = jobId;
    selectedSource = source;
    leafBuffers = {};
    leafBufferSources = {};
    collapsedSteps = {};
    if (sseSource) { sseSource.close(); sseSource = null; }
    if (source === 'active') {
      var job = activeJobs.find(function(j) { return j.id === jobId; });
      if (job) { renderDetail(job); if (isLiveStatus(job.status)) connectSSE(jobId); }
    } else {
      var job = historyJobs.find(function(j) { return j.id === jobId; });
      if (job) renderHistoryDetail(job);
    }
    updateList();
  }

  function connectSSE(jobId) {
    if (sseSource) sseSource.close();
    sseSource = new EventSource('/api/jobs/' + jobId + '/stream');
    sseSource.addEventListener('progress', function(e) {
      var data = JSON.parse(e.data);
      var job = activeJobs.find(function(j) { return j.id === jobId; });
      if (job) {
        job.progress = data;
        if (data.steps) job.steps = data.steps;
        if (selectedJobId === jobId) renderDetail(job);
        updateList();
      }
    });
    sseSource.addEventListener('status', function(e) {
      var data = JSON.parse(e.data);
      var job = activeJobs.find(function(j) { return j.id === jobId; });
      if (job && data.status) {
        job.status = data.status;
        if (selectedJobId === jobId) renderDetail(job);
        updateList();
        updateRunningBadge();
      }
    });
    sseSource.addEventListener('complete', function(e) {
      var data = {};
      try { data = JSON.parse(e.data); } catch(ex) {}
      var job = activeJobs.find(function(j) { return j.id === jobId; });
      if (job) {
        job.status = data.status || job.status;
        if (data.result !== undefined) job.result = data.result;
        if (data.duration !== undefined) job.duration = data.duration;
        if (data.errors !== undefined) job.errors = data.errors;
        if (selectedJobId === jobId) renderDetail(job);
      }
      if (sseSource) { sseSource.close(); sseSource = null; }
      fetchJobs();
      fetchHistory();
    });
    sseSource.onerror = function() {
      if (sseSource) { sseSource.close(); sseSource = null; }
    };
  }

  function renderDetail(job) {
    var pane = document.getElementById('jobDetailPane');
    pane.innerHTML = '<div style="padding:16px 24px 0;">' + renderJobCard(job) + '</div>';
    var activeStep = pane.querySelector('.tree-status-icon.running');
    if (activeStep) activeStep.closest('.tree-step').scrollIntoView({ block: 'nearest' });
  }

  function toggleStep(stepId) {
    if (collapsedSteps[stepId] === undefined) collapsedSteps[stepId] = true;
    else collapsedSteps[stepId] = !collapsedSteps[stepId];
    var job = activeJobs.find(function(j) { return j.id === selectedJobId; });
    if (job) renderDetail(job);
    else {
      job = historyJobs.find(function(j) { return j.id === selectedJobId; });
      if (job) renderHistoryDetail(job);
    }
  }

  // Event delegation for detail pane clicks (step toggle, pause/resume, cancel)
  document.getElementById('jobDetailPane').addEventListener('click', function(e) {
    var retryImportBtn = e.target.closest('[data-retry-import-job]');
    if (retryImportBtn) {
      var retryJobId = retryImportBtn.getAttribute('data-retry-import-job');
      var retryJob = activeJobs.concat(historyJobs).find(function(job) {
        return job.id === retryJobId;
      });
      var retryBody = importRetryBody(retryJob);
      if (!retryBody) {
        if (typeof showToast === 'function') {
          showToast('The original import settings are no longer available.', 'error');
        }
        return;
      }
      // Backstop the render-time gate: a click landing between poll
      // ticks could otherwise fire a second retry for the same parent
      // while the first is still active. Same rationale as the disabled
      // button above; keeps the parallel-launch race closed even when
      // ``activeJobs`` refreshed just after render.
      if (hasActiveRetryFor(retryJobId)) {
        if (typeof showToast === 'function') {
          showToast(
            'A retry for this import is already running; wait for it to finish.',
            'info',
          );
        }
        return;
      }
      // Preserve the original count-specific label so the error path
      // below can restore it exactly — dropping to a generic "Retry
      // failed files" would silently hide the real failed-file count.
      var retryOriginalLabel = retryImportBtn.textContent;
      retryImportBtn.disabled = true;
      retryImportBtn.textContent = 'Starting retry…';
      fetch('/api/jobs/import-photos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(retryBody),
      }).then(function(response) {
        return response.json().catch(function() { return {}; }).then(function(data) {
          if (!response.ok) {
            throw new Error(data.error || 'Retry failed to start');
          }
          return data;
        });
      }).then(function(data) {
        if (typeof showToast === 'function') {
          showToast('Import retry started. Successful files will be skipped.', 'info');
        }
        selectedJobId = data.job_id;
        selectedSource = 'active';
        currentView = data.job_id;
        fetchJobs();
      }).catch(function(error) {
        retryImportBtn.disabled = false;
        retryImportBtn.textContent = retryOriginalLabel;
        if (typeof showToast === 'function') showToast(error.message, 'error');
      });
      return;
    }
    var stepHeader = e.target.closest('[data-toggle-step]');
    if (stepHeader) {
      toggleStep(stepHeader.getAttribute('data-toggle-step'));
      return;
    }
    var pauseBtn = e.target.closest('[data-pause-job]');
    var resumeBtn = e.target.closest('[data-resume-job]');
    if (pauseBtn || resumeBtn) {
      var controlBtn = pauseBtn || resumeBtn;
      var action = pauseBtn ? 'pause' : 'resume';
      var cancellingPause = !!(resumeBtn && resumeBtn.hasAttribute('data-cancel-pause'));
      var jobId = controlBtn.getAttribute(
        pauseBtn ? 'data-pause-job' : 'data-resume-job'
      );
      controlBtn.disabled = true;
      controlBtn.textContent = pauseBtn ? 'Pausing…' :
        (cancellingPause ? 'Cancelling pause…' : 'Resuming…');
      fetch('/api/jobs/' + encodeURIComponent(jobId) + '/' + action, {
        method: 'POST'
      }).then(function(r) {
        if (!r.ok) {
          return r.json().then(function(data) {
            throw new Error((data && data.error) || 'Unable to ' + action + ' job');
          });
        }
        return r.json();
      }).then(function(data) {
        var job = activeJobs.find(function(j) { return j.id === jobId; });
        if (job && data.status) job.status = data.status;
        if (typeof showToast === 'function') {
          showToast(
            action === 'pause' ? 'Pausing after the current batch…' :
              (cancellingPause ? 'Pause cancelled; the job keeps running' : 'Job resumed'),
            'info'
          );
        }
        fetchJobs();
      }).catch(function(err) {
        if (typeof showToast === 'function') showToast(err.message, 'error');
        fetchJobs();
      });
      return;
    }
    var cancelBtn = e.target.closest('[data-cancel-job]');
    if (cancelBtn) {
      var jobId = cancelBtn.getAttribute('data-cancel-job');
      // Optimistic UI: flip the button to a disabled "Cancelling…" pill
      // immediately so the click feels live. The server cancel just sets
      // a flag; the running stage may take seconds to actually exit. Track
      // jobId in cancellingJobIds so subsequent fetchJobs re-renders keep
      // the state until the job moves out of active.
      cancelBtn.disabled = true;
      cancelBtn.textContent = 'Cancelling…';
      cancelBtn.classList.add('cancelling');
      cancellingJobIds[jobId] = true;
      fetch('/api/jobs/' + encodeURIComponent(jobId) + '/cancel', { method: 'POST' })
        .then(function(r) {
          if (r.ok) {
            if (typeof showToast === 'function') showToast('Cancelling job…', 'info');
            fetchJobs();
          } else {
            return r.json().then(function(data) {
              var msg = (data && data.error) || 'Unable to cancel job';
              if (typeof showToast === 'function') showToast(msg, 'error');
              delete cancellingJobIds[jobId];
              cancelBtn.disabled = false;
              cancelBtn.textContent = 'Cancel';
              cancelBtn.classList.remove('cancelling');
            });
          }
        })
        .catch(function() {
          if (typeof showToast === 'function') showToast('Unable to cancel job', 'error');
          delete cancellingJobIds[jobId];
          cancelBtn.disabled = false;
          cancelBtn.textContent = 'Cancel';
          cancelBtn.classList.remove('cancelling');
        });
    }
  });

  function renderHistoryDetail(job) {
    var pane = document.getElementById('jobDetailPane');
    pane.innerHTML = '<div style="padding:16px 24px 0;">' + renderJobCard(job) + '</div>';
  }

  function renderMainPane() {
    if (currentView === 'active') {
      renderActiveOverview();
    } else if (currentView === 'history') {
      renderHistoryOverview();
    }
    // Individual job selection handled by existing selectJob flow
  }

  function renderActiveOverview() {
    var pane = document.getElementById('jobDetailPane');
    var running = activeJobs.filter(function(j) {
      return isLiveStatus(j.status);
    });

    if (running.length === 0) {
      pane.innerHTML = '<div class="jobs-overview-empty">No active jobs.<br><span style="font-size:12px;margin-top:8px;display:inline-block;">Import new photos from Import, process workspace photos from Process, or run individual jobs from Browse.</span></div>';
      return;
    }

    // A null workspace_id means the job is workspace-agnostic (the startup
    // working-copy / thumb_path backfills operate on photos, which are
    // global). Those belong with the current workspace's jobs — they are
    // running for this workspace as much as any other — not under "Other
    // Workspaces", and their badge has to say so rather than naming a
    // workspace they don't have.
    var thisWs = running.filter(function(j) {
      return j.workspace_id == null || j.workspace_id === activeWsId;
    });
    var otherWs = running.filter(function(j) {
      return j.workspace_id != null && j.workspace_id !== activeWsId;
    });

    var html = '<div style="padding:16px 24px 0;">';

    thisWs.forEach(function(j) {
      html += renderJobCard(j, j.workspace_id == null ? { workspaceName: 'All workspaces' } : {});
    });

    if (otherWs.length > 0) {
      html += '<div class="jobs-overview-divider">Other Workspaces</div>';
      otherWs.forEach(function(j) {
        var wsName = workspaceNames[j.workspace_id] || ('Workspace ' + j.workspace_id);
        html += renderJobCard(j, { workspaceName: wsName });
      });
    }

    html += '</div>';
    pane.innerHTML = html;
  }

  function renderHistoryOverview() {
    var pane = document.getElementById('jobDetailPane');
    var typeFilter = document.getElementById('filterType').value;
    var statusFilter = document.getElementById('filterStatus').value;

    var filtered = historyJobs;
    if (typeFilter) filtered = filtered.filter(function(j) { return j.type === typeFilter; });
    if (statusFilter) filtered = filtered.filter(function(j) { return j.status === statusFilter; });

    if (filtered.length === 0) {
      pane.innerHTML = '<div class="jobs-overview-empty">No job history' +
        (typeFilter || statusFilter ? ' matching filters' : '') + '.</div>';
      return;
    }

    // Date range note
    var oldest = filtered[filtered.length - 1];
    var oldestDate = new Date(oldest.started_at).toLocaleDateString();
    var html = '<div style="padding:16px 24px 0;">';
    html += '<div style="font-size:12px;color:var(--text-ghost);margin-bottom:12px;">Showing ' +
      filtered.length + ' jobs back to ' + oldestDate + '</div>';

    filtered.forEach(function(j) {
      html += renderJobCard(j);
    });

    html += '</div>';
    pane.innerHTML = html;
  }

  // Initial load
  fetchJobs();
  fetchHistory();
  pollTimer = setInterval(fetchJobs, 2000);
  setInterval(fetchHistory, 10000);
})();
</script>
</body>
</html>
