<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vireo-base.css">
<title>Vireo - Rapid Review</title>
<style>
.rapid-layout {
  height: calc(100vh - 48px - var(--bottom-offset, 28px));
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  overflow: hidden;
}
.rapid-sidebar {
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-primary);
  overflow-y: auto;
  padding: 16px 12px;
}
.rapid-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.rapid-title h1 {
  margin: 0;
  color: var(--text-primary);
  font-size: 17px;
  line-height: 1.2;
}
.rapid-title a,
.rapid-link {
  color: var(--accent);
  font-size: 12px;
  text-decoration: none;
}
.rapid-inline-btn {
  background: transparent;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font: inherit;
  padding: 0;
}
.rapid-filter-bar {
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  background: var(--bg-primary);
  padding: 10px;
  margin-bottom: 12px;
}
.rapid-filter-bar label {
  color: var(--text-dim);
  display: block;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.queue-select {
  width: 100%;
  box-sizing: border-box;
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-secondary);
  border-radius: 6px;
  font-size: 13px;
  padding: 7px 8px;
}
.queue-toggles {
  display: grid;
  gap: 7px;
  margin-top: 10px;
}
.queue-toggle {
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
}
.queue-toggle input {
  margin: 0;
}
.queue-count {
  color: var(--text-dim);
  font-size: 12px;
  margin-top: 10px;
}
.burst-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.burst-row {
  width: 100%;
  border: 1px solid var(--border-primary);
  background: transparent;
  color: var(--text-secondary);
  border-radius: 6px;
  cursor: pointer;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px;
  padding: 9px 10px;
  text-align: left;
}
.burst-row:hover { border-color: var(--text-muted); }
.burst-row.active {
  border-color: var(--accent);
  background: var(--accent-dim);
  color: var(--text-primary);
}
.burst-row-main {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}
.burst-row-sub {
  grid-column: 1 / -1;
  color: var(--text-dim);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.burst-row-chips {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-width: 0;
}
.reason-chip {
  border: 1px solid var(--border-secondary);
  border-radius: 999px;
  color: var(--text-dim);
  font-size: 10px;
  line-height: 1;
  padding: 4px 6px;
}
.burst-row-count {
  color: var(--text-dim);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.rapid-main {
  min-width: 0;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--bg-primary);
}
.rapid-topbar {
  min-height: 58px;
  border-bottom: 1px solid var(--border-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
  padding: 12px 18px;
}
.burst-heading {
  min-width: 0;
}
.burst-heading h2 {
  margin: 0 0 4px;
  color: var(--text-primary);
  font-size: 16px;
}
.burst-heading div {
  color: var(--text-dim);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.top-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  flex-shrink: 0;
}
.rapid-btn {
  border: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  padding: 8px 12px;
}
.rapid-btn:hover { border-color: var(--text-muted); color: var(--text-primary); }
.rapid-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 650;
}
.rapid-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.review-surface {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 16px;
  padding: 16px 18px;
  overflow: hidden;
}
.photo-stage {
  min-width: 0;
  min-height: 0;
  background: #050607;
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.photo-stage.zoomed {
  align-items: flex-start;
  justify-content: flex-start;
  overflow: auto;
  cursor: grab;
}
.photo-stage.zoomed.dragging {
  cursor: grabbing;
}
.photo-stage img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  cursor: zoom-in;
  user-select: none;
  -webkit-user-drag: none;
}
.photo-stage.zoomed img {
  flex: 0 0 auto;
  max-width: none;
  max-height: none;
  object-fit: none;
  cursor: grab;
}
.stage-empty {
  color: var(--text-muted);
  font-size: 14px;
}
.status-pill {
  position: absolute;
  left: 12px;
  top: 12px;
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.03em;
  background: rgba(10, 12, 14, 0.78);
  color: var(--text-secondary);
  border: 1px solid rgba(255,255,255,0.16);
}
.status-pill.pick { color: var(--accent); }
.status-pill.reject { color: var(--danger); }
.status-pill.review { color: var(--warning); }
.side-panel {
  min-width: 0;
  overflow-y: auto;
  border-left: 1px solid var(--border-primary);
  padding-left: 16px;
}
.filename {
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 650;
  word-break: break-word;
  margin-bottom: 10px;
}
.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.metric {
  border: 1px solid var(--border-primary);
  border-radius: 6px;
  padding: 8px;
  background: var(--bg-secondary);
}
.metric-label {
  color: var(--text-dim);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.metric-value {
  color: var(--text-primary);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.species-field {
  margin: 12px 0 16px;
}
.species-field label {
  color: var(--text-dim);
  display: block;
  font-size: 11px;
  margin-bottom: 6px;
}
.species-field input {
  width: 100%;
  box-sizing: border-box;
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-secondary);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 13px;
}
.decision-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.decision-btn {
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 11px 12px;
  font-size: 14px;
  font-weight: 700;
}
.decision-btn.pick { background: var(--accent); color: var(--accent-text); }
.decision-btn.review { background: var(--warning); color: #111; }
.decision-btn.reject { background: var(--danger); color: #fff; }
.decision-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.progress-block {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.progress-stat {
  border-radius: 6px;
  background: var(--bg-tertiary);
  padding: 8px;
  text-align: center;
}
.progress-stat strong {
  color: var(--text-primary);
  display: block;
  font-size: 18px;
  line-height: 1;
}
.progress-stat span {
  color: var(--text-dim);
  display: block;
  font-size: 10px;
  margin-top: 5px;
  text-transform: uppercase;
}
.bottom-area {
  min-height: 172px;
  border-top: 1px solid var(--border-primary);
  display: grid;
  grid-template-rows: 86px 1fr;
  overflow: hidden;
}
.filmstrip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border-primary);
}
.thumb {
  width: 72px;
  height: 54px;
  flex: 0 0 auto;
  border: 2px solid transparent;
  border-radius: 6px;
  background: var(--bg-secondary);
  padding: 0;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.thumb.current { border-color: var(--accent); }
.thumb.reviewed::after {
  content: "";
  position: absolute;
  inset: 4px auto auto 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-secondary);
}
.thumb.pick::before,
.thumb.reject::before,
.thumb.review::before {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 4px;
}
.thumb.pick::before { background: var(--accent); }
.thumb.reject::before { background: var(--danger); }
.thumb.review::before { background: var(--warning); }
.thumb.rejected-muted img,
.mini-thumb.rejected-muted img {
  opacity: 0.42;
  filter: grayscale(0.55);
}
.lanes {
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  padding: 10px 18px 12px;
  overflow: hidden;
}
.lane {
  min-width: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 8px;
}
.lane-title {
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.lane-strip {
  min-width: 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
}
.mini-thumb {
  width: 46px;
  height: 34px;
  flex: 0 0 auto;
  border-radius: 4px;
  border: 1px solid var(--border-primary);
  overflow: hidden;
  background: var(--bg-secondary);
  padding: 0;
  cursor: pointer;
}
.mini-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.empty-state {
  padding: 40px;
  color: var(--text-muted);
  font-size: 14px;
}
.queue-prompt {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,0.48);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.queue-prompt[hidden] {
  display: none;
}
.queue-prompt-card {
  width: min(420px, 100%);
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  background: var(--bg-secondary);
  box-shadow: 0 18px 48px rgba(0,0,0,0.42);
  padding: 18px;
}
.queue-prompt-title {
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 750;
  margin-bottom: 8px;
}
.queue-prompt-text {
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.4;
  margin-bottom: 16px;
}
.queue-prompt-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}
@media (max-width: 920px) {
  .rapid-layout { grid-template-columns: 1fr; }
  .rapid-sidebar { display: none; }
  .review-surface { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .side-panel { border-left: none; border-top: 1px solid var(--border-primary); padding: 12px 0 0; }
}
</style>
</head>
<body>
{% include '_navbar.html' %}

<div class="rapid-layout">
  <aside class="rapid-sidebar">
    <div class="rapid-title">
      <h1>Rapid Review</h1>
      <a href="/pipeline/review">Classic</a>
    </div>
    <div class="rapid-filter-bar">
      <label for="queueFilter">Queue</label>
      <select id="queueFilter" class="queue-select" onchange="changeQueue({ filter: this.value })">
        <option value="needs-species">Needs species</option>
        <option value="needs-culling">Needs culling</option>
        <option value="unreviewed">Unreviewed</option>
        <option value="review-picks">Review picks</option>
        <option value="all">All</option>
      </select>
      <div class="queue-toggles">
        <label class="queue-toggle">
          <input id="includeRejectedToggle" type="checkbox" onchange="changeQueue({ includeRejected: this.checked })">
          Include rejected
        </label>
        <label class="queue-toggle">
          <input id="multiOnlyToggle" type="checkbox" onchange="changeQueue({ multiOnly: this.checked })">
          Multi-photo only
        </label>
      </div>
      <div class="queue-count" id="queueCount">0 bursts</div>
    </div>
    <div class="burst-list" id="burstList"></div>
  </aside>

  <main class="rapid-main">
    <div class="rapid-topbar">
      <div class="burst-heading">
        <h2 id="burstTitle">Loading...</h2>
        <div id="burstSubtitle"></div>
      </div>
      <div class="top-actions">
        <button class="rapid-btn" id="undoBtn" onclick="undoLast()" title="Undo last decision">Undo</button>
        <button class="rapid-btn" onclick="openClassic()" title="Open this burst in classic pipeline review">Classic</button>
        <button class="rapid-btn primary" id="applyBtn" onclick="applyCurrent(false)" title="Apply pick/reject flag changes and species keywords">Apply flags/species</button>
        <button class="rapid-btn primary" id="applyNextBtn" onclick="applyCurrent(true)" title="Apply pick/reject flag changes and species keywords, then open the next burst">Apply flags/species & Next</button>
      </div>
    </div>

    <section class="review-surface" id="reviewSurface">
      <div class="photo-stage" id="photoStage" onclick="toggleRapidZoom(event)">
        <img id="currentPhoto" alt="" draggable="false" onload="rapidImageLoaded()">
        <div class="status-pill review" id="statusPill">Review</div>
        <div class="stage-empty" id="stageEmpty" style="display:none;">No active photo</div>
      </div>
      <aside class="side-panel">
        <div class="filename" id="filename">-</div>
        <div class="metric-grid">
          <div class="metric">
            <div class="metric-label">Quality</div>
            <div class="metric-value" id="metricQuality">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Sharpness</div>
            <div class="metric-value" id="metricSharpness">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">AI Label</div>
            <div class="metric-value" id="metricLabel">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Reviewed</div>
            <div class="metric-value" id="metricReviewed">0/0</div>
          </div>
        </div>
        <div class="species-field">
          <label for="speciesInput">Species keywords (comma-separated for two subjects)</label>
          <input id="speciesInput" type="text" placeholder="Green-winged Teal, American Wigeon" oninput="rapidOnSpeciesInput()">
        </div>
        <div class="decision-grid">
          <button class="decision-btn pick" onclick="decideCurrent('pick')" title="Pick and advance">Pick</button>
          <button class="decision-btn review" onclick="decideCurrent('review')" title="Leave for review and advance">Review</button>
          <button class="decision-btn reject" onclick="decideCurrent('reject')" title="Reject and advance">Reject</button>
        </div>
        <div class="progress-block">
          <div class="progress-stat"><strong id="pickCount">0</strong><span>Picks</span></div>
          <div class="progress-stat"><strong id="reviewCount">0</strong><span>Review</span></div>
          <div class="progress-stat"><strong id="rejectCount">0</strong><span>Rejects</span></div>
        </div>
      </aside>
    </section>

    <section class="bottom-area">
      <div class="filmstrip" id="filmstrip"></div>
      <div class="lanes">
        <div class="lane">
          <div class="lane-title">Picks</div>
          <div class="lane-strip" id="pickLane"></div>
        </div>
        <div class="lane">
          <div class="lane-title">Review</div>
          <div class="lane-strip" id="reviewLane"></div>
        </div>
        <div class="lane">
          <div class="lane-title">Rejects</div>
          <div class="lane-strip" id="rejectLane"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="queue-prompt" id="queuePrompt" hidden>
  <div class="queue-prompt-card" role="dialog" aria-modal="true" aria-labelledby="queuePromptTitle">
    <div class="queue-prompt-title" id="queuePromptTitle">Staged decisions</div>
    <div class="queue-prompt-text">Apply or discard the current staged decisions before changing the queue.</div>
    <div class="queue-prompt-actions">
      <button class="rapid-btn" type="button" data-queue-choice="stay">Stay</button>
      <button class="rapid-btn" type="button" data-queue-choice="discard">Discard</button>
      <button class="rapid-btn primary" type="button" data-queue-choice="apply">Apply flags/species</button>
    </div>
  </div>
</div>

<script defer src="/static/pipeline-rapid-review/state.js"></script>
<script defer src="/static/pipeline-rapid-review/shortcuts.js"></script>
<script defer src="/static/pipeline-rapid-review/photo-urls.js"></script>
<script defer src="/static/pipeline-rapid-review/species-list.js"></script>
<script defer src="/static/pipeline-rapid-review/sessions.js"></script>
<script defer src="/static/pipeline-rapid-review/queue-filters.js"></script>
<script defer src="/static/pipeline-rapid-review/queue.js"></script>
<script defer src="/static/pipeline-rapid-review/loading.js"></script>
<script defer src="/static/pipeline-rapid-review/render.js"></script>
<script defer src="/static/pipeline-rapid-review/zoom.js"></script>
<script defer src="/static/pipeline-rapid-review/decisions.js"></script>
<script defer src="/static/pipeline-rapid-review/species-keywords.js"></script>
<script defer src="/static/pipeline-rapid-review/apply-diff.js"></script>
<script defer src="/static/pipeline-rapid-review/apply.js"></script>
<script defer src="/static/pipeline-rapid-review/boot.js"></script>
</body>
</html>
