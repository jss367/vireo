<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vireo-base.css">
<title>Vireo - Best Batch</title>
<style>
body {
  min-height: 100vh;
  background: var(--bg-primary);
}
.best-page {
  padding: 16px 18px 28px;
}
.best-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  margin-bottom: 14px;
}
.best-title h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
}
.best-subtitle {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 13px;
}
.best-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}
.best-btn {
  border: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
}
.best-btn:hover {
  border-color: var(--accent);
  color: var(--text-primary);
}
.best-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg-primary);
}
.best-btn.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: white;
}
.best-btn:disabled {
  opacity: 0.55;
  cursor: default;
}
.status {
  border: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 28px;
  color: var(--text-muted);
  text-align: center;
}
.focus-section {
  margin-bottom: 14px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  margin-bottom: 8px;
}
.section-title {
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.section-note {
  color: var(--text-muted);
  font-size: 12px;
}
.focus-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px;
}
.focus-grid.comparison {
  grid-template-columns: repeat(auto-fill, minmax(210px, 260px));
}
#requestedSpecies, #subjectChoices {
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  border-radius: 4px;
  color: var(--text-primary);
  font: inherit;
  padding: 6px 8px;
}
#subjectChoices { width: 100%; margin: 8px 0; }
#subjectEvidenceStatus { line-height: 1.5; }
.focus-card {
  border: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  border-radius: 7px;
  overflow: hidden;
  cursor: pointer;
}
.focus-card.best,
.focus-card.inspecting {
  border-color: var(--accent);
}
.focus-crop {
  position: relative;
  aspect-ratio: 1;
  background-color: #050505;
  overflow: hidden;
}
.focus-crop.native img {
  position: static;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.focus-crop img {
  display: block;
  position: absolute;
  max-width: none;
  max-height: none;
}
.focus-crop.eye img {
  width: 780%;
  height: auto;
}
.focus-crop.subject img {
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 24px;
  height: 24px;
  transform: translate(-50%, -50%);
  border: 1px solid color-mix(in srgb, var(--accent) 88%, white);
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.7);
  pointer-events: none;
}
.crosshair::before,
.crosshair::after {
  content: "";
  position: absolute;
  background: color-mix(in srgb, var(--accent) 88%, white);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
}
.crosshair::before {
  left: 50%;
  top: -10px;
  width: 1px;
  height: 44px;
}
.crosshair::after {
  top: 50%;
  left: -10px;
  width: 44px;
  height: 1px;
}
.focus-meta,
.rank-meta {
  padding: 8px 9px;
}
.role {
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.role.best { color: var(--accent); }
.role.alternate { color: var(--warning); }
.role.reject { color: var(--danger); }
.filename {
  margin-top: 4px;
  color: var(--text-secondary);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.score {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 12px;
}
.inspect-layout {
  display: grid;
  grid-template-columns: minmax(520px, 1.2fr) minmax(320px, 0.8fr);
  gap: 14px;
  align-items: start;
}
.preview-panel {
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  overflow: hidden;
  background: #050505;
}
.preview-panel img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  cursor: crosshair;
}
.preview-meta {
  border-top: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  padding: 10px 12px;
}
.preview-name {
  color: var(--text-primary);
  font-size: 16px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.preview-score {
  margin-top: 5px;
  color: var(--text-muted);
  font-size: 13px;
}
.reason-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}
.reason {
  border: 1px solid var(--border-primary);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 11px;
}
.rank-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 10px;
}
.rank-card {
  border: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  border-radius: 7px;
  overflow: hidden;
  cursor: pointer;
}
.rank-card.best,
.rank-card.inspecting {
  border-color: var(--accent);
}
.rank-card.reject {
  opacity: 0.72;
}
.rank-card img {
  display: block;
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: contain;
  background: #050505;
}
@media (max-width: 980px) {
  .best-toolbar,
  .inspect-layout {
    grid-template-columns: 1fr;
  }
  .best-actions {
    justify-content: flex-start;
  }
}
@media (max-width: 620px) {
  .best-page {
    padding: 12px;
  }
  .focus-grid,
  .rank-list {
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  }
}
</style>
</head>
<body>
{% include '_navbar.html' %}

<main class="best-page">
  <div class="best-toolbar">
    <div class="best-title">
      <h1>Best Batch</h1>
      <div id="bestSubtitle" class="best-subtitle">Loading selected photos...</div>
    </div>
    <div class="best-actions">
      <button class="best-btn" id="backToBrowseBtn" type="button">Back to Browse</button>
      <button class="best-btn" id="reviewBtn" type="button" disabled>Review Burst</button>
      <button class="best-btn primary" id="flagBtn" type="button" disabled>Flag Inspected Photo</button>
      <button class="best-btn danger" id="rejectBtn" type="button" disabled>Apply Validated Suggestions</button>
    </div>
  </div>

  <div class="best-actions" style="justify-content:flex-start; margin-bottom:14px;">
    <label>Species to compare <input id="requestedSpecies" type="text" placeholder="Optional species name" maxlength="300"></label>
    <button class="best-btn" id="compareSubjectsBtn" type="button">Compare subjects</button>
    <button class="best-btn" id="analyzeSubjectsBtn" type="button" disabled>Analyze selected subjects</button>
    <span id="comparisonStatus" class="section-note" role="status"></span>
  </div>
  <p id="comparisonNotice" class="section-note" role="status" hidden></p>
  <div id="bestStatus" class="status">Loading batch...</div>
  <div id="bestContent" style="display:none;">
    <section class="focus-section">
      <div class="section-head">
        <div class="section-title">Focus Check</div>
        <div id="focusNote" class="section-note"></div>
      </div>
      <div id="focusGrid" class="focus-grid"></div>
    </section>

    <section class="inspect-layout">
      <div class="preview-panel">
        <div style="position:relative;">
          <img id="inspectImg" alt="" title="Upright full frame for focus inspection">
          <span id="focusSubjectBox" hidden style="position:absolute;border:2px solid #ffd34e;pointer-events:none;" aria-label="Selected model subject"></span>
          <span id="focusCenter" hidden style="position:absolute;transform:translate(-50%,-50%);color:#ff4d4d;font-size:30px;pointer-events:none;" aria-label="Focus center">+</span>
        </div>
        <div class="preview-meta">
          <div id="inspectRole" class="role"></div>
          <div id="inspectName" class="preview-name"></div>
          <div id="inspectScore" class="preview-score"></div>
          <div id="inspectReasons" class="reason-row"></div>
        </div>
      </div>

      <div>
        <section aria-label="Focus inspection">
          <button class="best-btn" id="manualFocusBtn" type="button" aria-pressed="false">Place manual focus center</button>
          <button class="best-btn" id="resetFocusBtn" type="button">Inspect selected subject</button>
          <p id="focusSelectionStatus" class="section-note"></p>
          <img id="inspectedFocusImg" alt="Focus inspection crop" hidden style="max-width:100%;height:auto;">
          <p id="focusRasterStatus" class="section-note" role="status"></p>
        </section>
        <section id="subjectPanel" hidden>
          <label>Subject for this comparison <select id="subjectChoices"></select></label>
          <img id="chosenSubjectImg" alt="Selected subject detail" style="max-width:100%;max-height:400px;object-fit:contain;">
          <p id="subjectEvidenceStatus" class="section-note"></p>
        </section>
        <div class="section-head">
          <div class="section-title">Ranked Frames</div>
        </div>
        <div id="rankList" class="rank-list"></div>
      </div>
    </section>
  </div>
</main>

<script type="module" src="/static/best-batch/boot.js"></script>
</body>
</html>
