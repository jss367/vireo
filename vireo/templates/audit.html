<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vireo-base.css">
<title>Vireo - Audit</title>
<style>
.content { max-width: 1000px; }

.summary-banner {
  border: 1px solid var(--border-primary); border-radius: 8px;
  padding: 16px; margin-bottom: 24px; background: var(--bg-secondary);
}
.summary-head { display: flex; align-items: center; gap: 10px; }
.summary-light {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  background: var(--text-dim);
}
.summary-light.intact { background: var(--accent); }
.summary-light.stale { background: var(--warning); }
.summary-light.problems { background: var(--danger); }
.summary-light.unverified { background: var(--text-dim); }
.summary-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.summary-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.summary-chip {
  font-size: 12px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
  background: var(--bg-tertiary); color: var(--text-secondary);
  border: 1px solid var(--border-subtle); user-select: none;
}
.summary-chip:hover { border-color: var(--border-primary); }
.summary-chip .chip-count { font-weight: 600; }
.summary-chip.chip-clean .chip-count { color: var(--accent); }
.summary-chip.chip-problem .chip-count { color: var(--danger); }
.summary-chip.chip-never { color: var(--text-dim); }
.summary-chip .chip-time { color: var(--text-dim); margin-left: 4px; }
.summary-note { margin-top: 10px; font-size: 12px; color: var(--text-muted); }

.tabs { display: flex; gap: 0; margin-bottom: 24px; }
.tab {
  padding: 10px 20px; cursor: pointer; font-size: 13px; color: var(--text-muted);
  border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
  user-select: none;
}
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }
.tab .badge {
  margin-left: 6px; font-size: 11px; background: var(--bg-tertiary);
  padding: 2px 7px; border-radius: 10px; font-variant-numeric: tabular-nums;
}

.action-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }

.audit-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.audit-table th {
  text-align: left; padding: 8px 12px; color: var(--text-dim);
  font-weight: 500; border-bottom: 1px solid var(--border-primary);
}
.audit-table td {
  padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary);
}
.audit-table tr:hover { background: var(--bg-tertiary); }

.kw-added { color: var(--accent); }
.kw-removed { color: var(--danger); }
.hash-corrupt { color: var(--danger); font-weight: 600; }
.hash-modified { color: var(--warning); }
.hash-unreadable { color: var(--danger); }
.drift-unreadable { color: var(--danger); }
.drift-advice { margin-top: 4px; font-size: 12px; color: var(--text-dim); max-width: 360px; }

.integrity-stats {
  font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;
}

.status-msg { margin-left: 8px; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }
</style>
</head>
<body>

{% include '_navbar.html' %}

<div class="content">
  <h2 style="margin-bottom: 20px; font-size: 20px;">Audit</h2>

  <!-- Archive integrity summary -->
  <div class="summary-banner">
    <div class="summary-head">
      <span class="summary-light" id="summaryLight"></span>
      <span class="summary-title" id="summaryTitle">Loading&hellip;</span>
      <button class="btn btn-primary" id="btnRunAll" type="button" style="margin-left:auto;">Run All Checks</button>
    </div>
    <div class="summary-chips" id="summaryChips"></div>
    <div class="summary-note" id="summaryNote"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="drift">Drift <span class="badge" id="driftBadge">-</span></div>
    <div class="tab" data-tab="orphans">Orphans <span class="badge" id="orphanBadge">-</span></div>
    <div class="tab" data-tab="untracked">Untracked <span class="badge" id="untrackedBadge">-</span></div>
    <div class="tab" data-tab="sidecars">Sidecars <span class="badge" id="sidecarBadge">-</span></div>
    <div class="tab" data-tab="integrity">Integrity <span class="badge" id="integrityBadge">-</span></div>
  </div>

  <!-- Drift Tab -->
  <div class="tab-panel active" id="panel-drift">
    <div class="section">
      <div class="action-bar">
        <button class="btn btn-primary" id="btnDrift" type="button">Check for Drift</button>
        <button type="button" class="btn btn-secondary" id="btnSyncAllFromXmp">Sync All from XMP</button>
        <button type="button" class="btn btn-secondary" id="btnSyncAllToXmp">Sync All to XMP</button>
        <span class="status-msg" id="driftStatus"></span>
      </div>
      <div id="driftContent"><div class="empty-msg">Click "Check for Drift" to scan.</div></div>
    </div>
  </div>

  <!-- Orphans Tab -->
  <div class="tab-panel" id="panel-orphans">
    <div class="section">
      <div class="action-bar">
        <button class="btn btn-primary" id="btnOrphans" type="button">Check for Orphans</button>
        <button type="button" class="btn btn-danger" id="btnRemoveAllOrphans">Remove All Orphans</button>
        <span class="status-msg" id="orphanStatus"></span>
      </div>
      <div id="orphanContent"><div class="empty-msg">Click "Check for Orphans" to scan.</div></div>
    </div>
  </div>

  <!-- Untracked Tab -->
  <div class="tab-panel" id="panel-untracked">
    <div class="section">
      <div class="action-bar">
        <button class="btn btn-primary" id="btnUntracked" type="button">Check for Untracked</button>
        <button type="button" class="btn btn-secondary" id="btnImportAllUntracked">Import All</button>
        <button class="btn btn-secondary" id="sendToPipelineBtn" type="button" style="display:none;">Send to Process</button>
        <span class="status-msg" id="untrackedStatus"></span>
      </div>
      <div id="untrackedContent"><div class="empty-msg">Click "Check for Untracked" to scan.</div></div>
    </div>
  </div>

  <!-- Sidecars Tab -->
  <div class="tab-panel" id="panel-sidecars">
    <div class="section">
      <div class="action-bar">
        <button class="btn btn-primary" id="btnSidecars" type="button">Check for Stray Sidecars</button>
        <button type="button" class="btn btn-danger" id="btnDeleteAllSidecars">Move All Strays to Trash</button>
        <span class="status-msg" id="sidecarStatus"></span>
      </div>
      <div id="sidecarContent"><div class="empty-msg">Click "Check for Stray Sidecars" to find .xmp files whose photo is gone.</div></div>
    </div>
  </div>

  <!-- Integrity Tab -->
  <div class="tab-panel" id="panel-integrity">
    <div class="section">
      <div class="action-bar">
        <button class="btn btn-primary" id="btnVerify" type="button">Verify File Hashes</button>
        <span class="status-msg" id="integrityStatus"></span>
      </div>
      <div class="integrity-stats" id="integrityStats"></div>
      <div id="integrityContent"><div class="empty-msg">Loading&hellip;</div></div>
    </div>
  </div>
</div>

<script type="module" src="/static/audit/boot.js"></script>
</body>
</html>
