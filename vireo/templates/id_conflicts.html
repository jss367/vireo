<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/vireo-base.css">
<title>Vireo - ID Conflicts</title>
<style>
body { padding-bottom: 36px; }
.content { max-width: 1440px; }

.compare-toolbar {
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 14px;
  display: grid;
  grid-template-columns: minmax(180px, 1.1fr) repeat(2, minmax(150px, 0.85fr)) minmax(150px, 0.8fr) minmax(170px, 0.8fr) minmax(180px, 1fr);
  gap: 12px;
  align-items: end;
}
.control label {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0;
}
.control select,
.control input {
  width: 100%;
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-primary);
  border-radius: 4px;
  padding: 7px 9px;
  font-size: 13px;
}
.control .search-control input { width: auto; border-radius: 4px 0 0 4px; }
.control input[type="range"] {
  padding: 0;
  accent-color: var(--accent);
}
.range-control {
  display: flex;
  align-items: center;
  gap: 8px;
}
.range-control input { flex: 1 1 auto; }
.range-value {
  min-width: 38px;
  color: var(--text-secondary);
  font-size: 12px;
  text-align: right;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(8, minmax(110px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.summary-item {
  border: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 10px 12px;
  min-width: 0;
}
.summary-value {
  display: block;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}
.summary-label {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  color: var(--text-muted);
}

/* The filter chips, pager and batch actions follow the table down the page.
   A review queue is a long list, and controls that scroll away leave the
   user stranded mid-list with no way to change what they are looking at. */
.sticky-controls {
  position: sticky;
  top: 0;
  z-index: 3;
  padding-top: 8px;
  margin-bottom: 12px;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border-subtle);
}
.sticky-controls .filter-row,
.sticky-controls .batch-row,
.sticky-controls .pager-row { margin-bottom: 8px; }

.pager-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.pager-summary {
  color: var(--text-secondary);
  font-size: 12px;
  margin-right: 4px;
}
.pager-btn {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-primary);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}
.pager-btn:disabled { opacity: 0.45; cursor: default; }
.pager-size {
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
}
.pager-row select {
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-primary);
  border-radius: 4px;
  padding: 5px 7px;
  font-size: 12px;
}
.pager-note { color: var(--text-muted); font-size: 12px; }

/* The table stays readable while the next page is on its way, but visibly
   belongs to the previous query until the new rows land. */
#compareContent.loading { opacity: 0.55; }

.filter-row,
.sort-row,
.exclude-row,
.batch-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}
.filter-btn,
.sort-btn,
.exclude-btn,
.batch-btn,
.inline-btn {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-primary);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}
.filter-btn.active {
  color: var(--accent);
  border-color: var(--accent);
}
.sort-btn.active {
  color: var(--accent);
  border-color: var(--accent);
}
.exclude-btn.active {
  color: var(--warning);
  border-color: var(--warning);
}
.row-label {
  width: 100%;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
}
.batch-btn:disabled {
  opacity: 0.4;
  cursor: default;
}
.inline-btn {
  padding: 4px 7px;
  font-size: 11px;
  text-decoration: none;
}
.inline-btn.primary {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 60%, var(--border-primary));
}
.inline-btn.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 50%, var(--border-primary));
}
.inline-btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.batch-count {
  font-size: 12px;
  color: var(--text-muted);
  margin-right: 4px;
}

.taxonomy-note {
  display: none;
  margin-bottom: 12px;
  color: var(--warning);
  font-size: 12px;
}
.taxonomy-note.visible { display: block; }

.compare-empty {
  text-align: center;
  padding: 48px 16px;
  color: var(--text-muted);
}
.table-wrap {
  border: 1px solid var(--border-primary);
  border-radius: 8px;
  overflow: auto;
  background: var(--bg-primary);
}
.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.compare-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border-primary);
  white-space: nowrap;
}
.compare-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: top;
}
.compare-table tr:hover { background: var(--bg-secondary); }
.select-col { width: 30px; }
.photo-col { min-width: 220px; }
.keyword-col { min-width: 220px; }
.signal-col { min-width: 190px; }
.model-col { min-width: 250px; }

.photo-cell {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.photo-thumb-button {
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: var(--bg-tertiary);
  cursor: zoom-in;
  flex: 0 0 auto;
  overflow: hidden;
}
.photo-thumb-button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.photo-thumb-button img {
  width: 44px;
  height: 44px;
  object-fit: cover;
  display: block;
}
.photo-name {
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.photo-meta {
  color: var(--text-muted);
  font-size: 11px;
  margin-top: 3px;
}

.keyword-group {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 5px;
}
.keyword-pill,
.status-pill,
.signal-pill,
.category-pill {
  display: inline-flex;
  align-items: center;
  border-radius: 4px;
  border: 1px solid var(--border-primary);
  padding: 2px 6px;
  font-size: 11px;
  line-height: 1.4;
}
.keyword-pill.species {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border-primary));
}
.keyword-pill.general { color: var(--text-muted); }
.empty-cell { color: var(--text-ghost); }

.category-pill.match { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border-primary)); }
.category-pill.refinement { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border-primary)); }
.category-pill.broader { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, var(--border-primary)); }
.category-pill.conflict { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 55%, var(--border-primary)); }
.category-pill.additional { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 60%, var(--border-primary)); }
.category-pill.models_disagree { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 55%, var(--border-primary)); }
.category-pill.unclassified { color: var(--text-muted); }
.category-pill.low_conflict { color: var(--text-muted); }
.category-pill.new { color: var(--text-primary); }
.category-pill.missing_prediction { color: var(--text-muted); }
.signal-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.signal-pill {
  color: var(--text-muted);
}
.signal-pill.hot {
  color: var(--warning);
  border-color: color-mix(in srgb, var(--warning) 55%, var(--border-primary));
}
.signal-pill.match {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border-primary));
}
.signal-note {
  margin-top: 5px;
  color: var(--text-muted);
  font-size: 11px;
}

.pred {
  padding: 7px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.pred:last-child { border-bottom: none; }
.subject-prediction-group {
  padding: 5px 0 8px;
  border-bottom: 1px solid var(--border-primary);
}
.subject-prediction-group:last-child { border-bottom: none; }
.subject-heading {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 4px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 700;
}
.subject-summary-list { margin-top: 6px; }
.subject-summary {
  padding: 4px 0;
  color: var(--text-muted);
  font-size: 11px;
}
.subject-summary strong { color: var(--text-secondary); }
.pred.below-threshold { opacity: 0.72; }
.pred-main {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.pred-species { color: var(--text-primary); font-weight: 600; }
.pred-confidence { color: var(--text-muted); font-size: 11px; }
.pred-detail {
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 11px;
}
.pred-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 7px;
}
.status-pill {
  color: var(--text-muted);
  text-transform: capitalize;
}
.status-pill.accepted { color: var(--accent); }
.status-pill.rejected { color: var(--danger); }
.status-pill.reviewed { color: var(--accent); }

@media (max-width: 900px) {
  .compare-toolbar { grid-template-columns: 1fr; }
  .summary-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
}
</style>
</head>
<body>

{% include '_navbar.html' %}

<div class="content">
  <div class="compare-toolbar">
    <div class="control">
      <label for="collectionPicker">Collection</label>
      <select id="collectionPicker" onchange="loadComparison()">
        <option value="">Select collection...</option>
      </select>
    </div>
    <div class="control">
      <label for="modelA">Model A</label>
      <select id="modelA" onchange="setVisibleModels()">
        <option value="all">All models</option>
      </select>
    </div>
    <div class="control">
      <label for="modelB">Model B</label>
      <select id="modelB" onchange="setVisibleModels()">
        <option value="">No second model</option>
      </select>
    </div>
    <div class="control">
      <label for="sortMode">Sort</label>
      <select id="sortMode" onchange="setSort(this.value)"
              data-view-preference="vireo.compare.sort">
        <option value="review_priority">Review priority</option>
      </select>
    </div>
    <div class="control">
      <label for="conflictThreshold">Conflict threshold</label>
      <div class="range-control">
        <input id="conflictThreshold" type="range" min="0" max="1" step="0.05"
               oninput="previewConflictThreshold(this.value)"
               onchange="setConflictThreshold(this.value)">
        <span id="conflictThresholdValue" class="range-value">40%</span>
      </div>
    </div>
    <div class="control">
      <label for="compareSearch">Search</label>
      <div class="search-control">
        <input id="compareSearch" type="search" placeholder="Filename, keyword, species" oninput="scheduleSearch()">
        <button id="compareSearchMatchCaseBtn" class="search-option-btn" type="button" aria-pressed="false" onclick="VireoTextSearch.toggle('compareSearch', 'match_case', reloadRows)" title="Match case">Aa</button>
        <button id="compareSearchWholeWordBtn" class="search-option-btn" type="button" aria-pressed="false" onclick="VireoTextSearch.toggle('compareSearch', 'whole_word', reloadRows)" title="Match whole word">ab</button>
      </div>
    </div>
  </div>

  <div id="summaryGrid" class="summary-grid" style="display:none;"></div>
  <div id="taxonomyNote" class="taxonomy-note">Taxonomy data is unavailable. This page can confirm exact keyword matches, but broader/refinement/conflict labels are limited.</div>
  <div id="sortRow" class="sort-row" style="display:none;"></div>
  <div id="excludeRow" class="exclude-row" style="display:none;"></div>

  <div id="stickyControls" class="sticky-controls">
    <div id="filterRow" class="filter-row" style="display:none;"></div>
    <div id="pagerRow" class="pager-row" style="display:none;">
      <span id="pagerSummary" class="pager-summary"></span>
      <button class="pager-btn" id="pagerPrev" onclick="goToPage(comparePage - 1)">Previous</button>
      <button class="pager-btn" id="pagerNext" onclick="goToPage(comparePage + 1)">Next</button>
      <label class="pager-size" for="pagerPerPage">Rows</label>
      <select id="pagerPerPage" onchange="setPerPage(this.value)"
              data-view-preference="vireo.compare.perPage">
        <option value="30">30</option>
        <option value="60">60</option>
        <option value="120">120</option>
        <option value="200">200</option>
      </select>
      <span id="loadingNote" class="pager-note" hidden>Loading...</span>
    </div>
    <div id="batchRow" class="batch-row" style="display:none;">
      <span id="batchCount" class="batch-count">0 selected</span>
      <button class="batch-btn" id="batchAccept" onclick="batchAction('accept')">Add prediction keyword</button>
      <button class="batch-btn" id="batchReplace" onclick="batchAction('replace')">Replace species keyword</button>
      <button class="batch-btn" id="batchReject" onclick="batchAction('reject')">Reject prediction</button>
      <button class="batch-btn" id="batchReviewed" onclick="batchAction('reviewed')">Mark reviewed</button>
    </div>
  </div>

  <div id="compareContent">
    <div class="compare-empty">Select a collection to compare keywords and predictions.</div>
  </div>
</div>

<script>
// The comparison itself is derived on the server (see vireo/id_conflicts.py):
// working out what a row means costs a pass over every prediction in the
// collection and the taxonomy behind it, and a catalog-sized collection
// produces tens of thousands of rows. This page asks for one page of rows
// plus the counts, and renders what it is told.
var compareData = null;
var compareRows = [];
var compareToken = null;
var comparePage = 1;
var comparePerPage = 60;
var compareTotal = 0;
var compareModels = [];
var compareFilterDefs = [];
var compareSortDefs = [];
var compareExcludeDefs = [];
var activeFilter = 'needs_review';
var activeSort = 'review_priority';
var excludeState = {};
var selectedRows = new Set();
// Bumped by full collection loads only. Scoped decision refreshes read it to
// tell whether the comparison they were queued against is still on screen.
var loadingSeq = 0;
// Bumped by every row request, so a slower response can never paint over a
// newer one — a filter click and a queued decision refresh race constantly.
var requestSeq = 0;
var decisionRefreshQueue = Promise.resolve();
var searchTimer = null;
var CONFLICT_THRESHOLD_KEY = 'vireo.compare.conflictThreshold';
var PER_PAGE_KEY = 'vireo.compare.perPage';
var conflictMinConfidence = loadConflictThreshold();

var savedSort = VireoViewPreferences.read('vireo.compare.sort');
if (savedSort) activeSort = savedSort;
var savedPerPage = parseInt(VireoViewPreferences.read(PER_PAGE_KEY), 10);
if (savedPerPage > 0) comparePerPage = savedPerPage;

function clampConfidence(value) {
  var parsed = parseFloat(value);
  if (!Number.isFinite(parsed)) return 0.4;
  return Math.min(1, Math.max(0, parsed));
}

function loadConflictThreshold() {
  try {
    var saved = window.localStorage && window.localStorage.getItem(CONFLICT_THRESHOLD_KEY);
    if (saved !== null) return clampConfidence(saved);
  } catch (_e) {}
  return 0.4;
}

function updateConflictThresholdControl() {
  var input = document.getElementById('conflictThreshold');
  var value = document.getElementById('conflictThresholdValue');
  if (input) input.value = String(conflictMinConfidence);
  if (value) value.textContent = Math.round(conflictMinConfidence * 100) + '%';
}

// The slider's label follows the drag, but the comparison is only re-derived
// when the drag ends: the threshold changes what every row *means*, so it
// rebuilds the whole assessment rather than re-filtering a list.
function previewConflictThreshold(value) {
  var label = document.getElementById('conflictThresholdValue');
  if (label) label.textContent = Math.round(clampConfidence(value) * 100) + '%';
}

function setConflictThreshold(value) {
  var next = clampConfidence(value);
  if (next === conflictMinConfidence) return;
  conflictMinConfidence = next;
  try {
    if (window.localStorage) {
      window.localStorage.setItem(CONFLICT_THRESHOLD_KEY, String(conflictMinConfidence));
    }
  } catch (_e) {}
  updateConflictThresholdControl();
  reloadRows();
}

async function jsonFetch(url, options) {
  var resp = await fetch(url, options || {});
  var data = await resp.json().catch(function() { return {}; });
  if (!resp.ok || data.error) {
    var err = new Error(data.error || ('Request failed: ' + resp.status));
    // Keep the outcome class on the error, not just its text. A 4xx (or any
    // response carrying an `error` body) is the server *answering* — it
    // refused, and wrote nothing. A 5xx or a thrown fetch is an unknown
    // outcome: the decision routes commit inside BEGIN IMMEDIATE, so a
    // failure after that commit is indistinguishable from one before it at
    // this end. Callers must not report the second as "not applied".
    err.status = resp.status;
    // An `error` body is itself the answer: the server got far enough to
    // explain the refusal in its own words, whatever status it chose to send
    // it under. Classifying on the status alone reported those as unconfirmed,
    // which understates what we know — so both shapes count as answered, and
    // only a status-only failure (5xx, or a fetch that threw) stays unknown.
    err.answered = Boolean(data.error) || (resp.status >= 400 && resp.status < 500);
    throw err;
  }
  return data;
}

async function loadCollections() {
  try {
    var data = await jsonFetch('/api/collections');
    var sel = document.getElementById('collectionPicker');
    data.forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      // count_error means /api/collections couldn't resolve this collection's
      // rules — comparing against it would just 400 the downstream fetch.
      // Show it disabled so the state is visible instead of offering a
      // source that can't render.
      if (c.count_error) {
        opt.disabled = true;
        opt.textContent = c.name + ' (unavailable — edit rules to fix)';
        opt.title = "This collection's rules could not be resolved. Edit it in Browse to make it usable.";
      } else if (c.has_visual) {
        // /api/predictions/compare consumes the collection via
        // get_collection_photos, which is rules-only — a visual
        // collection would silently widen the comparison to every
        // metadata match. Match the server-side 400 in the picker.
        opt.disabled = true;
        opt.textContent = c.name + ' (visual — open in Browse)';
        opt.title = 'Visual collections can only be used from Browse, where the filter bar resolves the visual-search clause.';
      }
      sel.appendChild(opt);
    });
    var all = data.find(function(c) { return c.name === 'All Photos' && !c.count_error && !c.has_visual; });
    if (all) {
      sel.value = all.id;
      loadComparison();
    }
  } catch(e) {
    document.getElementById('compareContent').innerHTML =
      '<div class="compare-empty">Could not load collections.</div>';
  }
}

function visibleModels() {
  var a = document.getElementById('modelA').value;
  var b = document.getElementById('modelB').value;
  if (!a || a === 'all') return compareModels.slice();
  var models = [a];
  if (b && b !== a) models.push(b);
  return models;
}

// Sent to the server as the models to compare. "All models" sends nothing at
// all, so a model that appears while the page is open is included instead of
// being pinned out by a stale list.
function requestedModelParams() {
  var a = document.getElementById('modelA').value;
  if (!a || a === 'all') return [];
  return visibleModels();
}

function setVisibleModels() {
  reloadRows();
}

function showLoading(active) {
  var note = document.getElementById('loadingNote');
  if (note) note.hidden = !active;
  var content = document.getElementById('compareContent');
  if (content) content.classList.toggle('loading', !!active);
}

function buildRowsUrl(options) {
  var collId = document.getElementById('collectionPicker').value;
  var params = new URLSearchParams();
  params.set('collection_id', collId);
  if (compareToken) params.set('token', compareToken);
  requestedModelParams().forEach(function(model) { params.append('model', model); });
  params.set('min_confidence', String(conflictMinConfidence));
  params.set('filter', activeFilter);
  params.set('sort', activeSort);
  Object.keys(excludeState).forEach(function(id) {
    if (excludeState[id]) params.append('exclude', id);
  });
  var search = document.getElementById('compareSearch');
  var q = search ? search.value.trim() : '';
  if (q) params.set('q', q);
  VireoTextSearch.appendParams(params, VireoTextSearch.readOptions('compareSearch'));
  params.set('page', String(options.page || comparePage));
  params.set('per_page', String(comparePerPage));
  (options.refreshPhotoIds || []).forEach(function(id) {
    params.append('refresh_photo_id', String(id));
  });
  return '/api/predictions/compare?' + params.toString();
}

// One request answers everything on screen: the rows for this page, the
// counts on every chip and tile, and the total the pager reports.
async function fetchRows(options) {
  options = options || {};
  var collId = document.getElementById('collectionPicker').value;
  if (!collId) return;
  var fullLoadSeq = loadingSeq;
  showLoading(true);
  // A control the user just touched — filter, sort, search, threshold, pager
  // — must not overtake a decision refresh that is still in flight. The
  // server rebuilds the changed photos inside the stored comparison while
  // that refresh runs, and a query that reads the comparison first would take
  // the newer sequence number and then discard the refresh's answer, leaving
  // the counts and the decided row exactly as they were before the decision.
  // Waiting for the queue lets the decision land first, so this query reads
  // the comparison the decision produced. Only user controls wait: the
  // refresh's own queries run inside the queue and would deadlock on it.
  if (options.control) {
    await decisionRefreshQueue;
  }
  // Claimed after the wait, so the query the user asked for most recently is
  // the one that wins rather than the one that stopped waiting last.
  var seq = ++requestSeq;
  var data;
  try {
    data = await jsonFetch(buildRowsUrl(options));
  } catch (e) {
    if (seq !== requestSeq) return;
    showLoading(false);
    document.getElementById('compareContent').innerHTML =
      '<div class="compare-empty">Error loading comparison: ' + escapeHtml(e.message) + '</div>';
    throw e;
  }
  // A newer request — or a collection load — has taken over. Its response is
  // the current one; painting this stale body over it would show rows that
  // do not belong to the comparison on screen.
  if (seq !== requestSeq || fullLoadSeq !== loadingSeq) return;
  showLoading(false);
  var modelSelectionReset = applyRowsResponse(data, options);
  // The queue the page opens on is Needs review. When it is empty there is
  // nothing to review, so show the collection rather than an empty table —
  // but only when the page chose the filter, never when the user did. An
  // empty queue proves nothing when the model selection was just reset: this
  // response was assessed under a model the collection does not carry, and
  // the corrected re-query already carries the decision on the real counts.
  if (
    !modelSelectionReset
    && !options.filterResolved
    && (options.initial || options.afterDecision)
    && activeFilter === 'needs_review'
    && (data.summary || {}).needs_review === 0
  ) {
    activeFilter = 'all';
    comparePage = 1;
    await fetchRows({filterResolved: true, page: 1});
  }
}

// Returns true when the response was assessed under a model the collection
// does not carry, so a corrected re-query is already on its way and the caller
// must not read anything into these counts.
function applyRowsResponse(data, options) {
  compareData = data;
  compareRows = data.photos || [];
  compareToken = data.token || compareToken;
  compareTotal = data.total || 0;
  comparePage = data.page || 1;
  comparePerPage = data.per_page || comparePerPage;
  compareModels = data.models || [];
  compareFilterDefs = data.filters || compareFilterDefs;
  compareSortDefs = data.sorts || compareSortDefs;
  compareExcludeDefs = data.excludes || compareExcludeDefs;
  compareExcludeDefs.forEach(function(item) {
    if (!(item.id in excludeState)) excludeState[item.id] = false;
  });
  var modelSelectionReset = populateModelSelects(compareModels, data.visible_models || []);
  populateSortSelect();
  // A row that left the page — decided, filtered out, or simply on another
  // page — must not stay in a selection whose batch buttons still claim it.
  var visible = new Set(compareRows.map(function(photo) { return photo.photo_id; }));
  Array.from(selectedRows).forEach(function(id) {
    if (!visible.has(id)) selectedRows.delete(id);
  });
  renderCompare();
  // The response was assessed with a specific model the new collection
  // does not carry; the model controls just reset to what is actually
  // available. Re-query so the counts, statuses and sort match the columns
  // the user now sees rather than the model that was silently dropped. The
  // re-query inherits this load's intent, so the default-filter decision the
  // caller would have made is made once, on the corrected counts.
  if (modelSelectionReset) {
    reloadRows({
      initial: options.initial,
      afterDecision: options.afterDecision,
      internal: true,
    });
  }
  return modelSelectionReset;
}

// A full load of the current collection: everything else on this page is a
// re-query of the same comparison.
async function loadComparison() {
  var collId = document.getElementById('collectionPicker').value;
  var content = document.getElementById('compareContent');
  selectedRows.clear();
  compareToken = null;
  comparePage = 1;
  loadingSeq++;
  updateBatchControls();

  if (!collId) {
    compareData = null;
    compareRows = [];
    ['summaryGrid', 'sortRow', 'excludeRow', 'filterRow', 'pagerRow', 'batchRow']
      .forEach(function(id) { document.getElementById(id).style.display = 'none'; });
    content.innerHTML = '<div class="compare-empty">Select a collection to compare keywords and predictions.</div>';
    return;
  }

  content.innerHTML = '<div class="compare-empty">Loading keyword comparison...</div>';
  try {
    await fetchRows({initial: true, page: 1});
  } catch (_e) {
    // fetchRows already rendered the failure.
  }
}

// Re-query the comparison with the current controls, back at the first page.
// A caller that is re-querying on behalf of a load still owed a default-filter
// decision passes that intent through so the decision survives the detour.
// Only those three flags are carried: this also runs as a plain change
// handler, and handlers are called with arguments of their own.
function reloadRows(carry) {
  comparePage = 1;
  selectedRows.clear();
  var options = {page: 1};
  if (carry && carry.initial) options.initial = true;
  if (carry && carry.afterDecision) options.afterDecision = true;
  // A change handler fired by a control the user touched has to queue behind
  // any decision refresh still running. The one caller that re-queries from
  // inside the page's own machinery says so, because it can already be
  // running inside that queue.
  if (!(carry && carry.internal)) options.control = true;
  return fetchRows(options).catch(function() {});
}

function scheduleSearch() {
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    searchTimer = null;
    reloadRows();
  }, 250);
}

function goToPage(page) {
  var pages = totalPages();
  if (page < 1 || page > pages || page === comparePage) return;
  comparePage = page;
  selectedRows.clear();
  fetchRows({page: page, control: true}).catch(function() {});
}

function setPerPage(value) {
  var next = parseInt(value, 10);
  if (!(next > 0) || next === comparePerPage) return;
  comparePerPage = next;
  VireoViewPreferences.write(PER_PAGE_KEY, String(next));
  reloadRows();
}

function totalPages() {
  return Math.max(1, Math.ceil(compareTotal / Math.max(1, comparePerPage)));
}

// Returns true when a previously-selected specific model was dropped because
// the new collection does not carry it: the caller needs to re-fetch so the
// response's counts, statuses and sort match the columns the user now sees.
function populateModelSelects(models, visible) {
  var a = document.getElementById('modelA');
  var b = document.getElementById('modelB');
  var oldA = a.value || 'all';
  var oldB = b.value || '';
  a.innerHTML = '<option value="all">All models</option>';
  b.innerHTML = '<option value="">No second model</option>';
  models.forEach(function(m) {
    a.innerHTML += '<option value="' + escapeAttr(m) + '">' + escapeHtml(m) + '</option>';
    b.innerHTML += '<option value="' + escapeAttr(m) + '">' + escapeHtml(m) + '</option>';
  });
  var newA = models.indexOf(oldA) >= 0 ? oldA : 'all';
  var newB = models.indexOf(oldB) >= 0 ? oldB : '';
  a.value = newA;
  b.value = newB;
  var droppedA = oldA !== 'all' && newA !== oldA;
  var droppedB = oldB !== '' && newB !== oldB;
  return droppedA || droppedB;
}

function populateSortSelect() {
  var sel = document.getElementById('sortMode');
  if (!sel || !compareSortDefs.length) return;
  sel.innerHTML = compareSortDefs.map(function(s) {
    return '<option value="' + escapeAttr(s.id) + '">' + escapeHtml(s.label) + '</option>';
  }).join('');
  sel.value = activeSort;
}

function renderCompare() {
  if (!compareData) return;
  renderSummary();
  renderSorts();
  renderExcludes();
  renderFilters();
  renderPager();
  renderTaxonomyNote();
  renderTable(compareRows);
  updateBatchControls();
}

function effectiveSummary() {
  return (compareData && compareData.summary) || {};
}

function renderSummary() {
  var s = effectiveSummary();
  var items = [
    ['photos', 'Photos'],
    ['models', 'Models'],
    ['needs_review', 'Needs review'],
    ['model_disagreements', 'Models disagree'],
    ['keyword_model_conflicts', 'Keyword vs models'],
    ['additional', 'Additional species'],
    ['conflicts', 'Conflicts'],
    ['refinements', 'Refinements'],
    ['broader', 'Broader'],
    ['new', 'No species keyword'],
    ['missing_predictions', 'Missing predictions'],
  ];
  document.getElementById('summaryGrid').style.display = '';
  document.getElementById('summaryGrid').innerHTML = items.map(function(item) {
    return '<div class="summary-item"><span class="summary-value">' +
      escapeHtml(s[item[0]] || 0) + '</span><span class="summary-label">' +
      escapeHtml(item[1]) + '</span></div>';
  }).join('');
}

function renderTaxonomyNote() {
  document.getElementById('taxonomyNote').classList.toggle(
    'visible',
    compareData && compareData.taxonomy_available === false
  );
}

function renderSorts() {
  var row = document.getElementById('sortRow');
  row.style.display = '';
  row.innerHTML = '<span class="row-label">Sort by</span>' + compareSortDefs.map(function(s) {
    var cls = s.id === activeSort ? 'sort-btn active' : 'sort-btn';
    return '<button class="' + cls + '" onclick="setSort(\'' + s.id + '\')">' +
      escapeHtml(s.label) + '</button>';
  }).join('');
  var select = document.getElementById('sortMode');
  if (select) select.value = activeSort;
}

function renderExcludes() {
  var counts = (compareData && compareData.exclusion_counts) || {};
  var row = document.getElementById('excludeRow');
  row.style.display = '';
  row.innerHTML = '<span class="row-label">Exclude</span>' + compareExcludeDefs.map(function(f) {
    var cls = excludeState[f.id] ? 'exclude-btn active' : 'exclude-btn';
    return '<button class="' + cls + '" onclick="toggleExclude(\'' + f.id + '\')">' +
      escapeHtml(f.label) + ' <span>' + escapeHtml(counts[f.id] || 0) + '</span></button>';
  }).join('');
}

function renderFilters() {
  var counts = (compareData && compareData.filter_counts) || {};
  var row = document.getElementById('filterRow');
  row.style.display = '';
  row.innerHTML = '<span class="row-label">Filter</span>' + compareFilterDefs.map(function(f) {
    var cls = f.id === activeFilter ? 'filter-btn active' : 'filter-btn';
    return '<button class="' + cls + '" onclick="setFilter(\'' + f.id + '\')">' +
      escapeHtml(f.label) + ' <span>' + escapeHtml(counts[f.id] || 0) + '</span></button>';
  }).join('');
}

function renderPager() {
  var row = document.getElementById('pagerRow');
  row.style.display = '';
  var pages = totalPages();
  var first = compareTotal ? (comparePage - 1) * comparePerPage + 1 : 0;
  var last = Math.min(compareTotal, comparePage * comparePerPage);
  document.getElementById('pagerSummary').textContent = compareTotal
    ? first + '–' + last + ' of ' + compareTotal + ' (page ' + comparePage + ' of ' + pages + ')'
    : 'No rows match';
  document.getElementById('pagerPrev').disabled = comparePage <= 1;
  document.getElementById('pagerNext').disabled = comparePage >= pages;
  var perPage = document.getElementById('pagerPerPage');
  if (perPage) perPage.value = String(comparePerPage);
}

function toggleExclude(id) {
  excludeState[id] = !excludeState[id];
  reloadRows();
}

function setSort(sort) {
  activeSort = sort;
  VireoViewPreferences.write('vireo.compare.sort', sort);
  reloadRows();
}

function setFilter(filter) {
  activeFilter = filter;
  reloadRows();
}

function renderTable(rows) {
  var content = document.getElementById('compareContent');
  var models = visibleModels();
  if (!compareTotal && !rows.length) {
    content.innerHTML = (effectiveSummary().photos || 0)
      ? '<div class="compare-empty">No photos match the current filter.</div>'
      : '<div class="compare-empty">This collection has no photos.</div>';
    return;
  }
  if (!rows.length) {
    content.innerHTML = '<div class="compare-empty">No rows on this page.</div>';
    return;
  }

  var html = '<div class="table-wrap"><table class="compare-table"><thead><tr>' +
    '<th class="select-col"><input type="checkbox" title="Select every row on this page" onchange="toggleAllRows(this.checked)"></th>' +
    '<th class="photo-col">Photo</th>' +
    '<th>Status</th>' +
    '<th class="signal-col">Signals</th>' +
    '<th class="keyword-col">Current keywords</th>';
  models.forEach(function(m) {
    html += '<th class="model-col">' + escapeHtml(m) + '</th>';
  });
  html += '</tr></thead><tbody>';

  rows.forEach(function(photo) {
    var status = photo.status || {};
    var multiSubject = (photo.subjects || []).length > 1;
    html += '<tr data-photo-id="' + photo.photo_id + '">' +
      '<td><input type="checkbox" ' + (selectedRows.has(photo.photo_id) ? 'checked' : '') +
      (multiSubject ? ' disabled title="Use the subject-specific actions for multi-subject photos"' :
        ' onchange="toggleRow(' + photo.photo_id + ', this.checked)"') + '></td>' +
      '<td>' + renderPhotoCell(photo) + '</td>' +
      '<td><span class="category-pill ' + escapeAttr(status.category) + '">' +
      escapeHtml(status.label) + '</span></td>' +
      '<td>' + renderSignalCell(photo) + '</td>' +
      '<td>' + renderKeywordCell(photo) + '</td>';
    models.forEach(function(m) {
      html += '<td>' + renderPredictionCell(photo, m) + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  content.innerHTML = html;
}

function renderSignalCell(photo) {
  var signal = photo.signal || {};
  var statuses = photo.subject_statuses || [];
  var subjects = photo.subjects || [];
  var pills = [];
  if (subjects.length > 1) {
    pills.push('<span class="signal-pill">' + subjects.length + ' subjects</span>');
  }
  if (signal.additional_subject_count > 0) {
    pills.push('<span class="signal-pill match">' + signal.additional_subject_count +
      ' additional species suggestion' + (signal.additional_subject_count === 1 ? '' : 's') + '</span>');
  }
  if (signal.model_disagreement_score > 0) {
    // The score is the weaker side's confidence — a disagreement is only as
    // strong as the least-confident model in the pair.
    pills.push('<span class="signal-pill hot" title="' + escapeAttr(
        signal.model_disagreement_label +
        ' — strength is the less-confident model’s ' +
        Math.round(signal.model_disagreement_score) + '%') +
      '">Models disagree ' + Math.round(signal.model_disagreement_score) + '%</span>');
  }
  if (signal.keyword_conflict_count > 0) {
    pills.push('<span class="signal-pill hot" title="' + escapeAttr(
        signal.keyword_conflict_count + ' model prediction' +
        (signal.keyword_conflict_count === 1 ? '' : 's') +
        ' conflict with the current species keyword (strongest at ' +
        Math.round((signal.max_keyword_conflict_confidence || 0) * 100) + '%)') +
      '">' + signal.keyword_conflict_count + ' vs keyword</span>');
  }
  if (signal.consensus_count >= 2) {
    pills.push('<span class="signal-pill match" title="' + escapeAttr(signal.consensus_label) +
      '">' + signal.consensus_count + ' agree</span>');
  }
  if (signal.missing_visible_model_count > 0) {
    pills.push('<span class="signal-pill">' + signal.missing_visible_model_count + ' missing</span>');
  }
  if (!pills.length) {
    return '<span class="empty-cell">No comparison signal</span>';
  }
  var detail = [];
  if (signal.model_disagreement_label) detail.push(signal.model_disagreement_label);
  statuses.forEach(function(status, index) {
    var species = (subjects[index] || {}).signal_consensus_species;
    if (status.category === 'additional' && species) {
      detail.push('Subject ' + (index + 1) + ': ' + species);
    }
  });
  if (signal.consensus_label) detail.push(signal.consensus_label);
  return '<div class="signal-list">' + pills.join('') + '</div>' +
    (detail.length ? '<div class="signal-note">' + escapeHtml(detail.join(' · ')) + '</div>' : '');
}

function subjectBoxLabel(subject) {
  var box = (subject && subject.box) || {};
  if ([box.x, box.y, box.w, box.h].some(function(value) { return value == null; })) return '';
  return 'box x ' + Math.round(box.x * 100) + '–' + Math.round((box.x + box.w) * 100) +
    '%, y ' + Math.round(box.y * 100) + '–' + Math.round((box.y + box.h) * 100) + '%';
}

function renderPhotoCell(photo) {
  var meta = [];
  var thumbUrl = window.vireoThumbnailUrl
    ? window.vireoThumbnailUrl(photo)
    : '/thumbnails/' + photo.photo_id + '.jpg';
  if (photo.timestamp) meta.push(photo.timestamp.replace('T', ' ').substring(0, 16));
  if (photo.rating) meta.push(photo.rating + ' star' + (photo.rating === 1 ? '' : 's'));
  if (photo.flag && photo.flag !== 'none') meta.push(photo.flag);
  if (photo.wildlife_excluded) meta.push('not wildlife');
  if (photo.miss_no_subject || photo.miss_clipped || photo.miss_oof) meta.push('marked miss');
  var subjects = photo.subjects || [];
  var statuses = photo.subject_statuses || [];
  var subjectSummary = '';
  if (subjects.length > 1) {
    subjectSummary = '<div class="subject-summary-list">' + subjects.map(function(subject, index) {
      var status = statuses[index] || {};
      var species = subject.signal_consensus_species
        ? ' · ' + escapeHtml(subject.signal_consensus_species) : '';
      var location = subjectBoxLabel(subject);
      return '<div class="subject-summary"><strong>Subject ' + (index + 1) + '</strong>' + species +
        ' · <span class="category-pill ' + escapeAttr(status.category) + '">' +
        escapeHtml(status.label) + '</span>' +
        (location ? '<div>' + escapeHtml(location) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  return '<div class="photo-cell">' +
    '<button type="button" class="photo-thumb-button" title="View larger" onclick="openCompareLightbox(' +
    photo.photo_id + ')"><img src="' + escapeAttr(thumbUrl) + '" loading="lazy" alt="' +
    escapeAttr(photo.filename) + '"></button>' +
    '<div><div class="photo-name">' + escapeHtml(photo.filename) + '</div>' +
    '<div class="photo-meta">' + escapeHtml(meta.join(' · ')) + '</div>' +
    subjectSummary +
    '<div class="pred-actions"><a class="inline-btn" href="/browse?photo_id=' +
    encodeURIComponent(photo.photo_id) + '">Browse</a></div></div></div>';
}

function compareLightboxPhotoList() {
  return compareRows.map(function(photo) {
    return {
      id: photo.photo_id,
      filename: photo.filename || '',
      flag: photo.flag || 'none',
      wildlife_excluded: !!photo.wildlife_excluded,
    };
  });
}

function openCompareLightbox(photoId) {
  var list = compareLightboxPhotoList();
  var current = list.find(function(photo) { return photo.id === photoId; });
  if (!current) {
    current = {id: photoId, filename: '', flag: 'none', wildlife_excluded: false};
    list = [current];
  }
  openLightbox(current.id, current.filename, list);
}

function isSpeciesKeyword(k) {
  // Mirror the backend species definition. A linked family/genus is a
  // taxonomy keyword, but not a species; unresolved legacy tags retain the
  // old flag/type fallback.
  var markedTaxonomy = !!k.is_species || k.type === 'taxonomy';
  return markedTaxonomy && (!k.taxon_rank || k.taxon_rank === 'species');
}

function renderKeywordCell(photo) {
  var species = (photo.keywords || []).filter(isSpeciesKeyword);
  var other = (photo.keywords || []).filter(function(k) { return !isSpeciesKeyword(k); });
  var html = '';
  if (species.length) {
    html += '<div class="keyword-group">' + species.map(function(k) {
      return '<span class="keyword-pill species" title="Species keyword">' +
        escapeHtml(k.name) + '</span>';
    }).join('') + '</div>';
  } else {
    html += '<div class="empty-cell">No species keyword</div>';
  }
  if (other.length) {
    html += '<div class="keyword-group">' + other.map(function(k) {
      return '<span class="keyword-pill general" title="' + escapeAttr(k.type || 'keyword') + '">' +
        escapeHtml(k.name) + '</span>';
    }).join('') + '</div>';
  }
  return html;
}

function renderPredictionCell(photo, model) {
  var subjects = photo.subjects || [];
  var statuses = photo.subject_statuses || [];
  if (!subjects.length) return '<span class="empty-cell">No prediction</span>';
  return subjects.map(function(subject, subjectIndex) {
    var preds = (subject.predictions || {})[model] || [];
    var subjectStatus = statuses[subjectIndex] || {};
    var heading = subjects.length > 1
      ? '<div class="subject-heading"><span>Subject ' + (subjectIndex + 1) + '</span>' +
        '<span class="category-pill ' + escapeAttr(subjectStatus.category) + '">' +
        escapeHtml(subjectStatus.label) + '</span></div>'
      : '';
    if (!preds.length) {
      return '<div class="subject-prediction-group">' + heading +
        '<span class="empty-cell">No prediction for this subject</span></div>';
    }
    var predictionsHtml = preds.map(function(pred) {
      var status = pred.status || 'pending';
      var disabled = status !== 'pending' ? ' disabled' : '';
      var detail = pred.category_detail || '';
      var belowThreshold = pred.effective_category === 'low_conflict';
      var displayedCategory = subjectStatus.category === 'additional' && pred.category === 'conflict'
        ? 'additional' : pred.category;
      var displayedLabel = displayedCategory === 'additional'
        ? subjectStatus.label : pred.category_label;
      if (pred.matched_keyword) detail += ' Keyword: ' + pred.matched_keyword + '.';
      if (pred.shared_rank) detail += ' Shared ' + pred.shared_rank + '.';
      if (belowThreshold) detail += ' Below conflict threshold.';
      if (displayedCategory === 'additional') {
        detail = 'A different detected subject accounts for the current species keyword. ' +
          'This prediction may identify another species in the photo.';
      }
      var acceptLabel = displayedCategory === 'additional' ? 'Add additional species' : 'Add keyword';
      var acceptAction = displayedCategory === 'additional' ? 'accept_subject' : 'accept';
      var replaceButton = subjects.length === 1
        ? '<button class="inline-btn primary" onclick="predictionAction(' + pred.id + ', \'replace\')"' + disabled + '>Replace keyword</button>'
        : '';
      return '<div class="pred' + (belowThreshold ? ' below-threshold' : '') + '">' +
        '<div class="pred-main"><span class="pred-species">' + escapeHtml(pred.species) + '</span>' +
        '<span class="pred-confidence">' + Math.round((pred.confidence || 0) * 100) + '%</span>' +
        '<span class="category-pill ' + escapeAttr(displayedCategory) + '">' + escapeHtml(displayedLabel) + '</span>' +
        '<span class="status-pill ' + escapeAttr(status) + '">' + escapeHtml(status) + '</span></div>' +
        '<div class="pred-detail">' + escapeHtml(detail) + '</div>' +
        '<div class="pred-actions">' +
        '<button class="inline-btn primary" onclick="predictionAction(' + pred.id + ', \'' + acceptAction + '\')"' + disabled + '>' + acceptLabel + '</button>' +
        replaceButton +
        '<button class="inline-btn danger" onclick="predictionAction(' + pred.id + ', \'reject\')"' + disabled + '>Reject</button>' +
        '<button class="inline-btn" onclick="predictionAction(' + pred.id + ', \'reviewed\')"' + disabled + '>Reviewed</button>' +
        '</div></div>';
    }).join('');
    return '<div class="subject-prediction-group">' + heading + predictionsHtml + '</div>';
  }).join('');
}

function toggleRow(photoId, checked) {
  if (checked) selectedRows.add(photoId);
  else selectedRows.delete(photoId);
  updateBatchControls();
}

// Only this page's rows: a batch action sends one request per row, so
// "select everything the filter matched" would fire tens of thousands of
// writes from a single click.
function toggleAllRows(checked) {
  compareRows.forEach(function(photo) {
    if ((photo.subjects || []).length > 1) return;
    if (checked) selectedRows.add(photo.photo_id);
    else selectedRows.delete(photo.photo_id);
  });
  renderCompare();
}

function updateBatchControls() {
  var row = document.getElementById('batchRow');
  if (!compareData) {
    row.style.display = 'none';
    return;
  }
  row.style.display = '';
  document.getElementById('batchCount').textContent = selectedRows.size + ' selected';
  ['batchAccept', 'batchReplace', 'batchReject', 'batchReviewed'].forEach(function(id) {
    document.getElementById(id).disabled = selectedRows.size === 0;
  });
}

function loadedPhoto(photoId) {
  return compareRows.find(function(photo) { return photo.photo_id === photoId; });
}

function comparePhotoIdsForPredictions(predictionIds) {
  var wanted = new Set((predictionIds || []).map(function(id) { return Number(id); }));
  var photoIds = [];
  compareRows.forEach(function(photo) {
    var found = (photo.subjects || []).some(function(subject) {
      return Object.keys(subject.predictions || {}).some(function(model) {
        return (subject.predictions[model] || []).some(function(pred) {
          return wanted.has(Number(pred.id));
        });
      });
    });
    if (found) photoIds.push(photo.photo_id);
  });
  return photoIds;
}

function setComparePredictionStatus(predId, status) {
  var changed = false;
  compareRows.forEach(function(photo) {
    (photo.subjects || []).forEach(function(subject) {
      Object.keys(subject.predictions || {}).forEach(function(model) {
        (subject.predictions[model] || []).forEach(function(pred) {
          if (Number(pred.id) !== Number(predId)) return;
          pred.status = status;
          changed = true;
        });
      });
    });
  });
  return changed;
}

function currentComparisonScope() {
  return {
    collectionId: document.getElementById('collectionPicker').value,
    loadingSeq: loadingSeq,
  };
}

function comparisonScopeIsCurrent(scope) {
  return Boolean(compareData) && scope.loadingSeq === loadingSeq &&
    document.getElementById('collectionPicker').value === scope.collectionId;
}

// A decision changed some photos. Rebuild exactly those inside the stored
// comparison and re-query this page, so the row, the chip counts and the
// filter membership all move together instead of drifting apart.
async function refreshComparisonPhotos(photoIds, scope) {
  if (!compareData) return;
  var uniqueIds = Array.from(new Set((photoIds || []).map(Number).filter(function(id) {
    return Number.isInteger(id) && id > 0;
  })));
  if (!uniqueIds.length) {
    await loadComparison();
    return;
  }
  var refreshScope = scope || currentComparisonScope();
  if (!comparisonScopeIsCurrent(refreshScope)) return;
  await fetchRows({refreshPhotoIds: uniqueIds, afterDecision: true});
}

function refreshDecisionPhotos(photoIds, scope) {
  // Decision buttons on different rows can be used before an earlier scoped
  // request finishes. Serialize the reads so an older server snapshot can
  // never merge after a newer one and overwrite its state.
  var queuedScope = scope || currentComparisonScope();
  var refresh = decisionRefreshQueue.then(async function() {
    // Capture scope when the decision is made, not when its queued refresh
    // eventually starts. A collection load while it waits supersedes it.
    if (!comparisonScopeIsCurrent(queuedScope)) return;
    try {
      await refreshComparisonPhotos(photoIds, queuedScope);
    } catch (e) {
      showToast('Could not refresh the changed photo — reloading the comparison.', 'error');
      await loadComparison();
    }
  });
  // A failed reload must not poison every later refresh in the queue.
  decisionRefreshQueue = refresh.catch(function() {});
  return refresh;
}

async function predictionAction(predId, action) {
  var decisionScope = currentComparisonScope();
  var url = '/api/predictions/' + predId + '/' + endpointForAction(action);
  var entryPhotoIds = comparePhotoIdsForPredictions([predId]);
  var data;
  try {
    data = await jsonFetch(url, { method: 'POST' });
  } catch (e) {
    // The decision endpoints now answer 409 when the row was already settled
    // — from a second tab, or from a Browse batch decision landing while this
    // page sat open. The buttons here are disabled for non-pending rows, so
    // reaching this means the page is stale: say so and refresh that photo
    // rather than swallowing the click, which would look like the action
    // succeeded.
    //
    // Only a server that answered lets us say the decision was not applied.
    // For a dropped connection or a 5xx the request may well have committed,
    // so the honest report is that we cannot confirm it — the targeted
    // refresh below shows which it was either way.
    if (e && e.answered) {
      showToast(e.message || 'Could not apply that decision', 'error');
      // Another tab can settle an entire burst before this stale row reaches
      // the server. The 409 does not name those grouped photos, so a scoped
      // refresh cannot reconcile the comparison safely.
      if (e.status === 409 && (action === 'accept' || action === 'replace' ||
          action === 'accept_subject')) {
        await loadComparison();
        return;
      }
    } else {
      showToast('Could not confirm the decision (' +
        (e && e.message ? e.message : 'the request failed') +
        ') — reloading the comparison to show the current state.', 'error');
      // An accept/replace response can be lost after a grouped write commits.
      // Without its photo_ids response we cannot know every burst member that
      // changed, so only a full reload can reconcile the collection safely.
      await loadComparison();
      return;
    }
    await refreshDecisionPhotos(entryPhotoIds, decisionScope);
    return;
  }

  // A collection navigation that finished while the POST was in flight may
  // have loaded a snapshot from before this decision committed. Reconcile the
  // current collection without ever mutating it using the old row's state.
  if (!comparisonScopeIsCurrent(decisionScope)) {
    await loadComparison();
    return;
  }

  // Reject and Reviewed only change this prediction's review status. Show it
  // on the row immediately, then re-query so the counts and this row's
  // membership in the filter catch up.
  if (action === 'reject' || action === 'reviewed') {
    if (setComparePredictionStatus(
      predId, action === 'reject' ? 'rejected' : 'reviewed'
    )) {
      renderCompare();
    }
    await refreshDecisionPhotos(entryPhotoIds, decisionScope);
    return;
  }

  var affectedPhotoIds = entryPhotoIds.concat((data && data.photo_ids) || []);
  await refreshDecisionPhotos(affectedPhotoIds, decisionScope);
}

function endpointForAction(action) {
  if (action === 'accept') return 'accept';
  if (action === 'accept_subject') return 'accept-subject';
  if (action === 'replace') return 'replace-keywords';
  if (action === 'reject') return 'reject';
  return 'reviewed';
}

async function batchAction(action) {
  var decisionScope = currentComparisonScope();
  var ids = Array.from(selectedRows);
  var photos = ids.map(loadedPhoto).filter(Boolean);
  var attempted = 0;
  var refused = [];
  var unconfirmed = 0;
  var groupedConflict = false;
  var refreshPhotoIds = ids.slice();
  // Rows an earlier request in *this* loop already decided. Accept, replace
  // and accept-subject expand through the burst group, so one request can
  // settle several of the selected photos; the next iteration would then hit
  // the terminal-status 409 and be counted as "not applied" for work that
  // demonstrably landed. Shared with Review's Accept All, which loops the same
  // routes over the same contract — see vireo-predictions.js for why the ids
  // ride on the write rather than being read out of the 409's wording.
  var decidedByThisBatch = Vireo.predictions.groupedDecisionTracker();
  for (var i = 0; i < photos.length; i++) {
    var predId = photos[i].best_prediction_id;
    if (!predId) continue;
    attempted++;
    // Applied, not skipped: it counts in the denominator and against no
    // failure bucket, because the server told us it wrote this row.
    if (decidedByThisBatch.alreadyDecided(predId)) continue;
    try {
      var decision = await jsonFetch(
        '/api/predictions/' + predId + '/' + endpointForAction(action),
        { method: 'POST' });
      decidedByThisBatch.record(decision);
      refreshPhotoIds = refreshPhotoIds.concat(decision.photo_ids || []);
    } catch (e) {
      // One already-settled row must not abandon the rest of the batch, but
      // the count has to be named — a batch that quietly did less than the
      // selection implies is the gap this whole flow exists to close. The
      // denominator is what was actually attempted, not the selection: rows
      // with no usable prediction were never sent.
      //
      // Split by outcome class rather than lumping every failure under "not
      // applied": that phrasing is a claim about the database, and it is only
      // true when the server answered. A lost response leaves the decision
      // possibly committed, and saying otherwise is the same kind of
      // convenient fiction the rest of this flow exists to remove.
      if (e && e.answered) {
        refused.push(e.message || 'refused');
        if (e.status === 409 && (action === 'accept' || action === 'replace' ||
            action === 'accept_subject')) groupedConflict = true;
      }
      else unconfirmed++;
    }
  }
  var reportParts = [];
  if (refused.length) {
    reportParts.push(refused.length + ' of ' + attempted + ' not applied — ' +
      refused[0]);
  }
  if (unconfirmed) {
    var reloadsAll = action === 'accept' || action === 'replace' ||
      action === 'accept_subject';
    reportParts.push(unconfirmed + ' of ' + attempted +
      ' could not be confirmed (the request failed with no answer from the ' +
      'server) — the ' + (reloadsAll ? 'reload' : 'refresh') +
      ' below shows whether they landed');
  }
  if (reportParts.length) {
    showToast(reportParts.join('; '), 'error');
  }
  selectedRows.clear();
  if (!comparisonScopeIsCurrent(decisionScope)) {
    await loadComparison();
    return;
  }
  // A grouped keyword decision may commit for unselected burst members before
  // its response is lost. Without the response photo_ids, a targeted refresh
  // cannot discover those members, so reconcile the whole collection.
  if (groupedConflict || (unconfirmed && (action === 'accept' ||
      action === 'replace' || action === 'accept_subject'))) {
    await loadComparison();
    return;
  }
  await refreshDecisionPhotos(refreshPhotoIds, decisionScope);
}

document.addEventListener('DOMContentLoaded', function() { updateConflictThresholdControl(); });
document.addEventListener('DOMContentLoaded', function() { loadCollections(); });
</script>
</body>
