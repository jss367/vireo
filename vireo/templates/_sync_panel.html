<!-- Sync banner: pending changes indicator -->
<div id="syncBanner" style="display:none;background:var(--bg-tertiary);padding:10px 20px;border-bottom:1px solid var(--border-primary);font-size:13px;align-items:center;gap:12px;">
  <span id="syncBannerText" style="color:var(--warning);"></span>
  <button onclick="openSyncPreview()" style="background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-secondary);border-radius:4px;padding:5px 14px;font-size:12px;cursor:pointer;">Review Changes</button>
  <button onclick="runSync()" style="background:var(--accent);color:var(--accent-text);border:none;border-radius:4px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:500;">Sync to XMP</button>
  <span id="syncStatus" style="font-size:12px;color:var(--text-dim);"></span>
</div>

<!-- Sync Preview Modal -->
<div id="syncPreviewOverlay" style="display:none;position:fixed;inset:0;z-index:9996;background:rgba(0,0,0,0.85);overflow-y:auto;">
  <div style="max-width:850px;margin:40px auto;background:var(--bg-secondary);border-radius:8px;padding:24px;position:relative;">
    <button onclick="closeSyncPreview()" style="position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text-muted);font-size:24px;cursor:pointer;">&times;</button>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
      <h2 style="font-size:16px;color:var(--accent);margin:0;">Review Pending Changes</h2>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin-left:auto;">
        <input type="range" id="syncThumbSize" min="60" max="600" value="120" step="20"
               data-view-preference="vireo.syncPreview.thumbSize"
               style="width:80px;accent-color:var(--accent);"
               oninput="updateSyncThumbSize(this.value)">
        <span id="syncThumbSizeVal" style="min-width:32px;">120px</span>
      </label>
    </div>
    <div id="syncPreviewProgress" class="sync-preview-progress" role="status" aria-live="polite">
      <div style="display:flex;align-items:center;gap:12px;">
        <strong id="syncPreviewProgressText" style="color:var(--text-primary);font-size:13px;">Preparing review...</strong>
        <span id="syncPreviewProgressPercent" style="margin-left:auto;color:var(--text-dim);font-size:12px;"></span>
      </div>
      <div id="syncPreviewProgressTrack" class="sync-preview-progress-track" role="progressbar" aria-label="Preparing pending-change review" aria-valuemin="0">
        <div id="syncPreviewProgressBar" class="sync-preview-progress-bar"></div>
      </div>
      <div id="syncPreviewProgressDetail" style="color:var(--text-ghost);font-size:11px;"></div>
    </div>
    <div id="syncPreviewContent">Loading...</div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
      <button id="syncPreviewDiscardAllButton" onclick="discardAllChanges()" style="background:none;color:var(--danger);border:1px solid var(--danger);border-radius:4px;padding:6px 14px;font-size:12px;cursor:pointer;">Discard All</button>
      <button id="syncPreviewSyncButton" onclick="runVisibleSync()" style="background:var(--accent);color:var(--accent-text);border:none;border-radius:4px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:500;">Sync to XMP</button>
    </div>
  </div>
</div>

<style>
  .sync-review-note {
    margin: 0 0 14px;
    padding: 10px 12px;
    border: 1px solid var(--border-secondary);
    border-radius: 6px;
    background: var(--bg-tertiary);
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.45;
  }
  .sync-review-groups { display: flex; flex-direction: column; gap: 12px; }
  .sync-review-group {
    padding: 14px;
    border: 1px solid var(--border-subtle);
    border-radius: 7px;
    background: var(--bg-primary);
  }
  .sync-review-group-header { display: flex; align-items: flex-start; gap: 10px; }
  .sync-review-group-title { color: var(--text-primary); font-size: 14px; font-weight: 650; }
  .sync-review-delta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 7px;
    color: var(--text-primary);
    font-size: 13px;
  }
  .sync-review-before { color: var(--text-dim); }
  .sync-review-arrow { color: var(--text-ghost); }
  .sync-review-after { color: var(--text-primary); font-weight: 600; }
  .sync-review-detail { margin-top: 4px; color: var(--text-dim); font-size: 11px; }
  .sync-review-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .sync-preview-photo { position: relative; min-width: 0; max-width: 100%; }
  .sync-preview-photo img { max-width: 100%; }
  .sync-preview-filename {
    margin-top: 5px;
    padding-right: 20px;
    overflow: hidden;
    color: var(--text-ghost);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sync-preview-discard {
    position: absolute;
    right: 0;
    bottom: -2px;
    border: 0;
    background: none;
    color: var(--text-ghost);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .sync-preview-discard:hover { color: var(--danger); }
  .sync-preview-progress {
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border-secondary);
    border-radius: 6px;
    background: var(--bg-tertiary);
  }
  .sync-preview-progress-track {
    height: 5px;
    margin: 8px 0 6px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--border-primary);
  }
  .sync-preview-progress-bar {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 180ms ease-out;
  }
  .sync-preview-progress-bar.is-preparing {
    width: 32%;
    animation: sync-preview-preparing 1.2s ease-in-out infinite alternate;
  }
  @keyframes sync-preview-preparing {
    from { transform: translateX(-85%); }
    to { transform: translateX(300%); }
  }
  #syncPreviewOverlay button:disabled {
    cursor: not-allowed !important;
    opacity: 0.45;
  }
  .sync-lightbox-action:disabled {
    cursor: not-allowed !important;
    opacity: 0.45;
  }
  .sync-preview-more {
    margin-top: 12px;
    padding: 10px;
    border: 1px dashed var(--border-secondary);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }
</style>

<script>
/* ---------- Sync Panel ---------- */

var _syncPreviewData = null;
var _syncThumbSize = 120;
var _syncActiveFilters = null;
var _syncModalOpen = false;
var _syncEscToken = null;
var _syncLightboxPanelEl = null;
var _syncPreviewLoading = false;
// Distinct "the load finished cleanly" flag. `_syncPreviewLoading` also
// goes false on partial-load failure, so re-renders (filter toggle, Show
// More) would otherwise re-enable Sync / Discard on a truncated queue.
var _syncPreviewComplete = false;
var _syncPreviewLoadToken = 0;
var _syncPreviewAbortController = null;
var _syncPreviewStartedAt = 0;
var _syncPreviewElapsedTimer = null;
var _syncPreviewDisplayLimit = 300;
var _syncActiveJob = null;
var _syncReviewWaiting = false;
var _syncStatusTimer = null;
var _syncStatusRequest = null;

function _syncProgressText(p) {
  if (!p || !p.total) return (p && (p.current_file || p.phase)) || 'Preparing XMP sync...';
  var text = 'Processed ' + p.current.toLocaleString() + ' of ' + p.total.toLocaleString() + ' photos';
  if (typeof p.synced === 'number' && typeof p.failed === 'number') {
    text += ' · ' + p.synced.toLocaleString() + ' synced · ' + p.failed.toLocaleString() + ' with errors';
  }
  return text;
}

function _syncScheduleStatus() {
  if (_syncStatusTimer !== null) return;
  _syncStatusTimer = setTimeout(function() {
    _syncStatusTimer = null;
    void checkPendingSync();
  }, 2000);
}

function _syncShowActiveJob(job) {
  _syncActiveJob = job;
  _syncScheduleStatus();
  if (!_syncModalOpen) return;
  if (!_syncReviewWaiting) {
    _syncStopPreviewLoad();
    _syncPreviewData = null;
    _syncReviewWaiting = true;
    _syncSetPreviewActionsEnabled(false);
    document.getElementById('syncPreviewContent').textContent =
      'Sync is running. The remaining changes will be ready to review when it finishes.';
  }
  var p = job.progress || {};
  var pct = p.total > 0 ? Math.min(100, Math.round(p.current * 100 / p.total)) : 0;
  document.getElementById('syncPreviewProgress').style.display = 'block';
  var text = document.getElementById('syncPreviewProgressText');
  text.textContent = _syncProgressText(p);
  text.style.color = 'var(--text-primary)';
  document.getElementById('syncPreviewProgressPercent').textContent = p.total ? pct + '%' : '';
  var track = document.getElementById('syncPreviewProgressTrack');
  track.setAttribute('aria-label', 'XMP sync progress');
  track.setAttribute('aria-valuemax', String(p.total || 100));
  track.setAttribute('aria-valuenow', String(p.current || 0));
  var bar = document.getElementById('syncPreviewProgressBar');
  bar.classList.toggle('is-preparing', !p.total);
  bar.style.width = p.total ? pct + '%' : '32%';
  document.getElementById('syncPreviewProgressDetail').textContent =
    'Progress is saved periodically. Changes with errors stay pending.';
}

async function checkPendingSync() {
  if (_syncStatusRequest) return _syncStatusRequest;
  _syncStatusRequest = _syncRefreshStatus();
  try { return await _syncStatusRequest; }
  finally { _syncStatusRequest = null; }
}

async function _syncRefreshStatus() {
  try {
    var data = await safeFetch('/api/sync/status', {}, { toast: false });
    var banner = document.getElementById('syncBanner');
    _syncActiveJob = data.active_job || null;
    if (_syncActiveJob) {
      _syncShowActiveJob(_syncActiveJob);
      var activeStatus = document.getElementById('syncStatus');
      activeStatus.textContent = _syncProgressText(_syncActiveJob.progress);
      activeStatus.dataset.syncState = 'running';
      activeStatus.style.color = 'var(--text-dim)';
    } else if (_syncReviewWaiting && _syncModalOpen) {
      _syncReviewWaiting = false;
      void _syncStartPreviewLoad(0);
    }
    if (data.pending_count > 0 || _syncActiveJob) {
      var status = document.getElementById('syncStatus');
      // A stale success message ("Synced!", "Synced N photos!" from a
      // partial run that left the unchecked change types queued, or
      // "Nothing to sync." from a run that found nothing when there is
      // now something) alongside a nonzero pending count reads as a UI
      // bug. Match the state we set on the element, not the specific
      // words, so future copy changes cannot desync this check.
      if (status.dataset.syncState === 'success') {
        status.textContent = '';
        status.style.color = 'var(--text-dim)';
        status.dataset.syncState = '';
      }
      document.getElementById('syncBannerText').textContent =
        data.pending_count.toLocaleString() + ' change' + (data.pending_count !== 1 ? 's' : '') +
        ' across ' + data.pending_photo_count.toLocaleString() + ' photo' + (data.pending_photo_count !== 1 ? 's' : '') +
        (data.active_job
          ? ' — awaiting sync confirmation; counts update periodically during sync.'
          : ' — metadata changes have been saved in Vireo but not written to XMP sidecar files yet.');
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }
    if (!_syncActiveJob && document.getElementById('syncStatus').dataset.syncState === 'running') {
      document.getElementById('syncStatus').textContent = 'Sync finished. Review remaining changes for any errors.';
      document.getElementById('syncStatus').dataset.syncState = '';
    }
    return data;
  } catch(e) {
    if (_syncActiveJob || _syncReviewWaiting) _syncScheduleStatus();
  }
}

async function runSync(changeIds) {
  var status = document.getElementById('syncStatus');
  status.textContent = 'Syncing...';
  status.style.color = 'var(--text-dim)';
  // Any state from the previous run is now stale.
  status.dataset.syncState = '';
  try {
    var requestOptions = {method: 'POST'};
    if (Array.isArray(changeIds)) {
      if (changeIds.length === 0) {
        status.textContent = 'No checked changes to sync.';
        status.style.color = 'var(--text-dim)';
        return;
      }
      requestOptions.headers = {'Content-Type': 'application/json'};
      requestOptions.body = JSON.stringify({change_ids: changeIds});
    }
    var data = await safeFetch('/api/jobs/sync', requestOptions, { toast: false });
    void checkPendingSync();
    var lastCheckpoint = 0;

    safeEventSource('/api/jobs/' + data.job_id + '/stream', {
      onProgress: function(p) {
        status.textContent = _syncProgressText(p);
        status.dataset.syncState = 'running';
        if (_syncActiveJob && _syncActiveJob.id === data.job_id) {
          _syncActiveJob.progress = p;
          _syncShowActiveJob(_syncActiveJob);
        }
        if (p.checkpoint > lastCheckpoint) {
          lastCheckpoint = p.checkpoint;
          void checkPendingSync();
        }
      },
      onComplete: function(event) {
        // Report what reached the sidecars, not merely that the job ran. A
        // NAS that rejects every write finishes the job normally; saying
        // "Synced!" over it is why a stuck banner looks like a UI bug.
        var result = (event && event.result) || null;
        // A sync that raised before returning — a failing get_pending_changes
        // or clear_pending — completes with a null result. Defaulting the
        // counters to zero there would claim "failed on 0" over a fatal
        // error. Gate on the counters themselves rather than on the status,
        // so a resultless completed or cancelled event cannot slip through
        // either, and so a result object without them never reads as zero.
        var counted = !!result && typeof result.synced === 'number'
          && typeof result.failed === 'number';
        var synced = counted ? result.synced : 0;
        var failed = counted ? result.failed : 0;
        var reasons = (event && event.errors && event.errors.length)
          ? event.errors
          : ((result && result.errors) || []);
        // Assign unconditionally: a stale tooltip from an earlier partial
        // failure must not survive a later clean run.
        status.title = reasons.join('\n');
        if (!counted) {
          // The run never established any counts. Name the fatal cause and
          // say only what is actually known: when clear_pending is what
          // failed, sidecars really were written, so "Wrote 0" would be a
          // lie and "Changes stay pending" alone would hide the writes.
          var why = (event && event.failure && event.failure.message)
            || reasons[0] || '';
          if (event.status === 'cancelled') {
            status.textContent = 'Sync cancelled before it reported results.';
            status.style.color = 'var(--text-dim)';
            status.dataset.syncState = 'cancelled';
          } else {
            status.textContent = 'Sync failed'
              + (why ? ': ' + why : ' (no detail reported)')
              + '. Sidecars already written stay written; everything else '
              + 'stays pending.';
            status.style.color = 'var(--danger)';
            status.dataset.syncState = 'failure';
          }
        } else if (event.status === 'cancelled') {
          // sync_to_xmp() does not poll cancellation inside its per-photo
          // loop, so a cancel requested mid-run still returns a structured
          // result and any writes that failed before the cancel took hold
          // must be surfaced. Reporting only ``N written`` would present a
          // NAS-wide permission failure as an ordinary cancellation.
          var cancelledMsg = 'Sync cancelled — ' + synced.toLocaleString() + ' written';
          if (failed > 0) {
            cancelledMsg += ', failed on ' + failed.toLocaleString();
            if (reasons.length) cancelledMsg += ' — ' + reasons[0];
          }
          status.textContent = cancelledMsg + '.';
          status.style.color = failed > 0 ? 'var(--danger)' : 'var(--text-dim)';
          status.dataset.syncState = failed > 0 ? 'failure' : 'cancelled';
        } else if (failed === 0 && event.status === 'completed') {
          status.textContent = synced > 0
            ? 'Synced ' + synced.toLocaleString() + ' photo' + (synced === 1 ? '' : 's') + '!'
            : 'Nothing to sync.';
          status.style.color = 'var(--accent)';
          status.dataset.syncState = 'success';
        } else {
          status.textContent = 'Wrote ' + synced.toLocaleString() + ', failed on '
            + failed.toLocaleString() + (reasons.length ? ' — ' + reasons[0] : '')
            + '. Changes stay pending.';
          status.style.color = 'var(--danger)';
          status.dataset.syncState = 'failure';
        }
        setTimeout(checkPendingSync, 1000);
      },
      onError: function() {
        status.textContent = 'Connection lost';
        status.style.color = 'var(--danger)';
      }
    });
  } catch(e) {
    status.textContent = 'Error: ' + e.message;
  }
}

function updateSyncThumbSize(val) {
  _syncThumbSize = parseInt(val);
  document.getElementById('syncThumbSizeVal').textContent = val + 'px';
  document.querySelectorAll('.sync-preview-photo').forEach(function(photo) {
    photo.style.width = _syncThumbSize + 'px';
  });
  document.querySelectorAll('.sync-preview-thumb').forEach(function(img) {
    img.style.width = _syncThumbSize + 'px';
    img.style.height = Math.round(_syncThumbSize * 2 / 3) + 'px';
  });
}

function _syncElapsedText() {
  if (!_syncPreviewStartedAt) return '';
  var seconds = Math.max(0, Math.round((Date.now() - _syncPreviewStartedAt) / 1000));
  if (seconds < 60) return seconds + 's elapsed';
  return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's elapsed';
}

function _syncSetPreviewActionsEnabled(enabled) {
  var bottomDiscard = document.getElementById('syncPreviewDiscardAllButton');
  var bottomSync = document.getElementById('syncPreviewSyncButton');
  if (bottomDiscard) bottomDiscard.disabled = !enabled;
  if (bottomSync) bottomSync.disabled = !enabled;
  document.querySelectorAll('#syncPreviewContent .sync-preview-action').forEach(function(button) {
    button.disabled = !enabled;
  });
}

function _syncUpdatePreviewProgress(state, errorMessage) {
  var box = document.getElementById('syncPreviewProgress');
  var text = document.getElementById('syncPreviewProgressText');
  var percent = document.getElementById('syncPreviewProgressPercent');
  var track = document.getElementById('syncPreviewProgressTrack');
  var bar = document.getElementById('syncPreviewProgressBar');
  var detail = document.getElementById('syncPreviewProgressDetail');
  if (!box || !text || !percent || !track || !bar || !detail) return;
  box.style.display = 'block';

  var loaded = _syncPreviewData && _syncPreviewData.photos
    ? _syncPreviewData.photos.length : 0;
  var total = _syncPreviewData ? (_syncPreviewData.total_photos || 0) : 0;
  var pct = total > 0 ? Math.min(100, Math.round(loaded * 100 / total)) : 0;
  bar.classList.remove('is-preparing');
  if (total > 0) {
    track.setAttribute('aria-valuemax', String(total));
    track.setAttribute('aria-valuenow', String(loaded));
  } else {
    track.removeAttribute('aria-valuemax');
    track.removeAttribute('aria-valuenow');
  }

  if (state === 'error') {
    text.textContent = 'Could not finish preparing the review';
    text.style.color = 'var(--danger)';
    percent.textContent = '';
    bar.style.width = pct + '%';
    detail.textContent = errorMessage || 'Try closing and reopening the review.';
    return;
  }
  text.style.color = 'var(--text-primary)';
  if (state === 'complete') {
    text.textContent = total === 0
      ? 'No pending changes'
      : 'Review ready — ' + total.toLocaleString() + ' photos checked';
    percent.textContent = total > 0 ? '100%' : '';
    bar.style.width = total > 0 ? '100%' : '0';
    detail.textContent = total > 0
      ? 'All results are loaded. Sync and discard actions are now available. · ' + _syncElapsedText()
      : '';
    return;
  }
  if (total > 0) {
    text.textContent = 'Reviewing XMP metadata — ' + loaded.toLocaleString() + ' of ' + total.toLocaleString() + ' photos';
    percent.textContent = pct + '%';
    bar.style.width = pct + '%';
    detail.textContent = 'Completed results are available below while Vireo reads the next batch. · ' + _syncElapsedText();
  } else {
    text.textContent = 'Preparing pending-change summary...';
    percent.textContent = '';
    bar.style.width = '32%';
    bar.classList.add('is-preparing');
    detail.textContent = 'The first results will appear as soon as they are ready. · ' + _syncElapsedText();
  }
}

function _syncStopPreviewLoad() {
  _syncPreviewLoadToken++;
  if (_syncPreviewAbortController) {
    _syncPreviewAbortController.abort();
    _syncPreviewAbortController = null;
  }
  if (_syncPreviewElapsedTimer !== null) {
    clearInterval(_syncPreviewElapsedTimer);
    _syncPreviewElapsedTimer = null;
  }
  _syncPreviewLoading = false;
  _syncPreviewComplete = false;
}

async function _syncStartPreviewLoad(restartCount) {
  restartCount = restartCount || 0;
  _syncStopPreviewLoad();
  _syncReviewWaiting = false;
  document.getElementById('syncPreviewProgressTrack').setAttribute('aria-label', 'Preparing pending-change review');
  var loadToken = _syncPreviewLoadToken;
  _syncPreviewAbortController = new AbortController();
  _syncPreviewStartedAt = Date.now();
  _syncPreviewDisplayLimit = 300;
  _syncPreviewLoading = true;
  _syncPreviewData = null;
  _syncSetPreviewActionsEnabled(false);
  document.getElementById('syncPreviewContent').innerHTML =
    '<p style="color:var(--text-dim);padding:20px;">Waiting for the first results...</p>';
  _syncUpdatePreviewProgress('loading');
  _syncPreviewElapsedTimer = setInterval(function() {
    if (_syncPreviewLoading && loadToken === _syncPreviewLoadToken) {
      _syncUpdatePreviewProgress('loading');
    }
  }, 1000);

  var offset = 0;
  var revision = null;
  var firstPage = true;
  try {
    var summary = await safeFetch('/api/sync/status', {
      signal: _syncPreviewAbortController.signal,
    }, { toast: false });
    if (loadToken !== _syncPreviewLoadToken || !_syncModalOpen) return;
    if (summary.active_job) {
      _syncShowActiveJob(summary.active_job);
      return;
    }
    _syncPreviewData = {
      photos: [],
      total_changes: summary.pending_count || 0,
      total_photos: summary.pending_photo_count || 0,
      change_type_counts: summary.change_type_counts || {},
    };
    _syncActiveFilters = new Set(Object.keys(_syncPreviewData.change_type_counts));
    renderSyncPreview();
    _syncUpdatePreviewProgress('loading');

    while (_syncModalOpen) {
      var pageSize = firstPage ? 25 : 100;
      var url = '/api/sync/preview?limit=' + pageSize + '&offset=' + offset;
      if (revision) url += '&revision=' + encodeURIComponent(revision);
      var page = await safeFetch(url, {
        signal: _syncPreviewAbortController.signal,
      }, { toast: false });
      if (loadToken !== _syncPreviewLoadToken || !_syncModalOpen) return;

      if (firstPage) {
        revision = page.revision;
        _syncPreviewData = {
          photos: [],
          total_changes: page.total_changes,
          total_photos: page.total_photos,
          change_type_counts: page.change_type_counts || {},
          location_sync_enabled: page.location_sync_enabled,
          location_keyword_sync_enabled: page.location_keyword_sync_enabled,
          revision: page.revision,
        };
        _syncActiveFilters = new Set(Object.keys(_syncPreviewData.change_type_counts));
      }
      Array.prototype.push.apply(_syncPreviewData.photos, page.photos || []);
      offset = page.next_offset;
      firstPage = false;
      if (!page.has_more) {
        _syncPreviewLoading = false;
        _syncPreviewComplete = true;
      }
      renderSyncPreview();
      _syncUpdatePreviewProgress(page.has_more ? 'loading' : 'complete');

      if (!page.has_more) {
        _syncSetPreviewActionsEnabled(_syncPreviewData.total_changes > 0);
        if (_syncPreviewElapsedTimer !== null) {
          clearInterval(_syncPreviewElapsedTimer);
          _syncPreviewElapsedTimer = null;
        }
        return;
      }
      // Let WebKit paint the completed batch before requesting the next one.
      await new Promise(function(resolve) { setTimeout(resolve, 0); });
    }
  } catch(e) {
    if (loadToken !== _syncPreviewLoadToken || (e && e.name === 'AbortError')) return;
    if (e && e.code === 'sync_in_progress') {
      var status = await checkPendingSync();
      if (loadToken !== _syncPreviewLoadToken || !_syncModalOpen) return;
      if (status && status.active_job) return;
      if (status && restartCount < 1) return _syncStartPreviewLoad(restartCount + 1);
    }
    if (e && e.code === 'sync_preview_changed' && restartCount < 1) {
      document.getElementById('syncPreviewProgressDetail').textContent =
        'Pending changes were updated; restarting with a fresh snapshot...';
      return _syncStartPreviewLoad(restartCount + 1);
    }
    _syncPreviewLoading = false;
    _syncSetPreviewActionsEnabled(false);
    _syncUpdatePreviewProgress('error', e && e.message);
  }
}

async function openSyncPreview() {
  VireoViewPreferences.restore(document.getElementById('syncThumbSize'));
  updateSyncThumbSize(document.getElementById('syncThumbSize').value);
  var alreadyOpen = _syncModalOpen;
  if (_syncEscToken !== null) Keymap.popEsc(_syncEscToken);
  _syncEscToken = Keymap.pushEsc(function() { closeSyncPreview(); });
  if (!alreadyOpen) Keymap.lockBodyScroll();
  _syncActiveFilters = null;
  _syncModalOpen = true;
  var overlay = document.getElementById('syncPreviewOverlay');
  overlay.style.display = 'block';
  await _syncStartPreviewLoad(0);
}

function _syncTypeLabel(type) {
  return {
    keyword_add: 'Keyword additions',
    keyword_merge: 'Keyword merges',
    keyword_remove: 'Keyword removals',
    keyword_remove_flat: 'Keyword removals',
    rating: 'Ratings',
    flag: 'Flags',
    location: 'Locations',
    edit_recipe: 'Photo edits'
  }[type] || type.replace(/_/g, ' ');
}

function _syncChangeStyle(change) {
  if (change.type === 'keyword_add') return { icon: '+', color: 'var(--accent)' };
  if (change.type === 'keyword_remove' || change.type === 'keyword_remove_flat') {
    return { icon: '\u2212', color: 'var(--danger)' };
  }
  return { icon: '~', color: 'var(--warning)' };
}

function _syncChangePresentation(change, photo, activeFilters) {
  if (change.rating_requires_sidecar && photo) {
    var sidecarWillExist = photo.changes.some(function(other) {
      return other.id !== change.id &&
        other.creates_xmp_sidecar &&
        (!activeFilters || activeFilters.has(other.type));
    });
    if (sidecarWillExist && change.presentation_with_sidecar) {
      return change.presentation_with_sidecar;
    }
    if (!sidecarWillExist && change.presentation_without_sidecar) {
      return change.presentation_without_sidecar;
    }
  }
  if (change.presentation) return change.presentation;
  return {
    field: change.type.replace(/_/g, ' '),
    action: 'updated',
    before: 'Current XMP value',
    after: change.value || 'Cleared'
  };
}

function _syncGroupedChanges(data, activeFilters) {
  var groups = [];
  var groupsByKey = {};
  data.photos.forEach(function(photo) {
    photo.changes.forEach(function(change) {
      if (!activeFilters.has(change.type)) return;
      var presentation = _syncChangePresentation(change, photo, activeFilters);
      var key = JSON.stringify([
        change.type,
        presentation.field,
        presentation.action,
        presentation.before,
        presentation.after,
        presentation.before_detail || '',
        presentation.after_detail || ''
      ]);
      var group = groupsByKey[key];
      if (!group) {
        group = {
          type: change.type,
          presentation: presentation,
          entries: []
        };
        groupsByKey[key] = group;
        groups.push(group);
      }
      group.entries.push({ photo: photo, change: change });
    });
  });
  return groups;
}

function _syncGroupTitle(group, partial) {
  var count = group.entries.length;
  var photoWord = count === 1 ? 'photo' : 'photos';
  var presentation = group.presentation;
  var connector = {
    added: 'added to',
    removed: 'removed from',
    updated: 'updated on',
    cleared: 'cleared from',
    checked: 'checked on',
    unchanged: 'unchanged on'
  }[presentation.action] || presentation.action + ' on';
  return presentation.field + ' ' + connector + ' ' + count + ' ' + photoWord +
    (partial ? ' reviewed so far' : '');
}

function renderSyncPreview() {
  var data = _syncPreviewData;
  var content = document.getElementById('syncPreviewContent');
  if (!data) return;
  if (data.photos.length === 0 && _syncPreviewLoading) {
    content.innerHTML = '<p style="color:var(--text-dim);padding:20px;">Waiting for the first results...</p>';
    return;
  }
  if (data.photos.length === 0) {
    content.innerHTML = '<p style="color:var(--text-dim);padding:20px;">No pending changes.</p>';
    return;
  }

  var allTypes = {};
  Object.keys(data.change_type_counts || {}).forEach(function(type) {
    allTypes[type] = true;
  });
  if (Object.keys(allTypes).length === 0) {
    data.photos.forEach(function(photo) {
      photo.changes.forEach(function(change) { allTypes[change.type] = true; });
    });
  }
  var typeList = Object.keys(allTypes).sort();
  if (_syncActiveFilters === null) _syncActiveFilters = new Set(typeList);

  var html = '<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">';
  html += '<span style="font-size:12px;color:var(--text-dim);">Include:</span>';
  typeList.forEach(function(type) {
    var style = _syncChangeStyle({ type: type });
    var checked = _syncActiveFilters.has(type) ? ' checked' : '';
    html += '<label style="display:flex;align-items:center;gap:4px;font-size:12px;color:' + style.color + ';cursor:pointer;">' +
      '<input type="checkbox"' + checked + ' onchange="toggleSyncFilter(\'' + type + '\')" style="accent-color:' + style.color + ';"> ' +
      escapeHtml(_syncTypeLabel(type)) + '</label>';
  });
  html += '</div>';

  var visibleCount = 0;
  var visiblePhotos = 0;
  data.photos.forEach(function(photo) {
    var visible = photo.changes.filter(function(change) {
      return _syncActiveFilters.has(change.type);
    });
    if (visible.length > 0) visiblePhotos++;
    visibleCount += visible.length;
  });

  var changeWord = visibleCount === 1 ? 'change' : 'changes';
  var photoWord = visiblePhotos === 1 ? 'photo' : 'photos';
  var reviewedSuffix = _syncPreviewLoading ? ' reviewed so far' : '';
  var actionsDisabled = _syncPreviewComplete ? '' : ' disabled';
  html += '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">' +
    '<span style="font-size:12px;color:var(--text-dim);flex:1;">' + visibleCount.toLocaleString() + ' ' + changeWord + ' across ' + visiblePhotos.toLocaleString() + ' ' + photoWord + reviewedSuffix + '</span>' +
    '<button class="sync-preview-action" onclick="discardAllChanges()"' + actionsDisabled + ' style="background:none;color:var(--danger);border:1px solid var(--danger);border-radius:4px;padding:4px 12px;font-size:11px;cursor:pointer;">Discard All</button>' +
    '<button class="sync-preview-action" onclick="runVisibleSync()"' + actionsDisabled + ' style="background:var(--accent);color:var(--accent-text);border:none;border-radius:4px;padding:4px 12px;font-size:11px;cursor:pointer;font-weight:500;">Sync to XMP</button>' +
  '</div>';

  if (_syncActiveFilters.has('location') && allTypes.location) {
    var locationNotes = [];
    locationNotes.push(data.location_sync_enabled
      ? 'A location keyword with coordinates is written to XMP as GPS metadata.'
      : 'Writing assigned GPS to XMP is turned off in Settings; sync only removes GPS previously written by Vireo.');
    locationNotes.push(data.location_keyword_sync_enabled
      ? 'The place and its parent places are written as XMP keywords (the place in dc:subject, the full path in lr:hierarchicalSubject), so a catalog app reading the sidecar lists it as a keyword.'
      : 'Writing location keywords to XMP is turned off in Settings, so place names stay in Vireo; sync only removes location keywords Vireo wrote earlier.');
    html += '<div class="sync-review-note"><strong style="color:var(--text-primary);">About location sync:</strong> '
      + locationNotes.join(' ') + '</div>';
  }

  var groups = _syncGroupedChanges(data, _syncActiveFilters);
  html += '<div class="sync-review-groups">';
  var displayRemaining = _syncPreviewDisplayLimit;
  var hiddenEntries = 0;
  groups.forEach(function(group) {
    var displayedEntries = group.entries.slice(0, Math.max(0, displayRemaining));
    displayRemaining -= displayedEntries.length;
    hiddenEntries += group.entries.length - displayedEntries.length;
    if (displayedEntries.length === 0) return;
    var presentation = group.presentation;
    var style = _syncChangeStyle({ type: group.type });
    var ids = group.entries.map(function(entry) { return entry.change.id; });
    html += '<section class="sync-review-group">';
    html += '<div class="sync-review-group-header">';
    html += '<span style="color:' + style.color + ';font-weight:700;font-size:17px;width:16px;text-align:center;">' + style.icon + '</span>';
    html += '<div style="flex:1;min-width:0;">';
    html += '<div class="sync-review-group-title">' + escapeHtml(_syncGroupTitle(group, _syncPreviewLoading)) + '</div>';
    html += '<div class="sync-review-delta"><span class="sync-review-before">' + escapeHtml(presentation.before) + '</span><span class="sync-review-arrow">\u2192</span><span class="sync-review-after">' + escapeHtml(presentation.after) + '</span></div>';
    if (presentation.before_detail) {
      html += '<div class="sync-review-detail">Before: ' + escapeHtml(presentation.before_detail) + '</div>';
    }
    if (presentation.after_detail) {
      html += '<div class="sync-review-detail">' + escapeHtml(presentation.after_detail) + '</div>';
    }
    html += '</div>';
    html += '<button class="sync-preview-action" onclick="discardSyncChanges([' + ids.join(',') + '])"' + actionsDisabled + ' style="background:none;border:none;color:var(--text-ghost);font-size:11px;cursor:pointer;white-space:nowrap;" title="Discard this group">Discard group</button>';
    html += '</div>';
    html += '<div class="sync-review-photos">';
    displayedEntries.forEach(function(entry) {
      var photo = entry.photo;
      var change = entry.change;
      var thumbUrl = window.vireoThumbnailUrl
        ? window.vireoThumbnailUrl(photo)
        : '/thumbnails/' + photo.photo_id + '.jpg';
      html += '<div class="sync-preview-photo" style="width:' + _syncThumbSize + 'px;">';
      html += '<img class="sync-preview-thumb" src="' + escapeAttr(thumbUrl) + '" loading="lazy" decoding="async" style="width:' + _syncThumbSize + 'px;height:' + Math.round(_syncThumbSize * 2 / 3) + 'px;object-fit:cover;border-radius:4px;cursor:pointer;display:block;" data-photo-id="' + photo.photo_id + '" data-filename="' + escapeAttr(photo.filename) + '">';
      html += '<div class="sync-preview-filename" title="' + escapeAttr(photo.filename) + '">' + escapeHtml(photo.filename) + '</div>';
      html += '<button class="sync-preview-discard sync-preview-action" onclick="event.stopPropagation();discardChange(' + change.id + ')"' + actionsDisabled + ' title="Discard this change" aria-label="Discard change for ' + escapeAttr(photo.filename) + '">&times;</button>';
      html += '</div>';
    });
    html += '</div></section>';
  });
  html += '</div>';
  if (hiddenEntries > 0) {
    html += '<div class="sync-preview-more">Showing the first ' +
      (_syncPreviewDisplayLimit - displayRemaining).toLocaleString() + ' matching results to keep this review responsive. ' +
      '<button onclick="showMoreSyncPreview()" style="margin-left:8px;padding:4px 10px;border:1px solid var(--border-secondary);border-radius:4px;background:var(--bg-secondary);color:var(--text-primary);cursor:pointer;">Show ' +
      Math.min(300, hiddenEntries).toLocaleString() + ' more</button></div>';
  }

  content.innerHTML = html;
  _syncSetPreviewActionsEnabled(
    _syncPreviewComplete && (_syncPreviewData.total_changes || 0) > 0
  );
  if (_syncLightboxPanelEl && typeof _lightboxCurrentId !== 'undefined') {
    _syncRenderLightboxPanel(_lightboxCurrentId);
  }
}

function showMoreSyncPreview() {
  _syncPreviewDisplayLimit += 300;
  renderSyncPreview();
}

/* Delegate sync preview thumb clicks for lightbox (XSS-safe) */
document.getElementById('syncPreviewContent').addEventListener('click', function(e) {
  var thumb = e.target.closest('img[data-photo-id]');
  if (!thumb) return;
  // Pass the list of currently-visible photos so the lightbox arrows can navigate
  // between pending-change items. Without this, _lightboxPhotoList stays empty
  // and lightboxNav() bails out immediately.
  var photoList = [];
  if (_syncPreviewData && _syncPreviewData.photos && _syncActiveFilters) {
    _syncPreviewData.photos.forEach(function(p) {
      var hasVisible = p.changes.some(function(c) { return _syncActiveFilters.has(c.type); });
      if (hasVisible) photoList.push({ id: p.photo_id, filename: p.filename });
    });
  }
  openLightbox(parseInt(thumb.dataset.photoId, 10), thumb.dataset.filename || '', photoList);
});

function closeSyncPreview() {
  var wasOpen = _syncModalOpen;
  _syncReviewWaiting = false;
  _syncStopPreviewLoad();
  if (_syncEscToken !== null) {
    Keymap.popEsc(_syncEscToken);
    _syncEscToken = null;
  }
  document.getElementById('syncPreviewOverlay').style.display = 'none';
  _syncModalOpen = false;
  _syncDestroyLightboxPanel();
  if (wasOpen) Keymap.unlockBodyScroll();
  checkPendingSync();
}

function getVisibleSyncChangeIds() {
  var ids = [];
  if (!_syncPreviewData || !_syncPreviewData.photos || !_syncActiveFilters) return ids;
  _syncPreviewData.photos.forEach(function(p) {
    p.changes.forEach(function(c) {
      if (_syncActiveFilters.has(c.type)) ids.push(c.id);
    });
  });
  return ids;
}

function runVisibleSync() {
  if (!_syncPreviewComplete) return;
  var changeIds = getVisibleSyncChangeIds();
  if (changeIds.length === 0) {
    var status = document.getElementById('syncStatus');
    status.textContent = 'No checked changes to sync.';
    status.style.color = 'var(--text-dim)';
    return;
  }
  closeSyncPreview();
  runSync(changeIds);
}

function _syncFindPhotoData(photoId) {
  if (!_syncPreviewData || !_syncPreviewData.photos) return null;
  return _syncPreviewData.photos.find(function(p) { return p.photo_id === photoId; }) || null;
}

function _syncVisibleChangesFor(photo) {
  if (!photo) return [];
  if (!_syncActiveFilters) return photo.changes.slice();
  return photo.changes.filter(function(c) { return _syncActiveFilters.has(c.type); });
}

function _syncEnsureLightboxPanel() {
  if (_syncLightboxPanelEl && _syncLightboxPanelEl.parentNode) return _syncLightboxPanelEl;
  var overlay = document.getElementById('lightboxOverlay');
  if (!overlay) return null;
  var panel = document.createElement('div');
  panel.id = 'syncLightboxPanel';
  panel.style.cssText = 'position:absolute;top:56px;right:16px;max-width:340px;background:rgba(0,0,0,0.7);color:var(--text-primary);border:1px solid var(--border-secondary);border-radius:6px;padding:10px 12px;font-size:12px;z-index:10002;box-shadow:0 4px 16px rgba(0,0,0,0.5);';
  // Handle discard clicks on the panel itself: we stopPropagation() so the
  // lightbox overlay's onclick doesn't close the lightbox out from under the
  // user, which means a document-level delegate would never see these events.
  panel.addEventListener('click', function(e) {
    var changeBtn = e.target.closest('button[data-sync-discard-change]');
    if (changeBtn) {
      var changeId = parseInt(changeBtn.getAttribute('data-sync-discard-change'), 10);
      if (!isNaN(changeId)) _syncDiscardFromLightbox([changeId], _lightboxCurrentId);
    } else {
      var photoBtn = e.target.closest('button[data-sync-discard-photo]');
      if (photoBtn) {
        var pid = parseInt(photoBtn.getAttribute('data-sync-discard-photo'), 10);
        var photo = _syncFindPhotoData(pid);
        if (photo) {
          var ids = _syncVisibleChangesFor(photo).map(function(c) { return c.id; });
          _syncDiscardFromLightbox(ids, pid);
        }
      }
    }
    e.stopPropagation();
  });
  overlay.appendChild(panel);
  _syncLightboxPanelEl = panel;
  return panel;
}

function _syncDestroyLightboxPanel() {
  if (_syncLightboxPanelEl && _syncLightboxPanelEl.parentNode) {
    _syncLightboxPanelEl.parentNode.removeChild(_syncLightboxPanelEl);
  }
  _syncLightboxPanelEl = null;
}

function _syncRenderLightboxPanel(photoId) {
  if (!_syncModalOpen) { _syncDestroyLightboxPanel(); return; }
  var photo = _syncFindPhotoData(photoId);
  var visible = _syncVisibleChangesFor(photo);
  if (!photo || visible.length === 0) {
    _syncDestroyLightboxPanel();
    return;
  }
  var panel = _syncEnsureLightboxPanel();
  if (!panel) return;
  var actionsDisabled = _syncPreviewComplete ? '' : ' disabled';
  var html = '<div style="font-weight:600;margin-bottom:6px;color:var(--accent);">Pending changes</div>';
  visible.forEach(function(c) {
    var style = _syncChangeStyle(c);
    var presentation = _syncChangePresentation(c, photo, _syncActiveFilters);
    html += '<div style="display:flex;align-items:flex-start;gap:6px;padding:5px 0;">' +
      '<span style="color:' + style.color + ';font-weight:700;width:12px;text-align:center;">' + style.icon + '</span>' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="color:var(--text-primary);font-weight:600;">' + escapeHtml(presentation.field) + '</div>' +
        '<div style="margin-top:2px;color:var(--text-dim);">' + escapeHtml(presentation.before) + ' \u2192 <span style="color:var(--text-primary);">' + escapeHtml(presentation.after) + '</span></div>' +
        (presentation.after_detail ? '<div style="margin-top:2px;color:var(--text-ghost);font-size:10px;">' + escapeHtml(presentation.after_detail) + '</div>' : '') +
      '</div>' +
      '<button class="sync-lightbox-action" data-sync-discard-change="' + c.id + '"' + actionsDisabled + ' style="background:none;border:none;color:var(--text-ghost);cursor:pointer;padding:0 4px;font-size:16px;line-height:1;" title="Discard this change">&times;</button>' +
      '</div>';
  });
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;">' +
    '<span style="font-size:11px;color:var(--text-dim);">Use ← → to navigate</span>' +
    '<button class="sync-lightbox-action" data-sync-discard-photo="' + photoId + '"' + actionsDisabled + ' style="background:none;border:1px solid var(--danger);color:var(--danger);border-radius:4px;font-size:11px;cursor:pointer;padding:3px 8px;">Discard all</button>' +
    '</div>';
  panel.innerHTML = html;
}

async function _syncDiscardFromLightbox(changeIds, photoId) {
  if (!_syncPreviewComplete || !changeIds || changeIds.length === 0) return;
  try {
    await safeFetch('/api/sync/discard', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ change_ids: changeIds }),
    });
  } catch(e) { return; }

  await _syncRefreshPreviewAfterDiscard(changeIds);

  var photoAfter = _syncFindPhotoData(photoId);
  var visibleAfter = _syncVisibleChangesFor(photoAfter);

  renderSyncPreview();

  if (visibleAfter.length > 0) {
    _syncRenderLightboxPanel(photoId);
    return;
  }

  // No more visible changes for this photo — advance the lightbox to the next
  // photo with visible changes, or close if none remain.
  var newList = [];
  if (_syncPreviewData && _syncPreviewData.photos) {
    _syncPreviewData.photos.forEach(function(p) {
      if (_syncVisibleChangesFor(p).length > 0) {
        newList.push({ id: p.photo_id, filename: p.filename });
      }
    });
  }
  var prevList = window._lightboxPhotoList || [];
  var prevIdx = prevList.findIndex(function(p) { return p.id === photoId; });
  if (newList.length === 0) {
    closeLightbox();
    return;
  }
  var nextIdx = prevIdx >= 0 ? Math.min(prevIdx, newList.length - 1) : 0;
  var next = newList[nextIdx];
  openLightbox(next.id, next.filename, newList);
}

document.addEventListener('lightbox:photochanged', function(e) {
  if (!_syncModalOpen) return;
  _syncRenderLightboxPanel(e.detail && e.detail.photoId);
});

document.addEventListener('lightbox:closed', function() {
  _syncDestroyLightboxPanel();
});

// Reload the progressive preview after a discard so derived flags (creates_xmp_sidecar,
// paired_keyword_rename) and per-change presentations reflect the new state.
// Discarding one half of a same-key keyword_add/keyword_remove pair
// invalidates the surviving remove's rename-pairing flags, and rating
// previews rely on those flags to decide whether a sidecar will be
// created; without the refetch, a rating queued alongside such a pair
// can look like it will be written and then be silently dropped by
// sync_to_xmp.
async function _syncRefreshPreviewAfterDiscard() {
  if (!_syncModalOpen) return;
  await _syncStartPreviewLoad(0);
}

async function discardSyncChanges(changeIds) {
  if (!_syncPreviewComplete || !changeIds || changeIds.length === 0) return;
  try {
    await safeFetch('/api/sync/discard', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({change_ids: changeIds}),
    });
    await _syncRefreshPreviewAfterDiscard();
  } catch(e) {}
}

function discardChange(changeId) {
  return discardSyncChanges([changeId]);
}

function discardPhotoChanges(changeIds) {
  return discardSyncChanges(changeIds);
}

async function discardAllChanges() {
  if (!_syncPreviewComplete || !_syncPreviewData) return;
  if (!confirm('Discard ALL pending changes? Nothing will be written to XMP.')) return;
  try {
    await safeFetch('/api/sync/discard', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        discard_all: true,
        revision: _syncPreviewData.revision,
      }),
    });
    closeSyncPreview();
  } catch(e) {
    if (e && e.code === 'sync_preview_changed' && _syncModalOpen) {
      await _syncStartPreviewLoad(0);
    }
  }
}

function toggleSyncFilter(type) {
  if (_syncActiveFilters.has(type)) {
    _syncActiveFilters.delete(type);
  } else {
    _syncActiveFilters.add(type);
  }
  _syncPreviewDisplayLimit = 300;
  renderSyncPreview();
}
</script>
