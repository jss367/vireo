<!-- Sync banner: pending changes indicator -->
<div id="syncBanner" style="display:none;background:var(--bg-tertiary);padding:10px 20px;border-bottom:1px solid var(--border-primary);font-size:13px;align-items:center;gap:12px;">
  <span id="syncBannerText" style="color:var(--warning);"></span>
  <button type="button" id="syncBannerReviewButton" style="background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-secondary);border-radius:4px;padding:5px 14px;font-size:12px;cursor:pointer;">Review Changes</button>
  <button type="button" id="syncBannerSyncButton" style="background:var(--accent);color:var(--accent-text);border:none;border-radius:4px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:500;">Sync to XMP</button>
  <span id="syncStatus" style="font-size:12px;color:var(--text-dim);"></span>
</div>

<!-- Sync Preview Modal -->
<div id="syncPreviewOverlay" style="display:none;position:fixed;inset:0;z-index:9996;background:rgba(0,0,0,0.85);overflow-y:auto;">
  <div style="max-width:850px;margin:40px auto;background:var(--bg-secondary);border-radius:8px;padding:24px;position:relative;">
    <button type="button" id="syncPreviewCloseButton" aria-label="Close" style="position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text-muted);font-size:24px;cursor:pointer;">&times;</button>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
      <h2 style="font-size:16px;color:var(--accent);margin:0;">Review Pending Changes</h2>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin-left:auto;">
        <input type="range" id="syncThumbSize" min="60" max="600" value="120" step="20"
               data-view-preference="vireo.syncPreview.thumbSize"
               style="width:80px;accent-color:var(--accent);">
        <span id="syncThumbSizeVal" style="min-width:32px;">120px</span>
      </label>
    </div>
    <div id="syncPreviewProgress" class="sync-preview-progress" role="status" aria-live="polite">
      <div style="display:flex;align-items:center;gap:12px;">
        <strong id="syncPreviewProgressText" style="color:var(--text-primary);font-size:13px;">Preparing review...</strong>
        <span id="syncPreviewProgressPercent" style="margin-left:auto;color:var(--text-dim);font-size:12px;"></span>
      </div>
      <div id="syncPreviewProgressTrack" class="sync-preview-progress-track" role="progressbar" aria-label="Preparing pending-change review" aria-valuemin="0">
        <div id="syncPreviewProgressBar" class="sync-preview-progress-bar"></div>
      </div>
      <div id="syncPreviewProgressDetail" style="color:var(--text-ghost);font-size:11px;"></div>
    </div>
    <div id="syncPreviewContent">Loading...</div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
      <button type="button" id="syncPreviewDiscardAllButton" style="background:none;color:var(--danger);border:1px solid var(--danger);border-radius:4px;padding:6px 14px;font-size:12px;cursor:pointer;">Discard All</button>
      <button type="button" id="syncPreviewSyncButton" style="background:var(--accent);color:var(--accent-text);border:none;border-radius:4px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:500;">Sync to XMP</button>
    </div>
  </div>
</div>

<style>
  .sync-review-note {
    margin: 0 0 14px;
    padding: 10px 12px;
    border: 1px solid var(--border-secondary);
    border-radius: 6px;
    background: var(--bg-tertiary);
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.45;
  }
  .sync-review-groups { display: flex; flex-direction: column; gap: 12px; }
  .sync-review-group {
    padding: 14px;
    border: 1px solid var(--border-subtle);
    border-radius: 7px;
    background: var(--bg-primary);
  }
  .sync-review-group-header { display: flex; align-items: flex-start; gap: 10px; }
  .sync-review-group-title { color: var(--text-primary); font-size: 14px; font-weight: 650; }
  .sync-review-group-discard {
    padding: 4px 10px;
    border: 1px solid currentColor;
    border-radius: 4px;
    background: none;
    color: var(--danger);
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .sync-review-group-discard:not(:disabled):hover {
    background: var(--danger);
    color: var(--danger-text);
    border-color: var(--danger);
  }
  .sync-review-group-discard:focus-visible {
    outline: 2px solid var(--danger);
    outline-offset: 2px;
  }
  .sync-review-delta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 7px;
    color: var(--text-primary);
    font-size: 13px;
  }
  .sync-review-before { color: var(--text-dim); }
  .sync-review-arrow { color: var(--text-ghost); }
  .sync-review-after { color: var(--text-primary); font-weight: 600; }
  .sync-review-detail { margin-top: 4px; color: var(--text-dim); font-size: 11px; }
  .sync-review-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .sync-preview-photo { position: relative; min-width: 0; max-width: 100%; }
  .sync-preview-photo img { max-width: 100%; }
  .sync-preview-filename {
    margin-top: 5px;
    padding-right: 20px;
    overflow: hidden;
    color: var(--text-ghost);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sync-preview-discard {
    position: absolute;
    right: 0;
    bottom: -2px;
    border: 0;
    background: none;
    color: var(--text-ghost);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .sync-preview-discard:hover { color: var(--danger); }
  .sync-preview-progress {
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border-secondary);
    border-radius: 6px;
    background: var(--bg-tertiary);
  }
  .sync-preview-progress-track {
    height: 5px;
    margin: 8px 0 6px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--border-primary);
  }
  .sync-preview-progress-bar {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 180ms ease-out;
  }
  .sync-preview-progress-bar.is-preparing {
    width: 32%;
    animation: sync-preview-preparing 1.2s ease-in-out infinite alternate;
  }
  @keyframes sync-preview-preparing {
    from { transform: translateX(-85%); }
    to { transform: translateX(300%); }
  }
  #syncPreviewOverlay button:disabled {
    cursor: not-allowed !important;
    opacity: 0.45;
  }
  .sync-lightbox-action:disabled {
    cursor: not-allowed !important;
    opacity: 0.45;
  }
  .sync-preview-more {
    margin-top: 12px;
    padding: 10px;
    border: 1px dashed var(--border-secondary);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }
</style>

<script defer src="/static/sync-panel/state.js"></script>
<script defer src="/static/sync-panel/status.js"></script>
<script defer src="/static/sync-panel/run.js"></script>
<script defer src="/static/sync-panel/preview-load.js"></script>
<script defer src="/static/sync-panel/preview-render.js"></script>
<script defer src="/static/sync-panel/preview-actions.js"></script>
<script defer src="/static/sync-panel/lightbox-panel.js"></script>
<script defer src="/static/sync-panel/boot.js"></script>
