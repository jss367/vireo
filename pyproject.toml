[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vireo"
version = "0.51.0"
description = "AI-powered wildlife photo organizer"
requires-python = ">=3.14"
dependencies = [
    "certifi>=2024.0.0",
    "flask>=3.1.3",
    "huggingface_hub>=1.4.1",
    "imagehash>=4.3.2",
    "numpy>=2.4.2",
    "onnxruntime>=1.22.0",
    "Pillow>=12.1.1",
    "rawpy>=0.26.1",
    "requests>=2.32.0",
    "scipy>=1.17.1",
    "exifread>=3.0",
    "send2trash>=1.8.0",
    "tokenizers>=0.21.0",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
export = [
    "torch>=2.6",
    "torchvision>=0.21",
    "pybioclip>=2.1.1",
    "PytorchWildlife>=1.2.4.2",
    "timm>=1.0",
    "sam2>=1.0",
    "open_clip_torch>=2.0",
    "onnx>=1.17",
    "onnxscript>=0.1",
    # Pose model exporters have incompatible NumPy requirements. Install
    # their standalone environments from scripts/model-export/ instead.
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.7",
    "pytest-rerunfailures>=15.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "psutil>=7.0",
    "ruff>=0.15.8",
    "pre-commit>=3.5",
]

[tool.setuptools.packages.find]
include = ["vireo*"]

# Non-Python runtime assets. `packages.find` only discovers Python packages,
# so without this a wheel / non-editable install ships *only* .py files:
# `load_scientific_synonyms()` silently loads `{}` (outdated binomials such as
# "Bubulcus ibis" stop resolving and reappear as raw model disagreements), and
# Flask has no templates or static assets at all. `test_packaging.py` asserts
# these patterns still cover every tracked asset.
[tool.setuptools.package-data]
vireo = [
    "data/**/*.json",
    "templates/**/*.html",
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "vireo/tests"]
markers = ["e2e: end-to-end browser tests (require Playwright)"]
addopts = "--ignore=tests/e2e"

[tool.coverage.run]
# Store repo-relative paths in coverage data so the test-impact map built on
# CI (``--cov-context=test``, see .github/workflows/test-main.yml) can be read
# by ``scripts/select_tests.py`` from any checkout location.
relative_files = true
# The test-impact map needs per-test dynamic contexts. coverage's
# ``sys.monitoring`` core (the default on Python 3.12+) disables a line's
# event after its first hit, so a line executed again by a later test is never
# attributed to that test and whole parametrized siblings vanish from the map.
# The C tracer records every context correctly; the map validator in
# ``scripts/select_tests.py build-map`` rejects the sysmon-shaped result.
core = "ctrace"

[tool.coverage.report]
# test-main.yml measures ``tests/`` and ``scripts/`` so the impact map has a
# context for every test, but the coverage percentage stays what it always
# was: ``vireo/**`` (which includes ``vireo/tests``). Patterns are anchored
# at the path start, so ``tests/*`` does not touch ``vireo/tests``.
omit = ["tests/*", "scripts/*"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "B010",   # do not call setattr with a constant
    "SIM108", # ternary operator
    "UP031",  # printf-style formatting
]

# Standalone pose exporters run in separate Python 3.11 environments.
[tool.ruff.per-file-target-version]
"scripts/export_onnx.py" = "py311"

[tool.ruff.lint.per-file-ignores]
"vireo/tests/*" = ["E402", "B011", "F841", "SIM115", "SIM117"]
"tests/*" = ["E402", "B017", "F841"]
"tests/e2e/*" = ["E402", "B017", "F841"]
# -- production code: pre-existing violations, fix in dedicated cleanup PR --
"vireo/app.py" = ["B007", "F841", "SIM105", "SIM118"]
# I001 surfaces only under newer ruff in CI (the bare `from metadata import`
# is classified differently there than locally); unrelated to this PR.
"vireo/capture_time.py" = ["I001"]
"vireo/classifier.py" = ["B905"]
"vireo/classify_job.py" = ["F821", "SIM105"]
"vireo/culling.py" = ["B007", "F841", "SIM105"]
"vireo/detector.py" = ["B904"]
"vireo/dino_embed.py" = ["B904"]
"vireo/importer.py" = ["B007"]
"vireo/jobs.py" = ["SIM105"]
"vireo/masking.py" = ["B904"]
"vireo/models.py" = ["B904", "F401"]
"vireo/quality.py" = ["B905"]
"vireo/selection.py" = ["F841"]
"vireo/sharpness.py" = ["SIM105", "SIM118"]
"vireo/taxonomy.py" = ["B905"]
# -- test files: violations not covered by vireo/tests/* glob --
"vireo/tests/test_culling.py" = ["E702", "E731"]
"vireo/tests/test_detector.py" = ["F401"]
"vireo/tests/test_dinov2.py" = ["B007"]
